# Prometheus, blackbox and Alertmanager, as an OVERLAY on the staging stack.
#
#     docker compose --env-file deploy/staging/.env.staging \
#       -f docker-compose.staging.yml -f docker-compose.observability.yml up -d
#
# or, with the checks and the teardown around it:
#
#     pnpm run alerts:verify
#
# An overlay because docker-compose.staging.yml claims to be the stack production runs, and a real
# deployment gets monitoring from its platform; staging must also stay a complete rehearsal without
# it. The shared project name puts these containers on the staging network, so they reach `api:3001`
# without publishing anything.
#
# ## What this proves, and what it does not
#
# It proves the delivery path: a metric condition on the real API fires a rule in a real Prometheus,
# is routed by severity in a real Alertmanager, and is delivered over an HTTP webhook and over SMTP
# (EHLO / MAIL FROM / RCPT TO / DATA, an RFC822 message whose recipient, `Subject:` and body are
# asserted). `blackbox` looks from OUTSIDE the application, through the proxy over TLS.
#
# It does not prove a pager rings: both sinks are `scripts/alert-delivery.mjs`'s own. Unrehearsed:
# that a provider accepts the deployment's credentials, that the configured address is one somebody's
# phone watches, and that the person holding it is awake.
#
# ## alertmanager.yml is rendered, not committed
#
# `alert-delivery.mjs` renders `deploy/staging/observability/alertmanager.template.yml` with the
# deployment's own webhook URLs, recipients and SMTP relay before bringing these containers up, so
# a clean checkout has no alertmanager.yml. By hand, first run:
#
#     node scripts/alert-delivery.mjs --render-config

name: poker-risk-lab-staging

services:
  prometheus:
    # `ci-pinning.mjs` fails a compose image named by tag alone.
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    pull_policy: missing
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # More than any verification run needs, and bounded on a laptop.
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    volumes:
      - ./deploy/staging/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/staging/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      # Written by `scripts/alert-delivery.mjs` from PRL_STAGING_METRICS_TOKEN;
      # gitignored, because it is the credential that reads /metrics.
      - ./deploy/staging/observability/metrics-token:/etc/prometheus/metrics-token:ro
    ports:
      # Loopback only: Prometheus has no authentication and its query API reads every series.
      - '127.0.0.1:${PRL_STAGING_PROMETHEUS_PORT:-9090}:9090'
    extra_hosts:
      # Docker Desktop resolves host.docker.internal already; this is what makes
      # the same alertmanager.yml work on Linux.
      - 'host.docker.internal:host-gateway'
    # TSDB on a tmpfs: the stack lives for one verification run, and surviving history would be a
    # second, unversioned record of what staging did.
    read_only: true
    tmpfs:
      - /prometheus:mode=0700,uid=65534,gid=65534,size=256m
      - /tmp:mode=1777,noexec,nosuid,size=16m
    # 10 MiB × 3 = 30 MiB; see docker-compose.yml's header ("Why every service has a `logging:`
    # block"). Retention bounds the METRICS, not the LOG: a refused target logs a scrape failure per
    # interval, indefinitely, during exactly the outage being debugged.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # The probe: "does the site answer?", from outside the application, through the proxy, over TLS.
  # Without it nginx, TLS or the page server dying leaves `up{job="prl-api"}` and
  # `prl_readiness_state` at 1, and nothing fires; see deploy/staging/observability/blackbox.yml.
  # Its `probe_ssl_earliest_cert_expiry` is the only watch on the ninety-day staging certificate.
  blackbox:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    pull_policy: missing
    restart: unless-stopped
    init: true
    # No `depends_on:` on the proxy: `alert-delivery.mjs` uses `--force-recreate`, which recreates
    # dependencies too, and a probe must not restart the thing it observes. The first probe after a
    # cold start may fail while nginx loads TLS; `for: 2m` on PublicOriginDown absorbs it.
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./deploy/staging/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      # The local CA only, never the leaf or the key: a container that cannot read the key cannot
      # leak it. From `pnpm run staging init`, gitignored and dockerignored.
      - ./deploy/staging/tls/staging-ca.pem:/etc/blackbox/tls/staging-ca.pem:ro
    # No `ports:`: an open /probe endpoint makes this host issue arbitrary outbound requests.
    # Prometheus reaches it as `blackbox:9115`.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    # 10 MiB × 3 = 30 MiB, for the same reason as prometheus above.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    pull_policy: missing
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Rendered by `scripts/alert-delivery.mjs` from alertmanager.template.yml;
      # gitignored, because it names this deployment's real paging destinations.
      - ./deploy/staging/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # For `smtp_auth_password_file` when PRL_ALERT_SMTP_USERNAME is set. Written every run, empty
      # if unused, because a missing bind-mount source becomes a DIRECTORY, which Alertmanager reports
      # as an unreadable password.
      - ./deploy/staging/observability/smtp-password:/etc/alertmanager/smtp-password:ro
    ports:
      - '127.0.0.1:${PRL_STAGING_ALERTMANAGER_PORT:-9093}:9093'
    extra_hosts:
      # Both sinks run on the host, so the rendered `url:` and `smtp_smarthost:` resolve through this.
      - 'host.docker.internal:host-gateway'
    read_only: true
    tmpfs:
      # Notification log and silences; losing them is correct, as for the TSDB above.
      - /alertmanager:mode=0700,uid=65534,gid=65534,size=32m
      - /tmp:mode=1777,noexec,nosuid,size=16m
    # 10 MiB × 3 = 30 MiB, as for prometheus: a refusing smarthost logs an error per retry, forever.
    # These lines quote the failed notification, so they carry on-call addresses and alert text
    # (legal register §7 recipients); the cap bounds them and does not make the log non-sensitive.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
