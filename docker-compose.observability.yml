# ---------------------------------------------------------------------------
# Prometheus and Alertmanager, as an OVERLAY on the staging stack.
#
#     docker compose --env-file deploy/staging/.env.staging \
#       -f docker-compose.staging.yml -f docker-compose.observability.yml up -d
#
# or, with the checks and the teardown around it:
#
#     pnpm run alerts:verify
#
# ## Why an overlay and not two more services in docker-compose.staging.yml
#
# That file is a deployment manifest and its header says what makes it one: no
# `build:` anywhere, both application services pinned to a content digest from the
# release manifest, and `staging promote` refusing a digest staging did not test.
# Its claim is "this is the stack production runs". Prometheus and Alertmanager are
# not part of that stack — a real deployment gets them from its platform, its cloud
# provider or a separate operations repository — so putting them in that file would
# make it describe a deployment nobody performs.
#
# They are also not needed to run staging. `pnpm run staging up` must stay a
# complete rehearsal on its own, and it does: this file is additive and optional,
# and the same project name puts these two containers on the staging network so
# they can reach `api:3001` without publishing anything.
#
# ## What this proves, and what it does not
#
# It proves the delivery path: a metric condition on the real API becomes a firing
# rule in a real Prometheus, is routed by severity in a real Alertmanager, and is
# handed to a receiver over two different transports. One is an HTTP webhook. The
# other is SMTP: Alertmanager opens a TCP connection, speaks EHLO / MAIL FROM /
# RCPT TO / DATA to a server that answers in the protocol, and delivers an RFC822
# message whose envelope recipient, `Subject:` and body are asserted against what
# the routing intended. That message is byte-for-byte the one a provider's relay
# would have received.
#
# It also brings up a third service, `blackbox`, which is the only thing here that
# looks at the deployment from OUTSIDE the application: a real HTTPS request through
# the proxy, every 15 seconds, verified against the CA. Before it existed, a total
# user-facing outage — dead proxy, expired certificate, dead page server — fired
# nothing at all, because Prometheus scrapes the API on the compose network and the
# API's healthcheck targets its own container. See prometheus.yml's `prl-public-origin`
# job for the whole argument.
#
# It does not prove that a pager rings. The SMTP server on the other end is
# `scripts/alert-delivery.mjs`'s own sink, not a relay that forwards anywhere, and
# the webhook sink is likewise local. What is unrehearsed is now precisely three
# things and no longer the whole last hop: that a provider accepts the credentials
# a deployment gives it, that the address configured is one somebody's phone
# actually watches, and that the person holding the phone is awake.
#
# ## alertmanager.yml is rendered, not committed
#
# The file mounted below does not exist in a clean checkout.
# `deploy/staging/observability/alertmanager.template.yml` is the source, and
# `alert-delivery.mjs` renders it — substituting the deployment's own webhook URLs,
# email recipients and SMTP relay — before it brings these containers up, the same
# way it already renders `metrics-token`. Bringing the overlay up by hand therefore
# needs one command first:
#
#     node scripts/alert-delivery.mjs --render-config
#
# The alternative was a tracked file whose destinations are changed by editing it,
# which is what made "no human is paged" a residual for as long as it was one.
# ---------------------------------------------------------------------------

name: poker-risk-lab-staging

services:
  prometheus:
    # Pinned by digest, like every other image in this deployment: `ci-pinning.mjs`
    # fails a compose file that names an image by tag alone, and an alerting stack
    # that silently changed underneath a verification run would invalidate the run.
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    pull_policy: missing
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Two hours is more than any verification run needs and keeps the container's
      # disk use bounded on a laptop.
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    volumes:
      - ./deploy/staging/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/staging/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      # Written by `scripts/alert-delivery.mjs` from PRL_STAGING_METRICS_TOKEN;
      # gitignored, because it is the credential that reads /metrics.
      - ./deploy/staging/observability/metrics-token:/etc/prometheus/metrics-token:ro
    ports:
      # Loopback, so the verification script can query it. Prometheus has no
      # authentication of its own and its query API can read every series, which is
      # exactly why this is not on a routable address.
      - '127.0.0.1:${PRL_STAGING_PROMETHEUS_PORT:-9090}:9090'
    extra_hosts:
      # Docker Desktop resolves host.docker.internal already; this is what makes
      # the same alertmanager.yml work on Linux.
      - 'host.docker.internal:host-gateway'
    # Read-only, like every service in docker-compose.staging.yml, with the TSDB on
    # a tmpfs rather than a volume. That is not a compromise here: this stack exists
    # for the length of one verification run, and a Prometheus whose history
    # survives it would be a second, unversioned record of what staging did.
    read_only: true
    tmpfs:
      - /prometheus:mode=0700,uid=65534,gid=65534,size=256m
      - /tmp:mode=1777,noexec,nosuid,size=16m
    # 10 MiB × 3 = 30 MiB. The full argument for capping every service is in
    # docker-compose.yml's header ("Why every service has a `logging:` block"); the
    # short version is that Docker's `json-file` driver is unbounded without
    # `max-size`, and a full Docker host takes Postgres down with it.
    #
    # The specific shape of this service's bad day is worth naming, because it is
    # the opposite of the TSDB cap two lines up. `--storage.tsdb.retention.time=2h`
    # bounds the METRICS; it says nothing about the LOG. A Prometheus whose target
    # is refusing connections logs a scrape failure per target per scrape interval,
    # indefinitely — a steady, unbounded stream produced precisely during the
    # outage somebody is trying to debug, on the stack whose job is to notice
    # outages. Three files is enough: these lines are repetitive by construction
    # and the fiftieth identical scrape failure adds nothing the first did not.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # The probe. Everything else in this stack asks the API about itself; this asks
  # the deployment the question a learner asks — "does the site answer?" — from
  # outside the application, through the proxy, over TLS.
  #
  # Without it a total user-facing outage fires nothing at all: Prometheus scrapes
  # `api:3001` on the compose network and the API's healthcheck targets its own
  # container, so nginx, TLS or the page server dying leaves `up{job="prl-api"}` at
  # 1, `prl_readiness_state` at 1, and the request counters merely flat — which no
  # rule reads. The full argument, and what a probe does and does not prove, is in
  # deploy/staging/observability/blackbox.yml.
  #
  # It also exports `probe_ssl_earliest_cert_expiry` for free, which is the only
  # thing in this repository that watches the certificate. The staging leaf is
  # ninety days; nothing had ever noticed one expiring.
  blackbox:
    # Pinned by digest for the same reason as the two services around it.
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    pull_policy: missing
    restart: unless-stopped
    init: true
    # No `depends_on:` on the proxy, deliberately, and it is not an oversight.
    # `alert-delivery.mjs` brings this overlay up with `--force-recreate`, which
    # recreates dependencies as well as named services — so declaring the proxy here
    # would make every verification run recreate the deployment's own front door. A
    # probe must not be able to restart the thing it observes. The cost of leaving it
    # out is that the first probe or two after a cold start can fail while nginx is
    # loading its TLS material, which `for: 2m` on PublicOriginDown already absorbs.
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./deploy/staging/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      # The local CA only — never the leaf and never the key. The probe verifies a
      # chain; it does not serve one, and a container that cannot read the private
      # key cannot leak it. Generated by `pnpm run staging init` into a directory
      # that is gitignored and dockerignored.
      - ./deploy/staging/tls/staging-ca.pem:/etc/blackbox/tls/staging-ca.pem:ro
    # No `ports:`. Nothing outside the compose network has any business asking this
    # exporter to fetch a URL — an open /probe endpoint is a request forwarder, and
    # publishing it would hand anybody who can reach it a way to make this host
    # issue arbitrary outbound requests. Prometheus reaches it as `blackbox:9115`.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    # 10 MiB × 3, and the same shape of bad day as prometheus above: the one time
    # this container logs steadily is while the thing it probes is refusing
    # connections — an error per target per scrape interval, indefinitely, produced
    # precisely during the outage somebody is trying to debug.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    pull_policy: missing
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Rendered by `scripts/alert-delivery.mjs` from alertmanager.template.yml;
      # gitignored, because it names this deployment's real paging destinations.
      - ./deploy/staging/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # The SMTP submission password, referenced by `smtp_auth_password_file` when
      # a deployment sets PRL_ALERT_SMTP_USERNAME. Written every run — empty when
      # no username is configured — because a bind mount whose source is missing
      # resolves to a DIRECTORY, and Alertmanager reports that as an unreadable
      # password rather than as a missing file.
      - ./deploy/staging/observability/smtp-password:/etc/alertmanager/smtp-password:ro
    ports:
      - '127.0.0.1:${PRL_STAGING_ALERTMANAGER_PORT:-9093}:9093'
    extra_hosts:
      # The webhook sink and the SMTP sink both run on the host, so both the
      # `url:` and the `smtp_smarthost:` in the rendered config resolve through
      # this entry.
      - 'host.docker.internal:host-gateway'
    read_only: true
    tmpfs:
      # Alertmanager's notification log and silences. Losing them with the
      # container is correct here for the same reason as the TSDB above.
      - /alertmanager:mode=0700,uid=65534,gid=65534,size=32m
      - /tmp:mode=1777,noexec,nosuid,size=16m
    # 10 MiB × 3 = 30 MiB, same reasoning as prometheus above and the same shape of
    # bad day: an SMTP smarthost that refuses the submission produces a delivery
    # error per notification per retry, forever, and the thing being retried is an
    # alert about something already broken. See docker-compose.yml's header.
    #
    # One caution that belongs on THIS service and no other: its log lines quote
    # the notification it failed to send, so they carry on-call addresses and alert
    # text. The register lists the SMTP smarthost as a recipient of exactly that
    # (§7 recipients table); this cap bounds how much of it accumulates on the
    # Docker host, and does not make the log non-sensitive.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
