# Local development and local end-to-end stack for Poker Risk Lab. Not a deployment manifest: the
# credentials are dev defaults in plain sight and every port binds to loopback.
#
# ## First run
#
#   1. Put a session secret in .env FIRST. `api` reads `${SESSION_COOKIE_SECRET:?...}` and compose
#      interpolates the WHOLE file even for one service, so without it even `db:up`
#      (`docker compose up -d postgres`) exits 1 with "required variable SESSION_COOKIE_SECRET is
#      missing a value". .env is gitignored and dockerignored, so it never reaches an image layer.
#
#          cp .env.example .env      # if you have not already
#          node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))"
#          # paste that into SESSION_COOKIE_SECRET in .env
#
#   2. Start the database and prepare the schema (`db:setup` is
#      `db:up && db:wait && db:migrate && db:seed`). Docker must be running.
#
#          pnpm install --frozen-lockfile
#          pnpm run db:setup
#
#   3. Run from source (hot reload) or the way it ships:
#
#          pnpm run dev                     # api on :3001, web on :3000
#          docker compose up -d --build     # app on http://localhost:3000
#
#   4. Useful afterwards:
#
#          docker compose ps                # service states, with health
#          pnpm run db:migrate:status       # what has been applied
#          pnpm run db:reset --confirm-database poker_risk_lab
#                                           # drop, migrate, seed again. The name has to match
#                                           # the database DATABASE_MIGRATION_URL/DATABASE_URL
#                                           # is on: NODE_ENV is not a guard for a command run
#                                           # from the host.
#          pnpm run db:down                 # stop postgres (volume survives)
#          docker compose down -v           # stop everything AND delete the data
#
# Migrations run from the host, not the api container: the image does not ship apps/api/scripts
# (see Dockerfile.api), which is why the database port is published to 127.0.0.1.
#
# ## The topology: ONE origin the browser can see
#
#   browser ──▶ 127.0.0.1:3000 ──▶ proxy ──▶ /api/*  ──▶ api:3001
#                                        └─▶ anything else ──▶ web:3000
#
# `/api/*` is every REST route (API_PREFIX is /api/v1) and the WebSocket upgrade at /api/v1/ws.
#
# The browser sends API requests to its own origin as relative paths, so the bundle carries no API
# address (a `NEXT_PUBLIC_*` value would be inlined by `next build` and frozen into the image), and
# retargeting is `PRL_PROXY_API_UPSTREAM`, a container replacement rather than an image build:
#
#         PRL_PROXY_API_UPSTREAM=api:3001 docker compose up -d proxy   # normal
#         PRL_PROXY_API_UPSTREAM=nowhere:3001 docker compose up -d proxy
#         curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/api/v1/health
#
#   * The session and CSRF cookies are `__Host-` prefixed with no `Domain`
#     (apps/api/src/plugins/security.ts), which only works when the page and the API share a host.
#   * `web` is NOT published: a second origin is one whose relative /api/* leads nowhere. `api` IS
#     published, on loopback, for host-side tooling — see the note on TRUST_PROXY there.
#
# `pnpm run dev` gets the same single-origin shape from a rewrite in apps/web/next.config.ts.
#
# ## Why `init: true` on every service
#
# PID 1 has no default signal handlers, so a plain `node server.js` ignores SIGTERM and
# `docker compose down` SIGKILLs it after the grace period; PID 1 also has to reap orphans.
# `init: true` inserts Docker's own init (docker-init) as PID 1, which is why the images carry no
# tini or dumb-init.
#
# ## Why read_only with explicit tmpfs mounts
#
# A root filesystem that cannot be written cannot have its code rewritten by a foothold. Everything
# that must write gets a named volume or an explicit tmpfs with its reason. An EROFS after an upgrade
# means adding that path here on purpose, not dropping read_only.
#
# ## Why every service has a `logging:` block, and why the numbers differ
#
# THE CANONICAL EXPLANATION; the staging and observability compose files point here.
#
# Docker's default `json-file` driver with no `max-size` is UNBOUNDED and nothing rotates it. A
# container logging a line per request fills the Docker host's disk, Postgres can no longer write
# WAL, and every container on the host goes down with it. `read_only: true` does not help: the
# daemon writes the log, outside the container's filesystem.
#
# The caps differ because the write rates do:
#
#   api           20m x 5 = 100 MiB  a JSON line per HTTP request AND per WebSocket event, and the
#                                    log an incident is reconstructed from.
#   proxy         10m x 5 =  50 MiB  a line per request, but a narrow one.
#   postgres      10m x 3 =  30 MiB  near-silent (neither log_statement nor
#                                    log_min_duration_statement is set); capped for the day
#                                    someone sets log_min_duration_statement=0 and forgets.
#   web           10m x 3 =  30 MiB  startup and errors, but one bad render in a hot route is a
#                                    stack trace per request.
#
# 210 MiB for the whole stack, worst case. docker-compose.staging.yml carries the same per-service
# numbers and `scripts/supply-chain/log-policy.mjs` asserts a service present in both has the same
# cap in both. A production deployment should raise these deliberately, in one place.
#
# ## Why there is no logrotate
#
# The daemon owns and holds these files open: renaming one leaves it writing to an unlinked inode,
# and `copytruncate` races its writes. `max-size`/`max-file` IS Docker's rotation.
#
# A size cap bounds HOW MUCH, never HOW LONG (a 100 MiB api log is months when idle, an afternoon
# under load), so it does not implement "kept for N days"; §2.10 of docs/production/legal-register.md
# says so.

name: poker-risk-lab

services:
  postgres:
    # postgres:16-bookworm, multi-arch index digest. Refresh with the registry command in the
    # Dockerfile.api header, substituting library/postgres and 16-bookworm.
    image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
    # `unless-stopped` restarts a crash but respects a deliberate `docker compose stop`.
    restart: unless-stopped
    init: true
    environment:
      # Dev defaults, overridable from the environment or .env. Not secrets, and not pretending to be.
      POSTGRES_USER: ${POSTGRES_USER:-poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poker-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-poker_risk_lab}
      # SCRAM over the default; one line, so no reason to hash weakly.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      # Loopback, not 0.0.0.0: the unqualified "5432:5432" publishes the database on every interface.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      # The postmaster writes its unix socket and lock file here...
      - /var/run/postgresql:mode=1777
      # ...and temporary sort/hash spill files here.
      - /tmp:mode=1777
    # 10 MiB × 3 = 30 MiB; see this file's header, "Why every service has a `logging:` block".
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # Against the real user and database, not just the port: during initdb the server briefly
      # listens while rejecting connections, and a port-only check calls that healthy.
      test:
        ['CMD-SHELL', 'pg_isready --quiet --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      # Covers a cold initdb on a slow disk without making a broken database look like a hang.
      start_period: 60s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        # Healthy, not merely started: the healthcheck above passed.
        condition: service_healthy
    # ONE replica is correctness, not sizing: live table state is in process memory, so two processes
    # serving one room deal two different hands (ADR 0001, docs/RUNBOOK.md §11).
    deploy:
      replicas: 1
    environment:
      # Every variable here is one `loadConfig` (apps/api/src/config.ts) reads.
      #
      # NODE_ENV: the image ships production and this stack is plaintext on loopback. The production
      # profile refuses an `http://` PUBLIC_WEB_ORIGIN and COOKIE_SECURE=false, correctly (a Secure
      # cookie is never sent over http), so this is a development stack. The production profile is in
      # docs/RUNBOOK.md §11.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: '3001'
      # HOST is 0.0.0.0 in Dockerfile.api's runtime ENV, in the image so a bare `docker run` is
      # reachable too; config.ts defaults it to 127.0.0.1, "healthy and unreachable" in a container.
      #
      # The host-side scripts read DATABASE_URL from .env; this is the containers' one copy.
      #
      # The USER is `prl_api`, never the superuser `poker` (rolsuper, rolbypassrls), so a query needing
      # a grant `prl_app` does not hold fails here rather than first in production. `prl_app` and
      # `prl_migrator` (db/migrations/0001_initial.sql) are NOLOGIN privilege containers; `prl_api` is
      # a login MEMBER of `prl_app` (docs/RUNBOOK.md §5).
      #
      # `prl_api` is created with this password by `db/seeds/0002_dev_login_roles.sql` (`pnpm run
      # db:seed`, part of `db:setup`). `password authentication failed for user "prl_api"` means run
      # that, not a superuser in this line. A real deployment creates the role with a password from a
      # secret manager (RUNBOOK §5) and sets PRL_API_DB_PASSWORD.
      DATABASE_URL: postgres://${PRL_API_DB_USER:-prl_api}:${PRL_API_DB_PASSWORD:-poker-dev-only}@postgres:5432/${POSTGRES_DB:-poker_risk_lab}
      # The origin the BROWSER uses: the proxy's published address. Enforced on WebSocket upgrades
      # (WS_CLOSE.badOrigin) and CSRF checks, so a wrong value shows as "every socket closes 4406".
      # Both spellings, because a reader may type either.
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      # No default: a fallback would be a signing key in a public repository that development accepts.
      # Quoted because the message contains a colon-space, which YAML would read as a mapping.
      SESSION_COOKIE_SECRET: '${SESSION_COOKIE_SECRET:?missing. Put a generated value in .env — step 1 of First run at the top of this file}'
      # TRUST_PROXY is NOT enabled: api is also published on loopback, so the proxy is not the only
      # route to it, and a reachable process that believes X-Forwarded-For lets a client choose its
      # own rate-limit bucket. Rate limits therefore key on the proxy's address here. A deployment
      # that does not publish the API sets TRUST_PROXY=true (docs/RUNBOOK.md §11).
      #
      # ## The shutdown pair, with `stop_grace_period` below.
      #
      # SHUTDOWN_GRACE_MS is how long the process gives ITSELF to drain after SIGTERM (requests,
      # `serverShuttingDown` close frames, pool, workers) before logging `shutdown timed out; exiting
      # hard` and exiting 1. stop_grace_period is how long DOCKER waits before SIGKILL. Both default
      # to 10 s, and a tie is a race: `docker compose stop` measured 10.62 s / exit 137 with one socket
      # open. The app must ALWAYS reach its own deadline first, so the container's is three times the
      # process's. Change one and you must change the other.
      SHUTDOWN_GRACE_MS: '10000'
    # Must stay comfortably ABOVE SHUTDOWN_GRACE_MS; see "The shutdown pair" above.
    stop_grace_period: 30s
    ports:
      # Loopback only, and NOT the browser's path (that is the proxy): for `curl` and scripts/*.mjs.
      - '127.0.0.1:${API_PORT:-3001}:3001'
    read_only: true
    tmpfs:
      # Diagnostic reports, heap snapshots, os.tmpdir(). noexec/nosuid: nothing here should run.
      - /tmp:mode=1777,noexec,nosuid,size=64m
    # 20 MiB × 5 = 100 MiB; see this file's header, "Why every service has a `logging:` block".
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    # On top of the image's non-root USER: no process here can gain a capability it did not start with.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    init: true
    depends_on:
      # web never talks to PostgreSQL, but before it is ready the first pages render error states.
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      # Server-render origin for the api, read at runtime by apps/web/src/lib/api.ts. Never
      # `NEXT_PUBLIC_`, which `next build` inlines into the bundle. The browser must not use it; see the
      # topology note in this file's header.
      PRL_API_ORIGIN: ${PRL_API_ORIGIN:-http://api:3001}
    # No `ports`: a second origin is one on which relative /api/* goes nowhere. For a direct look,
    # `docker compose exec proxy wget -qO- http://web:3000/`.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=64m
      # `next start` writes ISR output and optimised images to .next/cache, which the image does not
      # ship. It is cache, so losing it on restart is correct.
      - /app/apps/web/.next/cache:mode=0700,uid=1000,gid=1000,size=256m
    # 10 MiB × 3 = 30 MiB; see this file's header, "Why every service has a `logging:` block".
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # proxy: the single origin the browser sees (see this file's header).
  #
  # ## Why THIS image
  #
  # The official `nginx` and `caddy` images ship a binary with the file capability
  # `cap_net_bind_service=ep`, and under `cap_drop: ALL` exec'ing it fails outright:
  #
  #   $ docker run --cap-drop ALL --user 1000:1000 caddy:2.11.4-alpine caddy version
  #   sh: caddy: Operation not permitted
  #
  # `nginxinc/nginx-unprivileged` runs as uid 101 on 8080 with no file capabilities, so neither
  # `cap_add: [NET_BIND_SERVICE]` nor dropping `cap_drop: ALL` is needed.
  #
  # ## Why the config arrives in an environment variable
  #
  # Compose refuses an inline `configs:` `content:` on a read-only service ("`file` is the sole
  # supported option"), because it must be materialised inside the container. So the config travels
  # as an environment variable written to the tmpfs at start, keeping the read-only root and the
  # routing in the file that documents it. `exec` makes nginx, not the shell, receive SIGTERM; the
  # image's own entrypoint is bypassed because it templates files into /etc/nginx.
  #
  # ## What it writes to a log
  #
  # `combined` logs `"$request"`, the request line VERBATIM, and the OIDC provider returns to
  # `/api/v1/auth/oidc/callback?code=<authorization code>&state=...`, so it would write a bearer
  # credential to the log in the clear (D2 in docs/production/legal-register.md), undoing
  # `queryKeysOf` (apps/api/src/logging.ts) and `clientKeyFor` (request-context.ts) downstream.
  #
  # `prl_privacy` logs `$uri`, the path with the query string already gone, plus `$is_args` for
  # whether there was one (nginx core cannot keep names and drop values). The client address is
  # truncated to a /24 or /48, not dropped, because when the API is down this log is the only place
  # that answers "one caller or a thousand"; that is reduction, not anonymisation. The user agent is
  # classed (a UA is a fingerprint), `$http_referer` is gone (it can carry somebody else's token), and
  # `$upstream_http_x_request_id` is the API's own request id, joining the two logs without trusting
  # an inbound correlation id.
  #
  # ## The error log, which `log_format` cannot control
  #
  # `ngx_http_log_error` stamps the full request line onto error-log messages at any level:
  #
  #   2026/08/25 07:50:49 [error] 7#7: *1 api could not be resolved (3: Host not found),
  #   client: 172.22.0.1, server: _, request: "GET /api/v1/auth/oidc/callback?code=
  #   SENTINELCODE123&state=SENTINELSTATE456 HTTP/1.1", host: "127.0.0.1:18080"
  #
  # The level is the only lever, so it is `crit`: everything that carries a request line in normal
  # operation is `[error]` or quieter, while `[emerg]`/`[alert]` still make a bind or config failure
  # loud. `crit` is a reduction, not a proof, so the callback gets its own `location =` with
  # `error_log /dev/null`. `scripts/supply-chain/log-policy.mjs` keeps all of this true.
  #
  # ## The `$$`
  #
  # `$$` is compose's escape for a literal `$`, so `$$http_upgrade` reaches nginx as `$http_upgrade`.
  # The two upstreams are written `${...}` so compose DOES substitute them. Check what arrives with:
  #
  #     docker compose config | grep -A2 'location /api/'
  proxy:
    # nginxinc/nginx-unprivileged 1.29.8-alpine. Refresh with the registry command in the
    # Dockerfile.api header, substituting nginxinc/nginx-unprivileged and 1.29.8-alpine.
    image: nginxinc/nginx-unprivileged:1.29.8-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    restart: unless-stopped
    init: true
    depends_on:
      # A proxy that starts first answers 502 for the whole start-up window.
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      # The whole routing table, substituted by compose at `up`.
      PRL_PROXY_NGINX_CONF: |
        # Everything nginx writes goes to the tmpfs. With a read-only root there is no
        # other choice, and there is nothing here worth surviving a restart.
        pid /tmp/nginx.pid;
        # `crit`, not `warn`. nginx stamps the full request line — query string and all
        # — onto its own error-log messages and no directive changes that shape, so the
        # level is the only control. See this service's header comment.
        error_log /dev/stderr crit;
        events { worker_connections 1024; }
        http {
          # The client address, reduced to a network: IPv4 keeps three octets, IPv6
          # three hextets, and the host part is discarded before it is written down.
          # $$remote_addr is still used raw for X-Forwarded-For below — the API needs it
          # to compute its own keyed hash — and is simply not persisted HERE. Anything
          # this cannot truncate correctly (a compressed IPv6 literal) degrades to
          # `ip6`: the failure mode of a redaction rule must be "log less", never "raw".
          map $$remote_addr $$prl_client_net {
            default                                       "ip6";
            ""                                            "-";
            "~^(?<v4net>[0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$$" "$$v4net.0/24";
            "~^(?<v6net>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):" "$$v6net::/48";
          }
          # The user agent, reduced to a class. A full UA is a fingerprint and the API
          # stores only a digest of it; "browser / tool / bot" is what it is read for.
          # Regexes are tried in written order, so `bot` wins over `browser` for the
          # many crawlers that also claim to be Mozilla.
          map $$http_user_agent $$prl_ua_class {
            default                                     "other";
            ""                                          "none";
            "~*(bot|crawl|spider|slurp)"                "bot";
            "~*^(curl|wget|python-|go-http|node-fetch)" "tool";
            "~*(Firefox|Chrome|Safari|Edg)/"            "browser";
          }
          # `$$uri`, never `$$request`/`$$request_uri`: the query string is gone before
          # anything is written, which is what keeps an OAuth authorization code off
          # disk (D2). `escape=default` is nginx's default and is stated because it
          # matters — `$$uri` is percent-DECODED, so without escaping a crafted path
          # could inject a newline and forge a log line.
          log_format prl_privacy escape=default
            '$$time_iso8601 $$prl_client_net $$prl_ua_class "$$request_method $$uri$$is_args" '
            '$$status $$body_bytes_sent rt=$$request_time up=$$upstream_addr '
            'us=$$upstream_status urt=$$upstream_response_time rid=$$upstream_http_x_request_id';
          access_log /dev/stdout prl_privacy;
          client_body_temp_path /tmp/nginx-body;
          proxy_temp_path /tmp/nginx-proxy;
          fastcgi_temp_path /tmp/nginx-fastcgi;
          uwsgi_temp_path /tmp/nginx-uwsgi;
          scgi_temp_path /tmp/nginx-scgi;

          # Docker's embedded DNS, with a short TTL. Without an explicit resolver nginx
          # resolves each upstream once at start and caches it forever, so a restarted
          # api container keeps getting traffic sent to an address nothing answers on.
          # In a deployment this is whatever that platform's resolver is.
          resolver 127.0.0.11 valid=10s ipv6=off;

          # The WebSocket dance: Connection: upgrade only when the client asked for it,
          # Connection: close otherwise. A blanket `Connection: upgrade` breaks keep-alive
          # for every ordinary request.
          map $$http_upgrade $$connection_upgrade { default upgrade; '' close; }

          server {
            listen 8080;
            server_name _;

            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            # SET, not append. $$proxy_add_x_forwarded_for would preserve whatever the
            # client sent, which is the header a client must never be able to choose.
            proxy_set_header X-Forwarded-For $$remote_addr;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header X-Forwarded-Host $$http_host;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            # A WebSocket is idle most of the time; the default 60s would close every
            # table between hands.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Off, and stated rather than assumed. On, nginx would answer an upstream
            # 4xx/5xx from its own error_page, which is an INTERNAL REDIRECT: a second
            # pass with a rewritten $$uri, another chance to log a request that already
            # has a line, and the loss of the API's own error body and request id.
            proxy_intercept_errors off;

            # The OIDC callback, and the only reason it is a location of its own.
            # `location /api/` already routes this path; this exact-match block exists
            # purely to give this ONE path an error log that cannot leak, because it is
            # the path where a query-string value is a credential BY CONSTRUCTION —
            # the provider redirects here with ?code=<exchangeable for a session>.
            # `error_log crit` at the top removes every message class that carries a
            # request line in normal operation, but not a genuine [crit] (a full 16 MiB
            # tmpfs producing `open() failed` while buffering the upstream response
            # would still print `request: "GET /api/v1/auth/oidc/callback?code=…"`).
            # On this path that residual is not acceptable, so the error log goes to
            # /dev/null and the sanitised access-log line is the record.
            #
            # The upstream MUST stay identical to `location /api/`; two blocks routing
            # the same traffic can drift, so scripts/supply-chain/log-policy.mjs
            # asserts they name the same upstream.
            location = /api/v1/auth/oidc/callback {
              error_log /dev/null crit;
              set $$upstream "${PRL_PROXY_API_UPSTREAM:-api:3001}";
              proxy_pass http://$$upstream$$request_uri;
            }

            # Origin is passed through untouched — nginx does not strip it — and that
            # matters: the API checks Origin against PUBLIC_WEB_ORIGIN on CSRF and on
            # every socket upgrade, and the value it must see is this proxy's published
            # origin.
            #
            # /api/ is every REST route (API_PREFIX = /api/v1) and the WebSocket upgrade,
            # which today is at /api/v1/ws because ws/hub.ts registers under the same
            # prefix as every other route module.
            location /api/ {
              set $$upstream "${PRL_PROXY_API_UPSTREAM:-api:3001}";
              proxy_pass http://$$upstream$$request_uri;
            }
            # /ws is not a route the API serves today. It is here because WS_PATH is the
            # string '/ws' and the prefix comes from the registration, so moving the hub
            # to the root instance would move the socket to /ws with no other visible
            # change — and the symptom would be a 404 from the page server, which is a
            # confusing way to learn that. One location block.
            location /ws {
              set $$upstream "${PRL_PROXY_API_UPSTREAM:-api:3001}";
              proxy_pass http://$$upstream$$request_uri;
            }
            # Everything else is the page server.
            location / {
              set $$upstream "${PRL_PROXY_WEB_UPSTREAM:-web:3000}";
              proxy_pass http://$$upstream$$request_uri;
            }
          }
        }
    # `printf %s` rather than `echo`, so a backslash in the config is never interpreted,
    # and the variable is double-quoted so the shell does not expand the `$` nginx needs.
    entrypoint:
      - sh
      - -c
      - printf '%s' "$$PRL_PROXY_NGINX_CONF" > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    ports:
      # THE published port: the browser's one origin. Loopback only, as on postgres.
      - '127.0.0.1:${WEB_PORT:-3000}:8080'
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    # 10 MiB × 5 = 50 MiB; see this file's header, "Why every service has a `logging:` block".
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Through itself to the web upstream ("a browser would get a page"), at `hostname` because a
      # probe on 127.0.0.1 passes for a process bound to loopback only.
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --timeout=4 -O /dev/null "http://$$(hostname):8080/" || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  # Named, so `docker compose down` keeps the data and `docker compose down -v`
  # is the explicit act that destroys it.
  postgres-data:
