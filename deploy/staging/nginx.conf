# ---------------------------------------------------------------------------
# The staging reverse proxy: the ONE origin a browser sees, and the place TLS
# terminates.
#
# ## Why nginx and not Caddy
#
# Caddy was the obvious candidate, because `tls internal` would mint the leaf
# certificate itself and nothing would have to be generated on the host. It
# cannot be used here, and the reason is measured rather than aesthetic:
# `caddy` ships with the file capability `cap_net_bind_service=ep`, and Linux
# refuses `execve` of a file whose permitted capability set is not inside the
# process's bounding set. Under `cap_drop: ALL` — which every service in this
# stack runs with — the container therefore cannot start at all:
#
#     $ docker run --cap-drop ALL --user 1000:1000 caddy:2.11.4-alpine caddy version
#     sh: caddy: Operation not permitted
#
# The ways round that are `cap_add: [NET_BIND_SERVICE]` (handing back the right
# to bind privileged ports to a proxy that listens on 8443 and does not need it)
# or dropping `cap_drop: ALL`. Neither is worth trading for certificate
# convenience when `nginxinc/nginx-unprivileged` runs as uid 101, listens on a
# high port, and carries no file capabilities at all — and when
# `docker-compose.yml` already uses it, so staging and the development stack are
# the same proxy with the same routing semantics. docs/RUNBOOK.md §11.2 tells a
# deployer to "lift its nginx config"; this file is that config, lifted and given
# TLS.
#
# The certificate is generated instead by `scripts/staging.mjs` (a local CA and a
# leaf) into deploy/staging/tls/, which deploy/staging/.gitignore keeps out of git
# and .dockerignore keeps out of every image layer.
#
# ## Why the config is a file here and an environment variable in the dev stack
#
# `docker-compose.yml` passes its nginx config in `PRL_PROXY_NGINX_CONF` and
# writes it to a tmpfs at start, because compose's `configs:` with inline
# `content:` refuses to materialise into a read-only service and the alternative
# was a second file. Staging already needs a mounted read-only directory for the
# TLS material, so the second file costs nothing here, and a real file is easier
# to diff, easier to lint and — the point — is the artefact an operator copies to
# a production edge. It is mounted read-only, so the read-only root filesystem
# argument is unaffected.
#
# The image's own entrypoint is bypassed in docker-compose.staging.yml for the
# same reason it is in the dev stack: it templates files into /etc/nginx, which
# a read-only root refuses.
#
# ## HTTPS only. There is deliberately no plaintext listener.
#
# The usual shape is port 80 answering with a 308 to https. There is none here,
# and that is stronger rather than lazier: a redirect means the staging origin
# answers on http, which is an origin somebody bookmarks, a link somebody pastes,
# and a first request that carried a cookie in the clear before the redirect was
# read. A connection refused is unambiguous. A production edge in front of a real
# domain does want the redirect (for humans typing the hostname); it belongs
# there, at the edge that owns the public DNS name, not here.
#
# ## What this proxy must get right, and what breaks when it does not
#
#   * `X-Forwarded-For` is SET from `$remote_addr`, never appended. The API runs
#     with `TRUST_PROXY=true` in staging, which means it believes this header. If
#     it were `$proxy_add_x_forwarded_for` the client's own value would be
#     preserved and every caller could choose its own rate-limit bucket — the
#     whole limiter, defeated by one request header.
#   * `Origin` is passed through untouched. The API matches it exactly against
#     `PUBLIC_WEB_ORIGIN` on CSRF checks and on every WebSocket upgrade; a
#     rewritten or dropped Origin presents as "every socket closes 4406", which
#     is a long way from the cause.
#   * `Upgrade`/`Connection` are forwarded only when the client asked, via the
#     map below. A blanket `Connection: upgrade` breaks keep-alive for every
#     ordinary request.
#   * The socket read/send timeouts are an hour. A table is idle between hands and
#     nginx's default 60 s would close every WebSocket mid-lesson.
#   * `proxy_ignore_client_abort off` (the default, stated here because it
#     matters): when the API is shutting down it sends every socket a `4503`
#     close frame and waits for the close handshake inside `SHUTDOWN_GRACE_MS`.
#     nginx has to let that handshake finish rather than tear the connection down
#     underneath it, or the client sees `1006` — an abnormal closure it cannot
#     distinguish from a crash — and the API's own drain logs a timeout for
#     sockets that in fact closed cleanly.
#
# ## Headers this proxy does and does not set
#
# It sets `Strict-Transport-Security` and nothing else. The Content-Security-
# Policy carries a per-response nonce and is minted by the web app itself
# (`apps/web/src/proxy.ts`); overwriting or duplicating it here would break
# hydration, because the nonce in the header has to be the nonce Next stamped on
# its script tags. The other response headers (`X-Content-Type-Options`,
# `Referrer-Policy`, `X-Frame-Options`, `Cross-Origin-Opener-Policy`) come from
# the same place, and the API sets its own through helmet.
#
# HSTS is the one header this proxy owns, because only this file knows the
# deployment is served over TLS. That sentence used to end "…the one header
# neither of them can set honestly", and it was simply not true: helmet sets HSTS
# too whenever `config.isProduction` (`apps/api/src/plugins/security.ts`), and
# staging runs NODE_ENV=production, so the API sent one on every `/api/*`
# response. `add_header` APPENDS rather than replaces, so those responses carried
# two — and RFC 6797 §8.1 says a UA honours only the FIRST, which was the
# upstream's `max-age=31536000; includeSubDomains`. The deliberate "no
# includeSubDomains" decision written out below was therefore in force on the
# page path and silently overridden on the API path: the exact opposite of one
# coherent policy, and invisible unless you counted headers.
#
# The fix is `proxy_hide_header Strict-Transport-Security` below. Every response
# this server emits is proxied, so hiding the upstream's copy makes the
# `add_header` here the only one that survives, and makes the claim "this proxy is
# the single source of HSTS" true rather than aspirational. helmet is left alone:
# the API is also deployed behind other terminators, and it should keep sending a
# correct header to those.
#
# `add_header` and `proxy_hide_header` are both declared at `server` level only.
# nginx's inheritance rule for both is replace-not-merge: a single `add_header` or
# `proxy_hide_header` inside a `location` would silently drop every server-level
# directive of that kind for that location, and "HSTS is missing on exactly one
# path" — or "there are two again on exactly one path" — is a very quiet way to
# fail. `scripts/staging.mjs` checks this from the outside on every `staging up`.
#
# ## What this proxy writes to a log, and the incident that decided it
#
# This file used to say `access_log /dev/stdout combined;`. `combined` expands to
#
#     $remote_addr - $remote_user [$time_local] "$request" $status
#     $body_bytes_sent "$http_referer" "$http_user_agent"
#
# and `$request` is the request line VERBATIM — method, full URI *including the
# query string*, and protocol. `/api/v1/auth/oidc/callback` is proxied through
# `location /api/`, and an OIDC provider returns to that path as
# `?code=<authorization code>&state=<state>`. So every completed sign-in wrote an
# OAuth authorization code — a bearer credential that can be exchanged for a
# session — to the proxy's log in the clear. Measured, before the fix, against a
# throwaway container with this exact config:
#
#     172.22.0.1 - - [25/Aug/2026:07:50:49 +0000] "GET /api/v1/auth/oidc/callback
#     ?code=SENTINELCODE123&state=SENTINELSTATE456 HTTP/2.0" 502 150 "-" "curl/8.7.1"
#
# That is D2 in docs/production/legal-register.md, and it is worse than an ordinary
# logging slip because the application one hop downstream goes to real trouble to
# prevent exactly this line from existing. `queryKeysOf`
# (apps/api/src/logging.ts) logs query parameter NAMES and never values, for the
# stated reason that an authorization code must never enter a log; `clientKeyFor`
# (apps/api/src/plugins/request-context.ts) stores `HMAC(secret, "client:"+ip)`
# rather than an address. Both controls were bypassed upstream by this file. A
# control that the layer in front of it undoes is not a control.
#
# The replacement is `prl_privacy` below. The three decisions in it:
#
#   * `$uri`, never `$request` or `$request_uri`. `$uri` is the normalised path
#     with the query string already gone, which is what removes the credential.
#     `$is_args` is appended so a line still says *whether* there was a query
#     string — the nearest nginx can get to the API's `queryKeysOf` compromise,
#     since nginx core has no way to strip values while keeping names.
#   * The client address is REDUCED, not dropped and not logged raw. Dropping it
#     entirely would leave the one question only this layer can answer —
#     "is this one caller or a thousand?" — unanswerable at exactly the moment
#     the API is down and its own logs do not exist. nginx has no HMAC, so it
#     cannot match the API's pseudonymisation; what it can do is truncate, so an
#     IPv4 client is logged as its /24 and an IPv6 client as its /48. Be as
#     honest about this as request-context.ts is about its hash: a /24 is
#     reduction, not anonymisation. An address whose shape this cannot truncate
#     with confidence (a compressed IPv6 literal) logs as `ip6` and nothing
#     more — fail closed, log less.
#   * The user agent is CLASSED, not logged. A full UA string is a fingerprint
#     and the API stores only a digest of it; "browser / tool / bot / none" is
#     what an operator staring at a 502 actually uses it for.
#
# `$http_referer` is gone with no replacement: a Referer is a URL from somebody
# else's page and can carry their tokens, which is the same defect in a different
# field. Upstream diagnostics (`$upstream_addr`, `$upstream_status`,
# `$upstream_response_time`) replace what the error log used to give, and
# `$upstream_http_x_request_id` is the API's OWN request id read back off its
# response header — so a proxy line joins to an API line without this proxy
# forging or trusting a correlation id. (It must be read from the RESPONSE:
# `apps/api/src/plugins/security.ts` sets `requestIdHeader: false`, so the API
# deliberately refuses an inbound one.)
#
# ## The error log leaks the same request line, and `log_format` cannot stop it
#
# This is the half of the fix that is easy to miss. `ngx_http_log_error` appends
# the request context to error-log messages itself, at ANY level, in a shape no
# directive in this file controls:
#
#     2026/08/25 07:50:49 [error] 7#7: *3 api could not be resolved (3: Host not
#     found), client: 172.22.0.1, server: _, request: "GET /api/v1/auth/oidc/
#     callback?code=SENTINELCODE123&state=SENTINELSTATE456 HTTP/2.0", host: ...
#
# Measured, from the same throwaway container, with `error_log /dev/stderr warn`.
# Fixing the access log and leaving that line in place would have been a fix that
# tested clean and changed nothing.
#
# nginx has no `error_log` format. The lever it does have is the level, so the
# level is now `crit`. Every message class nginx emits WITH a request line during
# normal operation is `[error]` or quieter — upstream unreachable, upstream
# timeout, "client intended to send too large body", client aborts, malformed
# requests — and all of them are now dropped. `[emerg]` and `[alert]` still print,
# so a config or bind failure at start is still loud.
#
# What `crit` does NOT buy is a proof, and this file should not claim one: a
# genuine `[crit]` such as `open() failed (13: Permission denied) while reading
# upstream` (this container has a 16 MiB tmpfs; it can fill) would still carry the
# request line. That residual is closed for the one path where the query string is
# a credential BY CONSTRUCTION rather than by accident — see the
# `location = /api/v1/auth/oidc/callback` block below, which sends its error log
# to /dev/null. The general path keeps its crit-level errors; the callback trades
# them away, because on that path the thing being traded is an OAuth code.
#
# `proxy_intercept_errors off` is stated explicitly below for the same reason
# `proxy_ignore_client_abort off` is: turning it on makes nginx handle an
# upstream's 4xx/5xx with its own `error_page`, which is an internal redirect —
# a second pass with a rewritten `$uri`, and another chance for a log line about
# a request that already had one.
#
# `scripts/supply-chain/log-policy.mjs` is the gate that keeps all of this
# true. It fails against the config as it was before this comment existed.
# ---------------------------------------------------------------------------

# Everything nginx writes goes to the tmpfs. The root filesystem is read-only and
# there is nothing here worth surviving a restart.
pid /tmp/nginx.pid;
# `crit`, not `warn`. See the header: nginx stamps the full request line — query
# string and all — onto its own error-log messages, and no directive changes that
# shape, so the level is the only control there is. Everything nginx logs with a
# request line in normal operation is `[error]` or quieter.
error_log /dev/stderr crit;

events {
  worker_connections 1024;
}

http {
  # The client address, reduced to a network. IPv4 keeps three octets, IPv6 keeps
  # three hextets; the host part is thrown away before it is ever written down.
  # `$remote_addr` is still used raw for `X-Forwarded-For` below — that is a
  # header the API needs in order to compute its own keyed hash of the address,
  # and it is not persisted anywhere. This map exists so that the address is not
  # persisted HERE. Anything not matched — a compressed IPv6 literal, which
  # cannot be truncated correctly by a regex — degrades to `ip6`, because the
  # failure mode of a redaction rule must be "log less", never "log it raw".
  map $remote_addr $prl_client_net {
    default                                       "ip6";
    ""                                            "-";
    "~^(?<v4net>[0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$" "$v4net.0/24";
    "~^(?<v6net>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):" "$v6net::/48";
  }

  # The user agent, reduced to a class. The full string is a fingerprint and the
  # API keeps only a digest of it; what it is actually READ for at this layer is
  # "was that a browser, our own health probe, or a crawler", and that survives.
  # Regexes are tried in the order written, so `bot` wins over `browser` for the
  # many crawlers that also claim to be Mozilla.
  map $http_user_agent $prl_ua_class {
    default                                     "other";
    ""                                          "none";
    "~*(bot|crawl|spider|slurp)"                "bot";
    "~*^(curl|wget|python-|go-http|node-fetch)" "tool";
    "~*(Firefox|Chrome|Safari|Edg)/"            "browser";
  }

  # See the header for why every field here is the field it is. The short version:
  # `$uri` has no query string in it, which is what stops an OAuth authorization
  # code reaching disk (D2). `escape=default` is nginx's default and is stated
  # because it matters — `$uri` is percent-DECODED, so without escaping a crafted
  # path could inject a newline and forge a log line.
  log_format prl_privacy escape=default
    '$time_iso8601 $prl_client_net $prl_ua_class "$request_method $uri$is_args" '
    '$status $body_bytes_sent rt=$request_time up=$upstream_addr '
    'us=$upstream_status urt=$upstream_response_time rid=$upstream_http_x_request_id';
  access_log /dev/stdout prl_privacy;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # The API's own limit is BODY_LIMIT_BYTES, 64 KiB by default. Refusing a larger
  # body here means the oversized request never reaches Node's JSON parser; the
  # margin exists so that a request the API would accept is never rejected by the
  # proxy instead, which would produce a 413 with no request id in it.
  client_max_body_size 128k;
  # A slow-header attack should cost this proxy a socket, not the API a worker.
  client_header_timeout 10s;
  client_body_timeout 30s;
  # Off, because every response this proxy serves is generated by an upstream that
  # already knows its own content type, and a proxy guessing is a proxy that can be
  # made to guess wrong.
  server_tokens off;

  # Docker's embedded DNS with a short TTL. Without an explicit resolver nginx
  # resolves each upstream once at start and caches it forever, so a restarted api
  # container keeps receiving traffic at an address nothing answers on. Replace
  # this with the platform's resolver outside compose.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Connection: upgrade only when the client asked for it, close otherwise.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    # 8443, not 443: an unprivileged port, so this container needs no capability
    # to bind it. docker-compose.staging.yml publishes it on the host.
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Generated by `pnpm run staging init`, mounted read-only, never committed.
    # The chain file is leaf-then-CA so that a client which trusts the local CA
    # can build the path without having the intermediate out of band.
    ssl_certificate     /etc/nginx/tls/staging-chain.pem;
    ssl_certificate_key /etc/nginx/tls/staging-key.pem;
    # 1.2 as the floor rather than 1.3-only: staging exists to catch what
    # production would do, and a production edge that refused 1.2 today would be
    # refusing a share of real clients. Everything below 1.2 is broken and gone.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Shared memory, not a disk cache — the root filesystem is read-only. Tickets
    # are off because without a rotation mechanism a long-lived ticket key is a
    # standing forward-secrecy hole.
    ssl_session_cache shared:PRLSTAGING:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Drop the upstream's HSTS before adding ours. The API sets its own via helmet
    # whenever NODE_ENV=production, which staging is; without this line `add_header`
    # appends to it and every `/api/*` response goes out with two, of which a browser
    # obeys only the first — the API's, `includeSubDomains` and all. See the header.
    # This must stay directly above the `add_header` it exists to protect.
    proxy_hide_header Strict-Transport-Security;

    # `always`, so it is also present on error responses — which is where a
    # browser is most likely to be sitting when it decides whether to remember the
    # policy. No `preload`, and no `includeSubDomains`: this certificate is issued
    # by a throwaway local CA for a hostname a developer also uses for other
    # things, and pinning every future subdomain of it to HTTPS in that developer's
    # browser is a footgun with a two-year fuse. A real staging domain should have
    # both, decided deliberately. With the `proxy_hide_header` above, this is now
    # genuinely the policy the browser sees on every path, `/api/*` included.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # SET, not append. See the header: $proxy_add_x_forwarded_for would preserve
    # whatever the client sent, and TRUST_PROXY=true means the API believes it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # An hour: a WebSocket at a poker table is idle between hands, and the 60 s
    # default would close every one of them.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Long enough to cover a container that is still warming its pool, short
    # enough that a dead upstream is a fast 504 rather than a hanging tab.
    proxy_connect_timeout 5s;
    # Off (the default, stated because it matters, like `proxy_ignore_client_abort`
    # above). On, nginx would answer an upstream 4xx/5xx from its own `error_page`,
    # which is an INTERNAL REDIRECT: a second pass with a rewritten `$uri` and a
    # second opportunity for a request to be written to a log. The upstream's own
    # error body carries the API's request id and its error code; replacing it with
    # a generic nginx page would also throw those away.
    proxy_intercept_errors off;

    # The OIDC callback, and the only reason it is a location of its own.
    #
    # `location /api/` below would already route this path; the exact-match block
    # exists purely to give this ONE path an error log that cannot leak. This is
    # the path where a query-string value is a credential by construction rather
    # than by accident — the provider redirects here with `?code=…&state=…`, and
    # the `code` is exchangeable for a session. `error_log ... crit` at the top of
    # this file removes every message class that carries a request line in normal
    # operation, but not a genuine `[crit]` (a full tmpfs producing `open() failed`
    # while buffering the upstream response would still print `request: "GET
    # /api/v1/auth/oidc/callback?code=…"`). On this path that residual is not
    # acceptable, so the error log goes to /dev/null and the access log — path
    # only, no query — remains the record that the request happened.
    #
    # What this costs: an operator debugging a broken sign-in gets the access-log
    # line with `$status`, `$upstream_addr`, `$upstream_status` and
    # `$upstream_response_time`, and nothing from nginx's error log. That is the
    # trade, made deliberately, on one path.
    #
    # The upstream MUST stay identical to `location /api/`. Two blocks that route
    # the same traffic are two blocks that can drift, so
    # `scripts/supply-chain/log-policy.mjs` asserts they name the same
    # upstream and fails if they diverge.
    location = /api/v1/auth/oidc/callback {
      error_log /dev/null crit;
      set $upstream_api "api:3001";
      proxy_pass http://$upstream_api$request_uri;
    }

    # /api/ is every REST route (API_PREFIX is /api/v1) and the WebSocket upgrade,
    # which lives at /api/v1/ws because ws/hub.ts registers under the same prefix
    # as every other route module.
    location /api/ {
      set $upstream_api "api:3001";
      proxy_pass http://$upstream_api$request_uri;
    }

    # /ws is not a route the API serves today. It is here because WS_PATH is the
    # bare string '/ws' and the prefix comes from the registration, so moving the
    # hub to the root instance would move the socket to /ws with no other visible
    # change — and the symptom would be a 404 from the page server, which is a
    # confusing way to learn that.
    location /ws {
      set $upstream_api "api:3001";
      proxy_pass http://$upstream_api$request_uri;
    }

    # Everything else is the page server.
    location / {
      set $upstream_web "web:3000";
      proxy_pass http://$upstream_web$request_uri;
    }
  }
}
