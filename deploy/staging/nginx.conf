# ---------------------------------------------------------------------------
# The staging reverse proxy: the ONE origin a browser sees, and the place TLS
# terminates.
#
# ## Why nginx and not Caddy
#
# Caddy was the obvious candidate, because `tls internal` would mint the leaf
# certificate itself and nothing would have to be generated on the host. It
# cannot be used here, and the reason is measured rather than aesthetic:
# `caddy` ships with the file capability `cap_net_bind_service=ep`, and Linux
# refuses `execve` of a file whose permitted capability set is not inside the
# process's bounding set. Under `cap_drop: ALL` — which every service in this
# stack runs with — the container therefore cannot start at all:
#
#     $ docker run --cap-drop ALL --user 1000:1000 caddy:2.11.4-alpine caddy version
#     sh: caddy: Operation not permitted
#
# The ways round that are `cap_add: [NET_BIND_SERVICE]` (handing back the right
# to bind privileged ports to a proxy that listens on 8443 and does not need it)
# or dropping `cap_drop: ALL`. Neither is worth trading for certificate
# convenience when `nginxinc/nginx-unprivileged` runs as uid 101, listens on a
# high port, and carries no file capabilities at all — and when
# `docker-compose.yml` already uses it, so staging and the development stack are
# the same proxy with the same routing semantics. docs/RUNBOOK.md §11.2 tells a
# deployer to "lift its nginx config"; this file is that config, lifted and given
# TLS.
#
# The certificate is generated instead by `scripts/staging.mjs` (a local CA and a
# leaf) into deploy/staging/tls/, which deploy/staging/.gitignore keeps out of git
# and .dockerignore keeps out of every image layer.
#
# ## Why the config is a file here and an environment variable in the dev stack
#
# `docker-compose.yml` passes its nginx config in `PRL_PROXY_NGINX_CONF` and
# writes it to a tmpfs at start, because compose's `configs:` with inline
# `content:` refuses to materialise into a read-only service and the alternative
# was a second file. Staging already needs a mounted read-only directory for the
# TLS material, so the second file costs nothing here, and a real file is easier
# to diff, easier to lint and — the point — is the artefact an operator copies to
# a production edge. It is mounted read-only, so the read-only root filesystem
# argument is unaffected.
#
# The image's own entrypoint is bypassed in docker-compose.staging.yml for the
# same reason it is in the dev stack: it templates files into /etc/nginx, which
# a read-only root refuses.
#
# ## HTTPS only. There is deliberately no plaintext listener.
#
# The usual shape is port 80 answering with a 308 to https. There is none here,
# and that is stronger rather than lazier: a redirect means the staging origin
# answers on http, which is an origin somebody bookmarks, a link somebody pastes,
# and a first request that carried a cookie in the clear before the redirect was
# read. A connection refused is unambiguous. A production edge in front of a real
# domain does want the redirect (for humans typing the hostname); it belongs
# there, at the edge that owns the public DNS name, not here.
#
# ## What this proxy must get right, and what breaks when it does not
#
#   * `X-Forwarded-For` is SET from `$remote_addr`, never appended. The API runs
#     with `TRUST_PROXY=true` in staging, which means it believes this header. If
#     it were `$proxy_add_x_forwarded_for` the client's own value would be
#     preserved and every caller could choose its own rate-limit bucket — the
#     whole limiter, defeated by one request header.
#   * `Origin` is passed through untouched. The API matches it exactly against
#     `PUBLIC_WEB_ORIGIN` on CSRF checks and on every WebSocket upgrade; a
#     rewritten or dropped Origin presents as "every socket closes 4406", which
#     is a long way from the cause.
#   * `Upgrade`/`Connection` are forwarded only when the client asked, via the
#     map below. A blanket `Connection: upgrade` breaks keep-alive for every
#     ordinary request.
#   * The socket read/send timeouts are an hour. A table is idle between hands and
#     nginx's default 60 s would close every WebSocket mid-lesson.
#   * `proxy_ignore_client_abort off` (the default, stated here because it
#     matters): when the API is shutting down it sends every socket a `4503`
#     close frame and waits for the close handshake inside `SHUTDOWN_GRACE_MS`.
#     nginx has to let that handshake finish rather than tear the connection down
#     underneath it, or the client sees `1006` — an abnormal closure it cannot
#     distinguish from a crash — and the API's own drain logs a timeout for
#     sockets that in fact closed cleanly.
#
# ## Headers this proxy does and does not set
#
# It sets `Strict-Transport-Security` and nothing else. The Content-Security-
# Policy carries a per-response nonce and is minted by the web app itself
# (`apps/web/src/proxy.ts`); overwriting or duplicating it here would break
# hydration, because the nonce in the header has to be the nonce Next stamped on
# its script tags. The other response headers (`X-Content-Type-Options`,
# `Referrer-Policy`, `X-Frame-Options`, `Cross-Origin-Opener-Policy`) come from
# the same place, and the API sets its own through helmet. HSTS is the one header
# neither of them can set honestly, because only this file knows the deployment
# is served over TLS.
#
# `add_header` is declared at `server` level only. nginx's inheritance rule is
# replace-not-merge: a single `add_header` inside a `location` would silently drop
# every server-level header for that location, and "HSTS is missing on exactly one
# path" is a very quiet way to fail.
# ---------------------------------------------------------------------------

# Everything nginx writes goes to the tmpfs. The root filesystem is read-only and
# there is nothing here worth surviving a restart.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout combined;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # The API's own limit is BODY_LIMIT_BYTES, 64 KiB by default. Refusing a larger
  # body here means the oversized request never reaches Node's JSON parser; the
  # margin exists so that a request the API would accept is never rejected by the
  # proxy instead, which would produce a 413 with no request id in it.
  client_max_body_size 128k;
  # A slow-header attack should cost this proxy a socket, not the API a worker.
  client_header_timeout 10s;
  client_body_timeout 30s;
  # Off, because every response this proxy serves is generated by an upstream that
  # already knows its own content type, and a proxy guessing is a proxy that can be
  # made to guess wrong.
  server_tokens off;

  # Docker's embedded DNS with a short TTL. Without an explicit resolver nginx
  # resolves each upstream once at start and caches it forever, so a restarted api
  # container keeps receiving traffic at an address nothing answers on. Replace
  # this with the platform's resolver outside compose.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Connection: upgrade only when the client asked for it, close otherwise.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    # 8443, not 443: an unprivileged port, so this container needs no capability
    # to bind it. docker-compose.staging.yml publishes it on the host.
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Generated by `pnpm run staging init`, mounted read-only, never committed.
    # The chain file is leaf-then-CA so that a client which trusts the local CA
    # can build the path without having the intermediate out of band.
    ssl_certificate     /etc/nginx/tls/staging-chain.pem;
    ssl_certificate_key /etc/nginx/tls/staging-key.pem;
    # 1.2 as the floor rather than 1.3-only: staging exists to catch what
    # production would do, and a production edge that refused 1.2 today would be
    # refusing a share of real clients. Everything below 1.2 is broken and gone.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Shared memory, not a disk cache — the root filesystem is read-only. Tickets
    # are off because without a rotation mechanism a long-lived ticket key is a
    # standing forward-secrecy hole.
    ssl_session_cache shared:PRLSTAGING:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # `always`, so it is also present on error responses — which is where a
    # browser is most likely to be sitting when it decides whether to remember the
    # policy. No `preload`, and no `includeSubDomains`: this certificate is issued
    # by a throwaway local CA for a hostname a developer also uses for other
    # things, and pinning every future subdomain of it to HTTPS in that developer's
    # browser is a footgun with a two-year fuse. A real staging domain should have
    # both, decided deliberately.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # SET, not append. See the header: $proxy_add_x_forwarded_for would preserve
    # whatever the client sent, and TRUST_PROXY=true means the API believes it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # An hour: a WebSocket at a poker table is idle between hands, and the 60 s
    # default would close every one of them.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Long enough to cover a container that is still warming its pool, short
    # enough that a dead upstream is a fast 504 rather than a hanging tab.
    proxy_connect_timeout 5s;

    # /api/ is every REST route (API_PREFIX is /api/v1) and the WebSocket upgrade,
    # which lives at /api/v1/ws because ws/hub.ts registers under the same prefix
    # as every other route module.
    location /api/ {
      set $upstream_api "api:3001";
      proxy_pass http://$upstream_api$request_uri;
    }

    # /ws is not a route the API serves today. It is here because WS_PATH is the
    # bare string '/ws' and the prefix comes from the registration, so moving the
    # hub to the root instance would move the socket to /ws with no other visible
    # change — and the symptom would be a 404 from the page server, which is a
    # confusing way to learn that.
    location /ws {
      set $upstream_api "api:3001";
      proxy_pass http://$upstream_api$request_uri;
    }

    # Everything else is the page server.
    location / {
      set $upstream_web "web:3000";
      proxy_pass http://$upstream_web$request_uri;
    }
  }
}
