# Blackbox probe modules: the only view of the deployment from OUTSIDE the application. See
# `prl-public-origin` in prometheus.yml for the blind spot this closes and why the target is the
# proxy's service name.
#
# A passing probe proves the proxy is terminating TLS with a valid, in-date certificate from this
# deployment's CA, routes to the right upstream, and that upstream answers 200 with an application
# body. It does not prove DNS outside the host, the firewall, or Docker's port publishing
# (`docs/production/runbooks/public-origin-unreachable.md`).
#
# The leaf certificate's only names are `localhost` and `127.0.0.1`, so `server_name` makes the
# handshake verify the name a learner is served. A production deployment points these modules at
# its real origin and needs neither the override nor `ca_file`.

modules:
  # The learner's front door: the page server, through the proxy, over TLS.
  learner_page_https:
    prober: http
    # Inside the 15 s scrape interval, so a timeout is the site's fault rather than the probe's.
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      # `_next/static` is in every server-rendered page and in no error page any tier produces;
      # status alone would accept an nginx default page or a proxy answering for a dead upstream.
      fail_if_body_not_matches_regexp:
        - '_next/static'
      # The compose network is IPv4; the default IPv6-with-fallback makes every probe a failed
      # connection then a working one, and `probe_duration_seconds` meaningless.
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      tls_config:
        # Verification is the point: `insecure_skip_verify` would report success through an
        # expired certificate.
        ca_file: /etc/blackbox/tls/staging-ca.pem
        server_name: localhost
      headers:
        Host: localhost

  # The API's liveness route through the proxy. `ApiDown` watches the API directly; this watches the
  # ROUTE, so this failing with `ApiDown` silent means the API is fine and the proxy is not.
  api_health_https:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"status":"ok"'
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      tls_config:
        ca_file: /etc/blackbox/tls/staging-ca.pem
        server_name: localhost
      headers:
        Host: localhost
