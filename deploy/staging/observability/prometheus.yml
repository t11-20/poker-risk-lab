# Prometheus for the staging observability overlay (`docker-compose.observability.yml`, brought up
# by `pnpm run alerts:verify`), kept out of docker-compose.staging.yml because that file runs
# exactly the images production runs and production gets monitoring from elsewhere.
#
# Scrapes `api:3001` on the staging network: `/metrics` is not under `/api/`, so through the proxy
# it reaches the page server and 404s, by design. The bearer token is a file because Compose does
# not interpolate mounted files, so `${PRL_STAGING_METRICS_TOKEN}` here would arrive literally and
# 401; `scripts/alert-delivery.mjs` writes `metrics-token`, gitignored and asserted by
# `scripts/supply-chain/secret-scan.mjs`.
#
# 15 s intervals are what `alerts.md` assumes ("eight consecutive misses is the service"); change
# one and that reasoning changes with it.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # The job name is load-bearing: `ApiDown` is keyed on `up{job="prl-api"}`.
  - job_name: prl-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['api:3001']

  # Alertmanager, scraped so the alerting system can report its OWN failure
  # (`AlertmanagerNotificationsFailing`, `AlertmanagerDown`). They catch one receiver or transport
  # of two; the total case is the out-of-band check in `docs/production/runbooks/alerting-blind.md`.
  #
  # No `authorization:`: Alertmanager serves /metrics unauthenticated and cannot require any. It is
  # reachable only on the compose network, published to loopback, and exposes notification counters.
  - job_name: prl-alertmanager
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['alertmanager:9093']

  # The public origin, probed from outside the application, because every job above bypasses the
  # proxy, TLS and the page server, so a dead nginx or an expired certificate leaves them green. Not
  # a rule on "requests stopped arriving": a class of thirty has whole nights with no traffic.
  #
  # The target is `proxy:8443`, not `https://localhost:8443`: inside a container `localhost` is that
  # container, and a port published to 127.0.0.1 is NOT reachable from a container on Linux
  # (`host.docker.internal` is the bridge gateway there), so it would pass on Docker Desktop and stay
  # red on Linux. `server_name: localhost` in blackbox.yml verifies the name the origin uses. Not
  # covered, so checked from off the box: Docker's port publishing, the host firewall, public DNS.
  #
  # Relabelling: `__address__` becomes the `target` parameter, is kept as `instance` so an alert
  # names the URL, and is replaced by the exporter's address. `module` stays on the series, so
  # `probe_success{module=...}` tells the page server from the whole origin.
  #
  # `blackbox:9115` is not published to the host: an open /probe endpoint fetches any URL it is given.
  - job_name: prl-public-origin
    metrics_path: /probe
    scheme: http
    static_configs:
      - targets: ['https://proxy:8443/']
        labels:
          module: learner_page_https
      - targets: ['https://proxy:8443/api/v1/health']
        labels:
          module: api_health_https
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
