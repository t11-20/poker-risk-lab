# ---------------------------------------------------------------------------
# Prometheus, for the staging stack only.
#
# This exists to answer one question that `docs/production/alerts.md` could not
# answer on its own: do the rules in that document actually fire, route and
# arrive? Two independent release reviews recorded "alert delivery UNVERIFIED —
# no Alertmanager in staging compose", and they were right. Prose describing an
# alert is a hypothesis about a system nobody has run.
#
# It is deliberately NOT part of docker-compose.staging.yml. That file is a
# deployment manifest whose whole point is that it runs the exact image digests
# production will run, and adding two services to it that production gets from
# somewhere else would make it describe a stack nobody deploys. This is an
# overlay — `docker-compose.observability.yml` — brought up beside it by
# `pnpm run alerts:verify` and taken down after.
#
# ## The scrape target is the container, not the published origin
#
# `/metrics` is not under `/api/`, so the proxy routes it to the page server,
# which 404s. That is the design: metrics are not public. Prometheus is on the
# staging network and scrapes `api:3001` directly, which is also how a real
# deployment does it.
#
# ## The bearer token comes from a file, and the file is generated
#
# Compose interpolates docker-compose.yml, not the files it mounts, so
# `${PRL_STAGING_METRICS_TOKEN}` written here would reach Prometheus as those
# literal characters and every scrape would 401. `scripts/alert-delivery.mjs`
# writes the token to `metrics-token` beside this file, which
# `deploy/staging/.gitignore` keeps out of the repository and
# `scripts/supply-chain/secret-scan.mjs` asserts the rule for.
#
# ## Intervals
#
# 15 s, which is what `alerts.md` assumes when it says "one missed scrape at a
# 15 s interval is a scrape problem; eight consecutive misses is the service".
# Change one and that reasoning has to change with it.
# ---------------------------------------------------------------------------

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # The job name is load-bearing: `ApiDown` is keyed on `up{job="prl-api"}`, so
  # renaming this silently disables the alert that says the service is gone.
  - job_name: prl-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['api:3001']

  # Alertmanager, scraped so that the alerting system can report its OWN failure.
  #
  # ## The one failure no in-band alert can report
  #
  # Every rule above this line is about the application, and every one of them is
  # delivered by Alertmanager. So the single failure that silences all of them —
  # Alertmanager unable to deliver, or not running — is the one failure they cannot
  # tell anybody about. Until this job existed, `alertmanager_notifications_failed_total`
  # was exported by a container on this network and read by nothing: an expired
  # PagerDuty key, a rejected SMTP password or a relay that started answering 550
  # would have incremented a counter nobody was looking at, forever, while every
  # dashboard stayed green.
  #
  # `AlertmanagerNotificationsFailing` and `AlertmanagerDown` in `alert-rules.yml`
  # read this job. Both are honest about their own limitation in
  # `docs/production/runbooks/alerting-blind.md`: a notification that cannot be
  # delivered cannot deliver the news that notifications cannot be delivered. They
  # catch the partial cases — one receiver of two, one transport of two — which is
  # most of what actually happens, and the total case is what the runbook's
  # out-of-band check is for.
  #
  # No `authorization:` block, and that is not an oversight. Alertmanager serves
  # /metrics without authentication and has no way to require any; it is reachable
  # only on the compose network, published to loopback alone, and what it exposes is
  # notification counters rather than anything about a learner. The API's exposition
  # is the one that carries a bearer token because the API's is the one with
  # per-endpoint behaviour in it.
  - job_name: prl-alertmanager
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['alertmanager:9093']
