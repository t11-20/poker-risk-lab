# The `telemetry` group: `MetricsCardinalityOverflow` and `ReadinessFlapping`, both tickets with no
# `for:`.
#
# The registry folds series past its per-metric cap into one overflow series
# (`observability/registry.ts`), so an engaged cap means a dashboard is quietly wrong while still
# drawing. The gauge is 0 or 1 and the rule says `== 1`; the third case evaluates the raw gauge so a
# third value would be noticed.
#
# `ReadinessFlapping` is the ticket half of a division with the `ApiNotReady` page
# (`availability.test.yml`): flapping accumulates here, an outage pages there. The last two cases
# are both sides.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    name: a metric folding into its overflow series raises a ticket immediately
    input_series:
      # An unbounded value reached a label; the gauge goes to 1 and stays there until a restart.
      - series: 'prl_metrics_cardinality_overflow'
        values: '0+0x40 1+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="MetricsCardinalityOverflow"}'
        eval_time: 10m
        exp_samples: []
      # No `for:`: the cap engaging once is the whole event, and it does not un-engage.
      - expr: 'ALERTS{alertname="MetricsCardinalityOverflow", alertstate="firing"}'
        eval_time: 10m15s
        exp_samples:
          - labels: 'ALERTS{alertname="MetricsCardinalityOverflow", alertstate="firing", severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="MetricsCardinalityOverflow", alertstate="firing"}'
        eval_time: 60m
        exp_samples:
          - labels: 'ALERTS{alertname="MetricsCardinalityOverflow", alertstate="firing", severity="ticket"}'
            value: 1

  - interval: 15s
    name: a registry that has never capped anything raises nothing
    input_series:
      # The normal state, for a deployment whose labels all come from closed sets.
      - series: 'prl_metrics_cardinality_overflow'
        values: '0+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="MetricsCardinalityOverflow"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="MetricsCardinalityOverflow"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: the series count rising towards the cap without reaching it raises nothing
    input_series:
      # The rule deliberately does not read `prl_metrics_series`: a threshold on the count would be
      # a number nobody could derive.
      - series: 'prl_metrics_series'
        values: '200+2x400'
      - series: 'prl_metrics_cardinality_overflow'
        values: '0+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="MetricsCardinalityOverflow"}'
        eval_time: 60m
        exp_samples: []
      # Only 0 and 1, which makes `== 1` an equality rather than a threshold.
      - expr: 'count(prl_metrics_cardinality_overflow == 0)'
        eval_time: 60m
        exp_samples:
          - labels: '{}'
            value: 1

  - interval: 15s
    name: readiness in and out of the load balancer eight times raises a ticket
    input_series:
      # A marginal database: degraded and recovered every ninety seconds, never down long enough
      # to page.
      - series: 'prl_readiness_state'
        values: '1+0x5 0+0x5 1+0x5 0+0x5 1+0x5 0+0x5 1+0x5 0+0x5 1+0x300'
    promql_expr_test:
      # Six changes is not more than six: the only case in the suite that tells `> 6` from `>= 6`.
      - expr: 'changes(prl_readiness_state[30m])'
        eval_time: 9m30s
        exp_samples:
          - labels: '{}'
            value: 6
      - expr: 'ALERTS{alertname="ReadinessFlapping"}'
        eval_time: 9m30s
        exp_samples: []
      # The seventh transition lands at t=10m30s; no `for:`, so the next evaluation fires.
      - expr: 'ALERTS{alertname="ReadinessFlapping", alertstate="firing"}'
        eval_time: 11m
        exp_samples:
          - labels: 'ALERTS{alertname="ReadinessFlapping", alertstate="firing", severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="ReadinessFlapping", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="ReadinessFlapping", alertstate="firing", severity="ticket"}'
            value: 1
      # And the page stays silent: one event, one tier.
      - expr: 'ALERTS{alertname="ApiNotReady"}'
        eval_time: 20m
        exp_samples: []

  - interval: 15s
    name: one clean transition out of the load balancer is not flapping
    input_series:
      # A database that went away and stayed away: the page speaks, not this ticket.
      - series: 'prl_readiness_state'
        values: '1+0x40 0+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ReadinessFlapping"}'
        eval_time: 20m
        exp_samples: []
      - expr: 'ALERTS{alertname="ReadinessFlapping"}'
        eval_time: 60m
        exp_samples: []
      - expr: 'ALERTS{alertname="ApiNotReady", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="ApiNotReady", alertstate="firing", severity="page"}'
            value: 1

  - interval: 15s
    name: a deploy is one transition each way and raises neither
    input_series:
      # A deploy: two changes, which a threshold of 6 exists to sit above.
      - series: 'prl_readiness_state'
        values: '1+0x40 0+0x7 1+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ReadinessFlapping"}'
        eval_time: 20m
        exp_samples: []
      - expr: 'ALERTS{alertname="ReadinessFlapping"}'
        eval_time: 60m
        exp_samples: []
      - expr: 'ALERTS{alertname="ApiNotReady"}'
        eval_time: 60m
        exp_samples: []
