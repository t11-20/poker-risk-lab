# The `saturation` group: `EventLoopBlocked`, `DbPoolSaturated`, `WorkerPoolQueueDeep` and
# `AnalysisTimeouts`. The last case is one stalled event loop firing three of these and both
# latency rules, the incident `inhibit_rules` exists for.
#
# `WorkerPoolQueueDeep`'s old `> 4` could not fire on a one- or two-vCPU host: the queue is bounded
# at three slots per worker (`workers/pool.ts`) and the pool is `max(1, min(4,
# availableParallelism() - 1))` workers (`config.ts`), so one worker caps the gauge at 3. The
# threshold is now half the queue limit derived from `prl_worker_pool_size`; the four-worker cases
# hold the half a one-worker test cannot.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    name: a one-worker host with a permanently full queue raises a ticket
    input_series:
      # Three of three slots for half an hour: every `POST /analysis` answered `service_unavailable`.
      - series: 'prl_worker_pool_size'
        values: '1+0x400'
      - series: 'prl_worker_pool_queued'
        values: '3+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WorkerPoolQueueDeep", alertstate="firing"}'
        eval_time: 10m
        exp_samples: []
      - expr: 'ALERTS{alertname="WorkerPoolQueueDeep", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="WorkerPoolQueueDeep", alertstate="firing", severity="ticket"}'
            value: 1
      # The old threshold against a full queue: no state of this host satisfies it.
      - expr: 'avg_over_time(prl_worker_pool_queued[10m]) > 4'
        eval_time: 40m
        exp_samples: []

  - interval: 15s
    name: a queue that is busy but draining on a one-worker host raises nothing
    input_series:
      # One task waiting, on and off: under half of three slots (1.5).
      - series: 'prl_worker_pool_size'
        values: '1+0x400'
      - series: 'prl_worker_pool_queued'
        values: '1+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WorkerPoolQueueDeep"}'
        eval_time: 40m
        exp_samples: []

  - interval: 15s
    name: five queued on a four-worker host is under half of twelve slots
    input_series:
      - series: 'prl_worker_pool_size'
        values: '4+0x400'
      - series: 'prl_worker_pool_queued'
        values: '5+0x400'
    promql_expr_test:
      # Five would have cleared the old flat `> 4` on this host with the queue under half full.
      - expr: 'ALERTS{alertname="WorkerPoolQueueDeep"}'
        eval_time: 40m
        exp_samples: []
      - expr: 'avg_over_time(prl_worker_pool_queued[10m]) > 4'
        eval_time: 40m
        exp_samples:
          - labels: '{}'
            value: 5

  - interval: 15s
    name: seven queued on a four-worker host is past half of twelve slots
    input_series:
      - series: 'prl_worker_pool_size'
        values: '4+0x400'
      - series: 'prl_worker_pool_queued'
        values: '7+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WorkerPoolQueueDeep", alertstate="firing"}'
        eval_time: 30m
        exp_samples:
          - labels: 'ALERTS{alertname="WorkerPoolQueueDeep", alertstate="firing", severity="ticket"}'
            value: 1

  # EventLoopBlocked (page): `prl_event_loop_delay_p99_seconds > 0.25`, `for: 5m`. Zeroes and ones
  # would pass against any threshold, so the healthy case is a real reading (tens of microseconds,
  # per `metrics.ts`) and a real near miss.
  - interval: 15s
    name: a loop delayed past 250 ms for five minutes pages
    input_series:
      # 400 ms at p99: one synchronous stretch per scrape window, blocking every socket and timer.
      - series: 'prl_event_loop_delay_p99_seconds'
        values: '0.00004+0x40 0.4+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="EventLoopBlocked"}'
        eval_time: 5m
        exp_samples: []
      - expr: 'ALERTS{alertname="EventLoopBlocked", alertstate="pending"}'
        eval_time: 14m
        exp_samples:
          - labels: 'ALERTS{alertname="EventLoopBlocked", alertstate="pending", severity="page"}'
            value: 1
      - expr: 'ALERTS{alertname="EventLoopBlocked", alertstate="firing"}'
        eval_time: 15m15s
        exp_samples:
          - labels: 'ALERTS{alertname="EventLoopBlocked", alertstate="firing", severity="page"}'
            value: 1

  - interval: 15s
    name: a healthy loop and a single 300 ms stall do not page
    input_series:
      # Tens of microseconds, with one 300 ms stall (a GC, a large hand history serialised): over
      # the bar for fifteen seconds against a five-minute `for:`.
      - series: 'prl_event_loop_delay_p99_seconds'
        values: '0.00004+0x40 0.3 0.00004+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="EventLoopBlocked", alertstate="firing"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="EventLoopBlocked", alertstate="firing"}'
        eval_time: 60m
        exp_samples: []
      # It did reach pending, so the silence is the `for:`, not a series renamed away.
      - expr: 'ALERTS{alertname="EventLoopBlocked", alertstate="pending"}'
        eval_time: 10m15s
        exp_samples:
          - labels: 'ALERTS{alertname="EventLoopBlocked", alertstate="pending", severity="page"}'
            value: 1

  - interval: 15s
    name: a loop sitting at exactly 250 ms does not page
    input_series:
      # The boundary, held for an hour: the only case that tells `> 0.25` from `>=`.
      - series: 'prl_event_loop_delay_p99_seconds'
        values: '0.25+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="EventLoopBlocked"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="EventLoopBlocked"}'
        eval_time: 90m
        exp_samples: []

  # DbPoolSaturated (page): `histogram_quantile(0.95, ...prl_db_probe_duration_seconds_bucket[5m]) >
  # 0.5`, `for: 5m`. `select 1` spends its time waiting for a pooled connection, so this is the
  # pool-exhaustion signal. 0.5 is a `DB_PROBE_BUCKETS` boundary, so the silent case sits in the
  # bucket just under it.
  - interval: 15s
    name: a probe taking over half a second at p95 pages
    input_series:
      # A tenth of probes past 500 ms: p95 interpolates to 750 ms inside (0.5, 1].
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.001"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.005"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.01"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.05"}'
        values: '0+20x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.1"}'
        values: '0+50x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.5"}'
        values: '0+90x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="1"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="5"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="10"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="+Inf"}'
        values: '0+100x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="DbPoolSaturated", alertstate="firing"}'
        eval_time: 4m
        exp_samples: []
      - expr: 'ALERTS{alertname="DbPoolSaturated", alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="DbPoolSaturated", alertstate="firing", severity="page"}'
            value: 1

  - interval: 15s
    name: a probe answering in under a millisecond raises nothing
    input_series:
      # Healthy: `select 1` with a free connection is sub-millisecond.
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.001"}'
        values: '0+98x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.005"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.01"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.05"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.1"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.5"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="1"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="5"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="10"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="+Inf"}'
        values: '0+100x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="DbPoolSaturated"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="DbPoolSaturated"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: a pool that is busy but not exhausted does not page
    input_series:
      # p95 about 340 ms inside (0.1, 0.5]: under real load, not queueing. The near miss.
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.001"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.005"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.01"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.05"}'
        values: '0+20x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.1"}'
        values: '0+50x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.5"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="1"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="5"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="10"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="+Inf"}'
        values: '0+100x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="DbPoolSaturated"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="DbPoolSaturated"}'
        eval_time: 90m
        exp_samples: []

  # AnalysisTimeouts (ticket): timeout ratio over `[10m]` > 0.05, `for: 15m`. The window is SHORTER
  # than the `for:`, so a burst of timeouts that stops decays out before the `for:` elapses.
  - interval: 15s
    name: one Coach analysis in ten abandoning its budget raises a ticket
    input_series:
      # Twenty analyses per scrape, two abandoned past COACH_TIMEOUT_MS. The rule sums over `kind`
      # as well as `outcome`, so this input carries an `ok` series on another kind.
      - series: 'prl_analysis_total{kind="coach", outcome="timeout"}'
        values: '0+2x400'
      - series: 'prl_analysis_total{kind="coach", outcome="ok"}'
        values: '0+14x400'
      - series: 'prl_analysis_total{kind="equity", outcome="ok"}'
        values: '0+4x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AnalysisTimeouts", alertstate="firing"}'
        eval_time: 14m
        exp_samples: []
      - expr: 'ALERTS{alertname="AnalysisTimeouts", alertstate="pending"}'
        eval_time: 14m
        exp_samples:
          - labels: 'ALERTS{alertname="AnalysisTimeouts", alertstate="pending", severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="AnalysisTimeouts", alertstate="firing"}'
        eval_time: 16m
        exp_samples:
          - labels: 'ALERTS{alertname="AnalysisTimeouts", alertstate="firing", severity="ticket"}'
            value: 1

  - interval: 15s
    name: two percent of analyses timing out is the tail and raises nothing
    input_series:
      # A few percent of abandoned runs is the designed tail. Non-zero, so the threshold is tested.
      - series: 'prl_analysis_total{kind="coach", outcome="timeout"}'
        values: '0+1x400'
      - series: 'prl_analysis_total{kind="coach", outcome="ok"}'
        values: '0+49x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AnalysisTimeouts"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="AnalysisTimeouts"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: a burst of timeouts during one cold deploy does not raise a ticket
    input_series:
      # Two minutes of a cold pool abandoning half of everything (128 timeouts), then nothing. The
      # ratio is above 0.05 from t=10m30s to about t=21m30s, eleven minutes against a `for:` of
      # fifteen, which is why every deploy does not raise this.
      - series: 'prl_analysis_total{kind="coach", outcome="timeout"}'
        values: '0+0x40 0+16x8 128+0x400'
      - series: 'prl_analysis_total{kind="coach", outcome="ok"}'
        values: '0+16x460'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AnalysisTimeouts", alertstate="firing"}'
        eval_time: 20m
        exp_samples: []
      - expr: 'ALERTS{alertname="AnalysisTimeouts", alertstate="firing"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="AnalysisTimeouts"}'
        eval_time: 60m
        exp_samples: []
      # …and it did reach pending, so the silences above are the `for:` outlasting the burst.
      - expr: 'ALERTS{alertname="AnalysisTimeouts", alertstate="pending"}'
        eval_time: 14m
        exp_samples:
          - labels: 'ALERTS{alertname="AnalysisTimeouts", alertstate="pending", severity="ticket"}'
            value: 1

  - interval: 15s
    name: a Coach that has never timed out leaves the ratio empty and silent
    input_series:
      # `prl_analysis_total` is not primed, so before the first timeout the numerator is empty and
      # the ratio is empty rather than zero: correct here, and pinned because the same shape hid
      # `HandCompletionGap`'s incident.
      - series: 'prl_analysis_total{kind="coach", outcome="ok"}'
        values: '0+20x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AnalysisTimeouts"}'
        eval_time: 60m
        exp_samples: []
      - expr: 'sum(rate(prl_analysis_total{outcome="timeout"}[10m]))'
        eval_time: 60m
        exp_samples: []

  # One stalled process, four alerts: the premise of the `EventLoopBlocked` inhibition in
  # `alertmanager.template.yml`. promtool evaluates rules and knows nothing about routing, so what
  # this pins is that the four alertnames that fire are exactly that inhibition's source and
  # targets. A fifth joining the set makes this fire five and shows the target list is short.
  - interval: 15s
    name: one stalled event loop raises all four alerts the inhibition pairs
    input_series:
      # The loop is stuck at 800 ms…
      - series: 'prl_event_loop_delay_p99_seconds'
        values: '0.8+0x400'
      # …the `select 1` probe cannot get its callback run, so it reads as a saturated pool while the
      # pool is idle…
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.001"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.005"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.01"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.05"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.1"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="0.5"}'
        values: '0+0x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="1"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="5"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="10"}'
        values: '0+100x400'
      - series: 'prl_db_probe_duration_seconds_bucket{le="+Inf"}'
        values: '0+100x400'
      # …and every request queues behind the same stall.
      - series: 'prl_http_request_duration_seconds_bucket{le="0.005"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.01"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.025"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.05"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.1"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.25"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.5"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="1"}'
        values: '0+500x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="2.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="10"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+1000x400'
    promql_expr_test:
      # Past the longest `for:` in the set, the ticket's thirty minutes.
      - expr: 'count(ALERTS{alertname=~"EventLoopBlocked|DbPoolSaturated|HttpLatencyP99High|HttpLatencyP95Degraded", alertstate="firing"})'
        eval_time: 40m
        exp_samples:
          - labels: '{}'
            value: 4
      - expr: 'ALERTS{alertname="EventLoopBlocked", alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="EventLoopBlocked", alertstate="firing", severity="page"}'
            value: 1
      - expr: 'ALERTS{alertname="DbPoolSaturated", alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="DbPoolSaturated", alertstate="firing", severity="page"}'
            value: 1
