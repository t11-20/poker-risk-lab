# The `availability` group: `ApiDown`, `ApiNotReady` and `ProcessRestartLoop`, all pages. Each is
# asserted in both directions, and each old defect is reproduced so it stays checkable.
#
# `ProcessRestartLoop` (`changes(prl_process_start_time_seconds[15m]) >= 3`) is only as good as its
# series. Re-derived per scrape as `Math.floor(Date.now() / 1000 - process.uptime())`, a wall clock
# minus a monotonic clock (1.11 ms of drift over 20 s), the start instant flips near a second
# boundary, and `changes()` counted 32 transitions in 20 s. `changes()` cannot tell a wobble from a
# restart; `apps/api/test/observability-metrics.test.ts` guards the computed-once export.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  # Nothing restarted: one process's start time wobbling by one second between scrapes, as the
  # old `setFrom` export did.
  - interval: 15s
    name: a one-second wobble in the start time pages ProcessRestartLoop with no restart behind it
    input_series:
      - series: 'prl_process_start_time_seconds'
        values: '1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914 1787678915 1787678914'
    promql_expr_test:
      # Three transitions is 45 s of scraping: firing before the process is a minute old.
      - expr: 'ALERTS{alertname="ProcessRestartLoop"}'
        eval_time: 16m
        exp_samples:
          - labels: 'ALERTS{alertname="ProcessRestartLoop", alertstate="firing", severity="page"}'
            value: 1
      - expr: 'changes(prl_process_start_time_seconds[15m])'
        eval_time: 16m
        exp_samples:
          - labels: '{}'
            value: 59

  # The fixed export: one integer, computed once, unchanged on every scrape.
  - interval: 15s
    name: a start time that never moves is not a restart loop
    input_series:
      - series: 'prl_process_start_time_seconds'
        values: '1787678914+0x200'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ProcessRestartLoop"}'
        eval_time: 16m
        exp_samples: []
      - expr: 'ALERTS{alertname="ProcessRestartLoop"}'
        eval_time: 45m
        exp_samples: []

  # The positive control, without which the test above would pass against a rule that never fires.
  - interval: 15s
    name: three real restarts inside fifteen minutes still page
    input_series:
      # Starts at t=5m, 9m and 13m: three distinct instants minutes apart, a crash loop.
      - series: 'prl_process_start_time_seconds'
        values: '1787678914+0x19 1787679214+0x15 1787679454+0x15 1787679694+0x150'
    promql_expr_test:
      # Two restarts is a deploy plus a rollback, and must not page.
      - expr: 'ALERTS{alertname="ProcessRestartLoop"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="ProcessRestartLoop"}'
        eval_time: 14m
        exp_samples:
          - labels: 'ALERTS{alertname="ProcessRestartLoop", alertstate="firing", severity="page"}'
            value: 1

  # ApiDown: `absent(up{job="prl-api"}) or max_over_time(up{job="prl-api"}[2m]) == 0`, `for: 2m`.
  # `up == 0` is a target configured and failing; `absent()` is a job whose targets have gone.
  #
  # The latency is four minutes, not two: `max_over_time(up[2m]) == 0` needs every sample in the
  # window to be zero, and the `for:` counts from there (first miss at 10m15s, firing at 14m).
  # "Eight consecutive misses" under `ApiDown` in `alerts.md` means the inner condition. Unlike the
  # old readiness rule, the `for:` here adds latency and cannot subtract sensitivity.
  - interval: 15s
    name: an API that stops answering scrapes pages, four minutes after the first miss
    input_series:
      # The container is gone at 10m but the target stays, reporting `up 0`: the half `absent()`
      # cannot see.
      - series: 'up{job="prl-api", instance="api:3001"}'
        values: '1+0x40 0+0x200'
    promql_expr_test:
      # Two minutes of misses have not accumulated, so not even pending.
      - expr: 'ALERTS{alertname="ApiDown"}'
        eval_time: 11m
        exp_samples: []
      # Pending, not firing, one evaluation before the `for:` elapses: the `for:` is holding it,
      # rather than the expression never having become true.
      - expr: 'ALERTS{alertname="ApiDown", alertstate="pending"}'
        eval_time: 13m45s
        exp_samples:
          - labels: 'ALERTS{alertname="ApiDown", alertstate="pending", severity="page", job="prl-api", instance="api:3001"}'
            value: 1
      - expr: 'ALERTS{alertname="ApiDown", alertstate="firing"}'
        eval_time: 14m
        exp_samples:
          - labels: 'ALERTS{alertname="ApiDown", alertstate="firing", severity="page", job="prl-api", instance="api:3001"}'
            value: 1

  - interval: 15s
    name: a rolling deploy's ninety seconds of missed scrapes must never page
    input_series:
      # Six consecutive misses while the container is replaced, every deploy's shape; `alerts.md`
      # says a shorter window would page on it.
      - series: 'up{job="prl-api", instance="api:3001"}'
        values: '1+0x40 0 0 0 0 0 0 1+0x200'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ApiDown"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="ApiDown"}'
        eval_time: 30m
        exp_samples: []
      # The inner condition never became true either: silence by shape, not a late `for:`.
      - expr: 'max_over_time(up{job="prl-api"}[2m]) == 0'
        eval_time: 12m
        exp_samples: []

  - interval: 15s
    name: a job whose targets have gone entirely still pages, through absent()
    input_series:
      # No `up{job="prl-api"}` series at all, so only `absent()` can speak. Alertmanager's target
      # is present, so this is a missing API rather than a missing Prometheus.
      - series: 'up{job="prl-alertmanager", instance="alertmanager:9093"}'
        values: '1+0x200'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ApiDown", alertstate="pending"}'
        eval_time: 1m
        exp_samples:
          - labels: 'ALERTS{alertname="ApiDown", alertstate="pending", severity="page", job="prl-api"}'
            value: 1
      # `absent()` carries the equality matcher's labels and no instance: there is none to name.
      - expr: 'ALERTS{alertname="ApiDown", alertstate="firing"}'
        eval_time: 2m
        exp_samples:
          - labels: 'ALERTS{alertname="ApiDown", alertstate="firing", severity="page", job="prl-api"}'
            value: 1
      - expr: 'ALERTS{alertname="AlertmanagerDown"}'
        eval_time: 30m
        exp_samples: []

  - interval: 15s
    name: an API answering every scrape raises nothing at all
    input_series:
      - series: 'up{job="prl-api", instance="api:3001"}'
        values: '1+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ApiDown"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="ApiDown"}'
        eval_time: 90m
        exp_samples: []

  # ApiNotReady: `prl_readiness_state == 0`, `for: 5m`. The old `min_over_time(...[5m]) == 0`
  # remembered a zero for five minutes after it left, so the `for:` counted the afterglow: two
  # degraded scrapes (30 s) fired the page at t=15m15s. The bare comparison resets on one healthy
  # scrape. A flapping gauge no longer accumulates here; `ReadinessFlapping` (a ticket) is the rule
  # for that. Both are asserted below.
  - interval: 15s
    name: a thirty-second failover blip must never page, and used to
    input_series:
      # Two degraded scrapes at 10m15s and 10m30s, then healthy: a Postgres failover blip.
      - series: 'prl_readiness_state'
        values: '1+0x40 0 0 1+0x300'
    promql_expr_test:
      # 15m15s is where the old expression fired.
      - expr: 'ALERTS{alertname="ApiNotReady"}'
        eval_time: 15m15s
        exp_samples: []
      - expr: 'ALERTS{alertname="ApiNotReady"}'
        eval_time: 20m
        exp_samples: []
      - expr: 'ALERTS{alertname="ApiNotReady"}'
        eval_time: 60m
        exp_samples: []
      # It did become true briefly and reset, so the silence is the rule reading the outage, not
      # an expression over no data.
      - expr: 'ALERTS{alertname="ApiNotReady", alertstate="pending"}'
        eval_time: 10m30s
        exp_samples:
          - labels: 'ALERTS{alertname="ApiNotReady", alertstate="pending", severity="page"}'
            value: 1
      # The old expression on the same thirty seconds: still true at 15m.
      - expr: 'count(min_over_time(prl_readiness_state[5m]) == 0)'
        eval_time: 15m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(min_over_time(prl_readiness_state[5m]) == 0)'
        eval_time: 16m
        exp_samples: []

  - interval: 15s
    name: readiness that stays degraded pages after five continuous minutes
    input_series:
      # The failure the rule is named for: the database did not come back.
      - series: 'prl_readiness_state'
        values: '1+0x40 0+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ApiNotReady", alertstate="firing"}'
        eval_time: 15m
        exp_samples: []
      - expr: 'ALERTS{alertname="ApiNotReady", alertstate="pending"}'
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="ApiNotReady", alertstate="pending", severity="page"}'
            value: 1
      # 10m15s + 5m. The stated latency is now the measured one.
      - expr: 'ALERTS{alertname="ApiNotReady", alertstate="firing"}'
        eval_time: 15m15s
        exp_samples:
          - labels: 'ALERTS{alertname="ApiNotReady", alertstate="firing", severity="page"}'
            value: 1

  - interval: 15s
    name: a marginal database flapping raises the ticket and not the page
    input_series:
      # In and out of the load balancer every ninety seconds for half an hour.
      # Nothing is down for five continuous minutes and nothing self-heals
      # either, which is precisely the case the two rules divide between them.
      - series: 'prl_readiness_state'
        values: '1+0x5 0+0x5 1+0x5 0+0x5 1+0x5 0+0x5 1+0x5 0+0x5 1+0x200'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ApiNotReady"}'
        eval_time: 20m
        exp_samples: []
      - expr: 'ALERTS{alertname="ReadinessFlapping", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="ReadinessFlapping", alertstate="firing", severity="ticket"}'
            value: 1

  - interval: 15s
    name: an instance that is ready throughout raises neither
    input_series:
      - series: 'prl_readiness_state'
        values: '1+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ApiNotReady"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="ApiNotReady"}'
        eval_time: 90m
        exp_samples: []
      - expr: 'ALERTS{alertname="ReadinessFlapping"}'
        eval_time: 90m
        exp_samples: []
