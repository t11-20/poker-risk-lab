# The `connection-churn` group, two tickets reading `prl_websocket_connections` for two questions:
# churn (`WebSocketReconnectStorm`) and volume (`WebSocketConnectionsHigh`). The last cases hold
# that line in both directions.
#
# The storm rule's old spelling, `rate(opened[5m]) > 3 * rate(closed[1h])`, is reproduced below:
# after a quiet night the baseline is zero, so a class arriving clears it; a real storm raises both
# counters, so 3 opens/s met a bar of 9; and `prl_websocket_closed_total` is absent before its
# first increment, which emptied the comparison. The live connection count is always present.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    name: a class of thirty arriving after a quiet night raises nothing
    input_series:
      # Two hours of night with nothing moving, then thirty learners connecting over twenty minutes
      # and staying.
      - series: 'prl_websocket_opened_total'
        values: '100+0x480 100.375+0.375x79 130+0x200'
      - series: 'prl_websocket_closed_total'
        values: '100+0x760'
      - series: 'prl_websocket_connections'
        values: '0+0x480 0.375+0.375x79 30+0x200'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketReconnectStorm"}'
        eval_time: 125m
        exp_samples: []
      - expr: 'ALERTS{alertname="WebSocketReconnectStorm"}'
        eval_time: 135m
        exp_samples: []
      - expr: 'ALERTS{alertname="WebSocketReconnectStorm"}'
        eval_time: 160m
        exp_samples: []
      # The old expression on the same morning: true long enough to have fired. `count()` because
      # the assertion is "this was true", not a float value.
      - expr: 'count(sum(rate(prl_websocket_opened_total[5m])) > 3 * sum(rate(prl_websocket_closed_total[1h])))'
        eval_time: 132m
        exp_samples:
          - labels: '{}'
            value: 1

  - interval: 15s
    name: thirty learners reconnecting every ten seconds raises a ticket
    input_series:
      # Three opens a second against thirty standing connections, every reconnect succeeding.
      - series: 'prl_websocket_opened_total'
        values: '0+45x400'
      - series: 'prl_websocket_closed_total{code="abnormal"}'
        values: '0+45x400'
      - series: 'prl_websocket_connections'
        values: '30+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketReconnectStorm", alertstate="firing"}'
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="WebSocketReconnectStorm", alertstate="firing", severity="ticket"}'
            value: 1
      # The old expression on the storm it was written for: 3 opens/s against a bar of 9. Silent.
      - expr: 'sum(rate(prl_websocket_opened_total[5m])) > 3 * sum(rate(prl_websocket_closed_total[1h]))'
        eval_time: 30m
        exp_samples: []

  - interval: 15s
    name: a storm before any socket has ever closed raises a ticket
    input_series:
      # `prl_websocket_closed_total` absent, as before its first increment (a proxy resetting
      # connections at the deploy that started the process). The old comparison was empty here.
      - series: 'prl_websocket_opened_total'
        values: '0+15x400'
      - series: 'prl_websocket_connections'
        values: '0+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketReconnectStorm", alertstate="firing"}'
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="WebSocketReconnectStorm", alertstate="firing", severity="ticket"}'
            value: 1
      - expr: 'sum(rate(prl_websocket_opened_total[5m])) > 3 * sum(rate(prl_websocket_closed_total[1h]))'
        eval_time: 12m
        exp_samples: []

  - interval: 15s
    name: a busy deployment where every socket stays up raises nothing
    input_series:
      # Sixty standing connections and one open a minute: volume without churn.
      - series: 'prl_websocket_opened_total'
        values: '0+0.25x400'
      - series: 'prl_websocket_closed_total{code="normal"}'
        values: '0+0.05x400'
      - series: 'prl_websocket_connections'
        values: '60+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketReconnectStorm"}'
        eval_time: 40m
        exp_samples: []

  # WebSocketConnectionsHigh: `prl_websocket_connections > 67`, `for: 10m`. 67 is 70% of the 96
  # concurrent seated players at which one instance saturated in `docs/production/load-test.md`;
  # re-derive it whenever that measurement is repeated.
  - interval: 15s
    name: seventy standing connections raise the capacity ticket after ten minutes
    input_series:
      # Past 70% of the measured saturation and staying: nobody reconnecting.
      - series: 'prl_websocket_connections'
        values: '40+0x40 70+0x300'
      # One open a minute against seventy connections, far under the storm bar of 75: the capacity
      # ticket speaks and the churn ticket does not.
      - series: 'prl_websocket_opened_total'
        values: '0+0.25x341'
      - series: 'prl_websocket_closed_total{code="normal"}'
        values: '0+0.05x341'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh"}'
        eval_time: 10m
        exp_samples: []
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh", alertstate="pending"}'
        eval_time: 19m
        exp_samples:
          - labels: 'ALERTS{alertname="WebSocketConnectionsHigh", alertstate="pending", severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh", alertstate="firing"}'
        eval_time: 20m15s
        exp_samples:
          - labels: 'ALERTS{alertname="WebSocketConnectionsHigh", alertstate="firing", severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="WebSocketReconnectStorm"}'
        eval_time: 40m
        exp_samples: []

  - interval: 15s
    name: a full class of sixty raises nothing, and neither does exactly sixty-seven
    input_series:
      # Sixty, then exactly 67 for half an hour: the only case that tells `> 67` from `>=`.
      - series: 'prl_websocket_connections'
        values: '60+0x80 67+0x300'
      - series: 'prl_websocket_opened_total'
        values: '0+0.25x381'
      - series: 'prl_websocket_closed_total{code="normal"}'
        values: '0+0.05x381'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh"}'
        eval_time: 15m
        exp_samples: []
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh"}'
        eval_time: 40m
        exp_samples: []
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: a five-minute spike over the bar does not raise a capacity ticket
    input_series:
      # Everybody joining for a class's last five minutes, then leaving: never ten minutes over.
      - series: 'prl_websocket_connections'
        values: '40+0x40 80+0x19 40+0x300'
      - series: 'prl_websocket_opened_total'
        values: '0+0.25x360'
      - series: 'prl_websocket_closed_total{code="normal"}'
        values: '0+0.25x360'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh", alertstate="firing"}'
        eval_time: 16m
        exp_samples: []
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh", alertstate="firing"}'
        eval_time: 60m
        exp_samples: []
      # It did reach pending, so the silence is the `for:` outlasting the spike.
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh", alertstate="pending"}'
        eval_time: 13m
        exp_samples:
          - labels: 'ALERTS{alertname="WebSocketConnectionsHigh", alertstate="pending", severity="ticket"}'
            value: 1

  - interval: 15s
    name: a reconnect storm on a small deployment is churn and not capacity
    input_series:
      # Thirty connections re-establishing constantly: churn speaks, capacity does not.
      - series: 'prl_websocket_opened_total'
        values: '0+45x400'
      - series: 'prl_websocket_closed_total{code="abnormal"}'
        values: '0+45x400'
      - series: 'prl_websocket_connections'
        values: '30+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketReconnectStorm", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="WebSocketReconnectStorm", alertstate="firing", severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="WebSocketConnectionsHigh"}'
        eval_time: 20m
        exp_samples: []
