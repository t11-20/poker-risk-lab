# The alerting system reporting on itself: `AlertmanagerNotificationsFailing` (a broken receiver,
# usually one, reportable down the other path), `AlertmanagerDown` (which it cannot report, so
# Prometheus shows it firing in its own UI), and `Watchdog`, whose signal is the GAP between
# notifications, noticed outside this deployment.
#
# promtool can say `Watchdog` always fires, with no input series, at `severity: heartbeat` and
# neither human tier. Where the notification goes is `alerts:preflight` and `alerts:verify` check 7.
# Its negative direction is "must not depend on anything", the second Watchdog case.
#
# `alertmanager_notifications_failed_total` needs no priming: from the pinned
# `prom/alertmanager:v0.28.1@sha256:27c475db…` with two webhook receivers, `/metrics` rendered
# eighty series of it at zero (every integration times five `reason` values) before any attempt, so
# the first failure is a 0 -> 1 step. Re-measure if the digest moves; a zero-tolerance page rests on
# it.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  # AlertmanagerNotificationsFailing (page): `sum(increase(...failed_total[15m])) > 0`, no `for:`.
  - interval: 15s
    name: one notification that could not be delivered pages, on a primed counter
    input_series:
      # The webhook receiver started answering 404: one failure, then Alertmanager gives up. The
      # other integrations stay at their boot-time zero.
      - series: 'alertmanager_notifications_failed_total{job="prl-alertmanager", integration="webhook", reason="clientError"}'
        values: '0+0x40 1+0x300'
      - series: 'alertmanager_notifications_failed_total{job="prl-alertmanager", integration="email", reason="serverError"}'
        values: '0+0x341'
      - series: 'up{job="prl-alertmanager", instance="alertmanager:9093"}'
        values: '1+0x341'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AlertmanagerNotificationsFailing"}'
        eval_time: 5m
        exp_samples: []
      # Zero tolerance and no `for:`: one page that did not arrive is the alert.
      - expr: 'ALERTS{alertname="AlertmanagerNotificationsFailing", alertstate="firing"}'
        eval_time: 11m
        exp_samples:
          - labels: 'ALERTS{alertname="AlertmanagerNotificationsFailing", alertstate="firing", severity="page"}'
            value: 1
      # Alertmanager is up, so the "nothing can be delivered" page must not also ring.
      - expr: 'ALERTS{alertname="AlertmanagerDown"}'
        eval_time: 11m
        exp_samples: []

  - interval: 15s
    name: an SMTP relay refusing this sender is seen through the email integration
    input_series:
      # A rotated SMTP password or a relay answering 550: every notification down that path fails.
      # The rule sums over integrations, so those labels are evidence, not a filter.
      - series: 'alertmanager_notifications_failed_total{job="prl-alertmanager", integration="email", reason="serverError"}'
        values: '0+0x20 0+1x400'
      - series: 'alertmanager_notifications_failed_total{job="prl-alertmanager", integration="webhook", reason="clientError"}'
        values: '0+0x421'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AlertmanagerNotificationsFailing", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="AlertmanagerNotificationsFailing", alertstate="firing", severity="page"}'
            value: 1

  - interval: 15s
    name: an Alertmanager delivering everything for ninety minutes pages nobody
    input_series:
      # Sent moving with failed flat, the healthy state, rendered so a rule reading `sent` instead
      # of `failed` fails here rather than passing over an absent series.
      - series: 'alertmanager_notifications_failed_total{job="prl-alertmanager", integration="webhook", reason="clientError"}'
        values: '0+0x400'
      - series: 'alertmanager_notifications_failed_total{job="prl-alertmanager", integration="email", reason="serverError"}'
        values: '0+0x400'
      - series: 'alertmanager_notifications_total{job="prl-alertmanager", integration="webhook"}'
        values: '0+2x400'
      - series: 'up{job="prl-alertmanager", instance="alertmanager:9093"}'
        values: '1+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AlertmanagerNotificationsFailing"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="AlertmanagerNotificationsFailing"}'
        eval_time: 90m
        exp_samples: []
      - expr: 'ALERTS{alertname="AlertmanagerDown"}'
        eval_time: 90m
        exp_samples: []

  # AlertmanagerDown (page): the `ApiDown` expression on `prl-alertmanager`, `for: 2m`, so four
  # minutes, not two (`availability.test.yml` measures the same arithmetic).
  - interval: 15s
    name: an Alertmanager that stops answering scrapes pages four minutes later
    input_series:
      - series: 'up{job="prl-alertmanager", instance="alertmanager:9093"}'
        values: '1+0x40 0+0x300'
      - series: 'up{job="prl-api", instance="api:3001"}'
        values: '1+0x341'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AlertmanagerDown"}'
        eval_time: 11m
        exp_samples: []
      - expr: 'ALERTS{alertname="AlertmanagerDown", alertstate="pending"}'
        eval_time: 13m45s
        exp_samples:
          - labels: 'ALERTS{alertname="AlertmanagerDown", alertstate="pending", severity="page", job="prl-alertmanager", instance="alertmanager:9093"}'
            value: 1
      - expr: 'ALERTS{alertname="AlertmanagerDown", alertstate="firing"}'
        eval_time: 14m
        exp_samples:
          - labels: 'ALERTS{alertname="AlertmanagerDown", alertstate="firing", severity="page", job="prl-alertmanager", instance="alertmanager:9093"}'
            value: 1
      # The API is fine and must not be reported down by a rule about the delivery path.
      - expr: 'ALERTS{alertname="ApiDown"}'
        eval_time: 14m
        exp_samples: []

  - interval: 15s
    name: an Alertmanager deleted from the configuration still pages, through absent()
    input_series:
      # No `up{job="prl-alertmanager"}` series at all (container or scrape job removed): without
      # `absent()` the delivery path would vanish silently.
      - series: 'up{job="prl-api", instance="api:3001"}'
        values: '1+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AlertmanagerDown", alertstate="firing"}'
        eval_time: 2m
        exp_samples:
          - labels: 'ALERTS{alertname="AlertmanagerDown", alertstate="firing", severity="page", job="prl-alertmanager"}'
            value: 1
      - expr: 'ALERTS{alertname="ApiDown"}'
        eval_time: 30m
        exp_samples: []

  - interval: 15s
    name: an Alertmanager restarted by a config reload does not page
    input_series:
      # Ninety seconds of missed scrapes while the container is replaced: not even pending.
      - series: 'up{job="prl-alertmanager", instance="alertmanager:9093"}'
        values: '1+0x40 0 0 0 0 0 0 1+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AlertmanagerDown"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="AlertmanagerDown"}'
        eval_time: 40m
        exp_samples: []
      - expr: 'max_over_time(up{job="prl-alertmanager"}[2m]) == 0'
        eval_time: 12m
        exp_samples: []

  - interval: 15s
    name: a dead Alertmanager and a stalled notification counter are one incident, and the inhibition covers it
    input_series:
      # Both true, one fault seen twice, which `alertmanager.template.yml` inhibits
      # (`AlertmanagerDown` source, `AlertmanagerNotificationsFailing` target). promtool knows
      # nothing about routing, so this pins the premise: the input fires exactly that pair.
      - series: 'up{job="prl-alertmanager", instance="alertmanager:9093"}'
        values: '1+0x40 0+0x300'
      - series: 'alertmanager_notifications_failed_total{job="prl-alertmanager", integration="webhook", reason="clientError"}'
        values: '0+0x40 0+2x300'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname=~"Alertmanager.*", alertstate="firing"})'
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 2
      - expr: 'ALERTS{alertname="AlertmanagerNotificationsFailing", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="AlertmanagerNotificationsFailing", alertstate="firing", severity="page"}'
            value: 1

  # Watchdog (heartbeat): `vector(1)`, no `for:`, no metric, no scrape.
  - interval: 15s
    name: the heartbeat fires from the first evaluation and never stops
    input_series:
      # A series the test needs, deliberately not one `Watchdog` reads.
      - series: 'up{job="prl-api", instance="api:3001"}'
        values: '1+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="Watchdog", alertstate="firing"}'
        eval_time: 15s
        exp_samples:
          - labels: 'ALERTS{alertname="Watchdog", alertstate="firing", severity="heartbeat"}'
            value: 1
      - expr: 'ALERTS{alertname="Watchdog", alertstate="firing"}'
        eval_time: 90m
        exp_samples:
          - labels: 'ALERTS{alertname="Watchdog", alertstate="firing", severity="heartbeat"}'
            value: 1
      # It must reach NEITHER human tier: as `page` or `ticket` it would notify every repeat
      # interval for ever. `alerts:preflight` guards the destination; this guards the label.
      - expr: 'ALERTS{alertname="Watchdog", severity=~"page|ticket"}'
        eval_time: 90m
        exp_samples: []
      # The only rule that may carry this severity: a second would route a real incident to a
      # machine that pages nobody.
      - expr: 'count(ALERTS{severity="heartbeat"})'
        eval_time: 90m
        exp_samples:
          - labels: '{}'
            value: 1

  - interval: 15s
    name: the heartbeat fires with every series in the deployment absent
    input_series:
      # No API, no readiness, no Alertmanager, no counters: every series it could depend on is gone,
      # and the heartbeat still fires, because `vector(1)` needs no scrape.
      - series: 'prl_metrics_series'
        values: '0+0x40'
    promql_expr_test:
      - expr: 'ALERTS{alertname="Watchdog", alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="Watchdog", alertstate="firing", severity="heartbeat"}'
            value: 1
      # Only the three `absent()` rules fire on this input (`ApiDown`, `AlertmanagerDown`,
      # `PublicOriginProbeDown`); a rule losing its `absent()` half shows here as a two.
      - expr: 'count(ALERTS{alertstate="firing", alertname!="Watchdog"})'
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 3
      - expr: 'ALERTS{alertname="PublicOriginProbeDown", alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="PublicOriginProbeDown", alertstate="firing", severity="ticket", job="prl-public-origin"}'
            value: 1
      - expr: 'ALERTS{alertname="ApiDown", alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="ApiDown", alertstate="firing", severity="page", job="prl-api"}'
            value: 1
      - expr: 'ALERTS{alertname="AlertmanagerDown", alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="AlertmanagerDown", alertstate="firing", severity="page", job="prl-alertmanager"}'
            value: 1
