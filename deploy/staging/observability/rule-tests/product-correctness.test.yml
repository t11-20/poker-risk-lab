# The rules unique to a poker table, each asserted in both directions, with the old spellings
# reproduced:
#
#   * `HandsFailing` and `ArchiveFailing` with a `for:` as long as their window: after one step
#     `increase(x[10m])` is non-zero for 9m45s, so `for: 10m` never leaves `pending`.
#   * `TableActorFailing` at 0.05/s: one stalled seat on a 30 s clock is two failures a minute,
#     fifteen times under the bar.
#   * `HandCompletionGap` as a difference of one-hour increases: 20 on twenty healthy tables, and
#     empty when `prl_hands_completed_total` was unprimed and nothing ever completed.
#
# The single step is the normal input: `rooms/registry.ts` increments `handsFailed` once, by
# `abandoned.length`, when it reconciles hands a restart interrupted.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  # HandsFailing
  - interval: 15s
    name: three hands abandoned by a restart, in one step, page immediately
    input_series:
      # Both reasons primed from boot (`primeLabels`), so the step is 0 -> 3, a rise `increase()`
      # can see, rather than a series appearing at 3.
      - series: 'prl_hands_failed_total{reason="interrupted_by_restart"}'
        values: '0+0x40 3+0x300'
      - series: 'prl_hands_failed_total{reason="room_closed"}'
        values: '0+0x341'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HandsFailing"}'
        eval_time: 5m
        exp_samples: []
      # The step lands at 10m15s and there is no `for:`, so the first evaluation that sees it pages.
      - expr: 'ALERTS{alertname="HandsFailing"}'
        eval_time: 11m
        exp_samples:
          - labels: 'ALERTS{alertname="HandsFailing", alertstate="firing", severity="page"}'
            value: 1
      # True for 9m45s after a single step; the old `for: 10m` wanted 10m.
      - expr: 'sum(increase(prl_hands_failed_total[10m])) > 0'
        eval_time: 19m45s
        exp_samples:
          - labels: '{}'
            value: 3
      - expr: 'sum(increase(prl_hands_failed_total[10m])) > 0'
        eval_time: 20m
        exp_samples: []

  - interval: 15s
    name: a deployment where no hand has ever failed does not page
    input_series:
      - series: 'prl_hands_failed_total{reason="interrupted_by_restart"}'
        values: '0+0x300'
      - series: 'prl_hands_failed_total{reason="room_closed"}'
        values: '0+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HandsFailing"}'
        eval_time: 11m
        exp_samples: []
      - expr: 'ALERTS{alertname="HandsFailing"}'
        eval_time: 60m
        exp_samples: []

  # ArchiveFailing: the same defect one tier down, at 15m/15m.
  - interval: 15s
    name: one archive write that failed raises a ticket
    input_series:
      - series: 'prl_archive_failures_total'
        values: '0+0x40 1+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ArchiveFailing"}'
        eval_time: 5m
        exp_samples: []
      - expr: 'ALERTS{alertname="ArchiveFailing"}'
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="ArchiveFailing", alertstate="firing", severity="ticket"}'
            value: 1
      # 14m45s of truth against an old `for:` of 15m.
      - expr: 'sum(increase(prl_archive_failures_total[15m])) > 0'
        eval_time: 24m45s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'sum(increase(prl_archive_failures_total[15m])) > 0'
        eval_time: 25m
        exp_samples: []

  - interval: 15s
    name: hand history that is persisting cleanly raises nothing
    input_series:
      - series: 'prl_archive_failures_total'
        values: '0+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="ArchiveFailing"}'
        eval_time: 40m
        exp_samples: []

  # TableActorFailing
  - interval: 15s
    name: one bot seat stalling on a thirty-second clock pages after ten minutes
    input_series:
      # Two failures a minute (0.5 per 15 s scrape): one seat timing out on every turn, 0.033/s.
      - series: 'prl_table_actor_failures_total{reason="bot-policy"}'
        values: '0+0.5x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="TableActorFailing", alertstate="pending"}'
        eval_time: 9m
        exp_samples:
          - labels: 'ALERTS{alertname="TableActorFailing", alertstate="pending", severity="page"}'
            value: 1
      - expr: 'ALERTS{alertname="TableActorFailing", alertstate="firing"}'
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="TableActorFailing", alertstate="firing", severity="page"}'
            value: 1
      # The old threshold against the failure this alert is named after: silent.
      - expr: 'sum(rate(prl_table_actor_failures_total[10m])) > 0.05'
        eval_time: 30m
        exp_samples: []

  - interval: 15s
    name: a single actor failure that does not repeat never pages
    input_series:
      - series: 'prl_table_actor_failures_total{reason="bot-policy"}'
        values: '0+0x40 1+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="TableActorFailing", alertstate="firing"}'
        eval_time: 15m
        exp_samples: []
      - expr: 'ALERTS{alertname="TableActorFailing", alertstate="firing"}'
        eval_time: 30m
        exp_samples: []

  - interval: 15s
    name: a burst of five failures that stops never pages
    input_series:
      # Window shorter than the `for:`: five failures at once are true for 4m45s of the ten needed.
      - series: 'prl_table_actor_failures_total{reason="bot-action-rejected"}'
        values: '0+0x40 5+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="TableActorFailing", alertstate="firing"}'
        eval_time: 15m
        exp_samples: []
      - expr: 'ALERTS{alertname="TableActorFailing", alertstate="firing"}'
        eval_time: 40m
        exp_samples: []

  # HandCompletionGap
  - interval: 15s
    name: twenty healthy tables each holding a hand raise nothing
    input_series:
      # Twenty tables dealing continuously: `started` runs exactly twenty ahead of `completed`,
      # the healthy steady state the old rule fired on.
      - series: 'prl_hands_started_total'
        values: '20+20x400'
      - series: 'prl_hands_completed_total'
        values: '0+20x400'
      - series: 'prl_hands_failed_total{reason="room_closed"}'
        values: '0+0x400'
      - series: 'prl_hands_failed_total{reason="interrupted_by_restart"}'
        values: '0+0x400'
      - series: 'prl_rooms_live'
        values: '20+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HandCompletionGap"}'
        eval_time: 45m
        exp_samples: []
      - expr: 'ALERTS{alertname="HandCompletionGap"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: no hand ever completes, and the primed counter makes it visible
    input_series:
      # The catastrophe: hands dealt, none settles. `prl_hands_completed_total` is primed at zero,
      # which is what makes the subtraction produce a number.
      - series: 'prl_hands_started_total'
        values: '0+20x400'
      - series: 'prl_hands_completed_total'
        values: '0+0x400'
      - series: 'prl_hands_failed_total{reason="room_closed"}'
        values: '0+0x400'
      - series: 'prl_hands_failed_total{reason="interrupted_by_restart"}'
        values: '0+0x400'
      - series: 'prl_rooms_live'
        values: '20+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HandCompletionGap", alertstate="firing"}'
        eval_time: 25m
        exp_samples: []
      - expr: 'ALERTS{alertname="HandCompletionGap", alertstate="firing"}'
        eval_time: 45m
        exp_samples:
          - labels: 'ALERTS{alertname="HandCompletionGap", alertstate="firing", severity="ticket"}'
            value: 1

  - interval: 15s
    name: the same catastrophe with an unprimed completed counter is invisible to any subtraction
    input_series:
      # `prl_hands_completed_total` ABSENT, as an unprimed counter that never increments.
      # `A - absent` is empty, so no subtraction can fire. The fix is `primeLabels` in
      # `observability/metrics.ts` (guarded by `apps/api/test/observability-metrics.test.ts`); this
      # case makes removing the priming fail something.
      - series: 'prl_hands_started_total'
        values: '0+20x400'
      - series: 'prl_hands_failed_total{reason="room_closed"}'
        values: '0+0x400'
      - series: 'prl_hands_failed_total{reason="interrupted_by_restart"}'
        values: '0+0x400'
      - series: 'prl_rooms_live'
        values: '20+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HandCompletionGap"}'
        eval_time: 45m
        exp_samples: []
      - expr: 'sum(prl_hands_started_total) - sum(prl_hands_completed_total)'
        eval_time: 45m
        exp_samples: []

  - interval: 15s
    name: one hand vanishing among twenty healthy tables raises a ticket
    input_series:
      # As the healthy case, plus one hand that never settled: twenty-one unaccounted for against
      # twenty rooms.
      - series: 'prl_hands_started_total'
        values: '21+20x400'
      - series: 'prl_hands_completed_total'
        values: '0+20x400'
      - series: 'prl_hands_failed_total{reason="room_closed"}'
        values: '0+0x400'
      - series: 'prl_hands_failed_total{reason="interrupted_by_restart"}'
        values: '0+0x400'
      - series: 'prl_rooms_live'
        values: '20+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HandCompletionGap", alertstate="firing"}'
        eval_time: 25m
        exp_samples: []
      - expr: 'ALERTS{alertname="HandCompletionGap", alertstate="firing"}'
        eval_time: 35m
        exp_samples:
          - labels: 'ALERTS{alertname="HandCompletionGap", alertstate="firing", severity="ticket"}'
            value: 1

  - interval: 15s
    name: a hand counted as failed is accounted for and does not also raise the gap
    input_series:
      # One table closed mid-hand: `LiveRoom.close()` counts `room_closed`, so the hand is
      # accounted for. Without the `- failed` term every fenced room would raise a second ticket.
      - series: 'prl_hands_started_total'
        values: '21+20x400'
      - series: 'prl_hands_completed_total'
        values: '0+20x400'
      - series: 'prl_hands_failed_total{reason="room_closed"}'
        values: '1+0x400'
      - series: 'prl_hands_failed_total{reason="interrupted_by_restart"}'
        values: '0+0x400'
      - series: 'prl_rooms_live'
        values: '20+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HandCompletionGap"}'
        eval_time: 45m
        exp_samples: []

  # SeatReleaseFailing, RoomOwnershipFenced, RoomOwnershipRefused: the two models `alert-rules.yml`
  # names (zero tolerance, and a window shorter than the `for:`) and the fencing page.
  # `RoomOwnershipFenced` is two processes authoritative for one room, which `db/migrations/0005`
  # and `rooms/ownership.ts` exist to make impossible, on a series `RoomRegistry.releaseLeaseSoon`
  # calls zero-tolerance.
  - interval: 15s
    name: one unreleased chair raises a ticket, and a quiet table does not
    input_series:
      # Primed from boot, so the step is 0 -> 1, a rise `increase()` can see.
      - series: 'prl_seat_release_failures_total'
        values: '0+0x40 1+0x300'
    promql_expr_test:
      # Before the step: silent, which a rule that fired on everything would fail.
      - expr: 'ALERTS{alertname="SeatReleaseFailing"}'
        eval_time: 5m
        exp_samples: []
      # No `for:`: the step lands at 10m15s and the next evaluation raises it.
      - expr: 'ALERTS{alertname="SeatReleaseFailing"}'
        eval_time: 11m
        exp_samples:
          - labels: 'ALERTS{alertname="SeatReleaseFailing", alertstate="firing", severity="ticket"}'
            value: 1

  - interval: 15s
    name: a table that never loses a chair raises nothing at all
    input_series:
      - series: 'prl_seat_release_failures_total'
        values: '0+0x341'
    promql_expr_test:
      - expr: 'ALERTS{alertname="SeatReleaseFailing"}'
        eval_time: 40m
        exp_samples: []

  - interval: 15s
    name: a single fencing pages immediately, because two processes served one room
    input_series:
      - series: 'prl_room_fencings_total{reason="fenced"}'
        values: '0+0x40 1+0x300'
      - series: 'prl_room_fencings_total{reason="lease_expired"}'
        values: '0+0x341'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RoomOwnershipFenced"}'
        eval_time: 5m
        exp_samples: []
      - expr: 'ALERTS{alertname="RoomOwnershipFenced"}'
        eval_time: 11m
        exp_samples:
          - labels: 'ALERTS{alertname="RoomOwnershipFenced", alertstate="firing", severity="page"}'
            value: 1

  - interval: 15s
    name: a process that never loses a room pages nobody
    input_series:
      - series: 'prl_room_fencings_total{reason="fenced"}'
        values: '0+0x341'
      - series: 'prl_room_fencings_total{reason="lease_expired"}'
        values: '0+0x341'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RoomOwnershipFenced"}'
        eval_time: 40m
        exp_samples: []

  - interval: 15s
    name: a rolling deploy's burst of refusals must never page
    input_series:
      # Six rooms refused while the old container drains, then nothing: every deploy's shape. The 5m
      # window is SHORTER than the 10m `for:`, so a burst that stops cannot fire.
      - series: 'prl_room_ownership_refusals_total'
        values: '0+0x40 6+0x300'
    promql_expr_test:
      # Pending, never firing: asserted where a shorter `for:` would already have fired, and after
      # the window drains.
      - expr: 'ALERTS{alertname="RoomOwnershipRefused", alertstate="firing"}'
        eval_time: 14m
        exp_samples: []
      - expr: 'ALERTS{alertname="RoomOwnershipRefused", alertstate="firing"}'
        eval_time: 21m
        exp_samples: []
      - expr: 'ALERTS{alertname="RoomOwnershipRefused"}'
        eval_time: 40m
        exp_samples: []
      # …and it did reach `pending`, so the silence is the `for:` holding it back, not a series
      # renamed away.
      - expr: 'ALERTS{alertname="RoomOwnershipRefused", alertstate="pending"}'
        eval_time: 11m
        exp_samples:
          - labels: 'ALERTS{alertname="RoomOwnershipRefused", alertstate="pending", severity="page"}'
            value: 1

  - interval: 15s
    name: refusals that do not stop page, which is the failure the rule names
    input_series:
      # The direction the rule exists for: a second replica refused every room it does not hold,
      # one refusal per scrape, indefinitely.
      - series: 'prl_room_ownership_refusals_total'
        values: '0+0x40 0+1x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RoomOwnershipRefused", alertstate="firing"}'
        eval_time: 25m
        exp_samples:
          - labels: 'ALERTS{alertname="RoomOwnershipRefused", alertstate="firing", severity="page"}'
            value: 1
