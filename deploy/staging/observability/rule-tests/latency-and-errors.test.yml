# The `latency-and-errors` group: `HttpErrorRateHigh`, `HttpLatencyP99High` (pages) and
# `HttpLatencyP95Degraded` (ticket).
#
# `histogram_quantile` interpolates INSIDE a bucket, so both latency thresholds (1 s, 250 ms) sit on
# bucket boundaries of `prl_http_request_duration_seconds` (`alerts.md` § Why the thresholds fall on
# bucket boundaries) and can fire only on observations counted ABOVE them. Every silent case
# therefore puts real traffic in the bucket just under the threshold.
#
# The error ratio has two empty shapes, both asserted silent: 0/0 overnight is NaN, and no
# `status="5xx"` series at all makes the numerator empty.
#
# The two latency rules are deliberately not inhibited against each other: p99 over a second does
# not imply p95 over 250 ms (a fast body with a slow tail), so neither is a consequence of the
# other. The last case is the one where both fire. `EventLoopBlocked` and `ApiDown` inhibit both.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  # HttpErrorRateHigh (page)
  - interval: 15s
    name: three percent of requests answering 5xx pages after five minutes
    input_series:
      # A hundred requests per scrape, three of them 5xx. `metrics.ts` buckets the status into a
      # class, so these two series are the whole denominator.
      - series: 'prl_http_requests_total{method="GET", route="/api/v1/rooms/:id", status="5xx"}'
        values: '0+3x400'
      - series: 'prl_http_requests_total{method="GET", route="/api/v1/rooms/:id", status="2xx"}'
        values: '0+97x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HttpErrorRateHigh", alertstate="firing"}'
        eval_time: 4m
        exp_samples: []
      - expr: 'ALERTS{alertname="HttpErrorRateHigh", alertstate="pending"}'
        eval_time: 4m
        exp_samples:
          - labels: 'ALERTS{alertname="HttpErrorRateHigh", alertstate="pending", severity="page"}'
            value: 1
      - expr: 'ALERTS{alertname="HttpErrorRateHigh", alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="HttpErrorRateHigh", alertstate="firing", severity="page"}'
            value: 1

  - interval: 15s
    name: one percent of requests answering 5xx does not page
    input_series:
      # Under the bar for an hour. Not zero: a rule tested only on a clean deployment would pass
      # with the threshold moved anywhere.
      - series: 'prl_http_requests_total{method="POST", route="/api/v1/analysis", status="5xx"}'
        values: '0+1x400'
      - series: 'prl_http_requests_total{method="POST", route="/api/v1/analysis", status="2xx"}'
        values: '0+99x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HttpErrorRateHigh"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="HttpErrorRateHigh"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: a wall of 4xx is the product working and must not page
    input_series:
      # Every refusal here is a 4xx with a contract error code, the product working. If the status
      # matcher were dropped from the numerator, this case fails.
      - series: 'prl_http_requests_total{method="POST", route="/api/v1/session", status="4xx"}'
        values: '0+60x400'
      - series: 'prl_http_requests_total{method="GET", route="/api/v1/rooms", status="2xx"}'
        values: '0+40x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HttpErrorRateHigh"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="AuthFailureSpike"}'
        eval_time: 30m
        exp_samples: []

  - interval: 15s
    name: a deployment that has never served a 5xx leaves the ratio empty and silent
    input_series:
      # `prl_http_requests_total` is not primed on `status`, so no 5xx means no such series and an
      # empty numerator, and `empty / anything` is empty. Correct here (no 5xx, no alert), but the
      # shape that hid the old `HandCompletionGap`'s catastrophe, so it is asserted as deliberate.
      - series: 'prl_http_requests_total{method="GET", route="/api/v1/rooms", status="2xx"}'
        values: '0+100x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HttpErrorRateHigh"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'sum(rate(prl_http_requests_total{status="5xx"}[5m]))'
        eval_time: 30m
        exp_samples: []

  - interval: 15s
    name: an evening of traffic followed by a quiet night does not page on 0/0
    input_series:
      # Half an hour of a class at one 5xx in a hundred, then nobody until morning: the busy half is
      # silent, and the quiet half is 0/0, NaN, not greater than 0.02.
      #
      # That NaN is why a deployment idle at night does not page every night, and why the two
      # windows must MATCH: an hour-long numerator over a five-minute denominator divides a real
      # count by zero at 45m, which is `+Inf` and pages.
      - series: 'prl_http_requests_total{method="GET", route="/api/v1/rooms", status="2xx"}'
        values: '0+99x120 11880+0x400'
      - series: 'prl_http_requests_total{method="GET", route="/api/v1/rooms", status="5xx"}'
        values: '0+1x120 120+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HttpErrorRateHigh"}'
        eval_time: 20m
        exp_samples: []
      - expr: 'ALERTS{alertname="HttpErrorRateHigh"}'
        eval_time: 45m
        exp_samples: []
      - expr: 'ALERTS{alertname="HttpErrorRateHigh"}'
        eval_time: 90m
        exp_samples: []

  # HttpLatencyP99High (page): `histogram_quantile(0.99, ...[5m]) > 1`, `for: 10m`. Every
  # `HTTP_BUCKETS` boundary is rendered, cumulative, because a histogram missing its `+Inf` bucket
  # produces no quantile at all.
  - interval: 15s
    name: fifteen requests in a thousand over a second pages at p99
    input_series:
      # A fast body with a slow tail: 96% inside 250 ms and 15 in 1000 between 1 s and 2.5 s. p99 is
      # counted ABOVE the boundary, and p95 is 247 ms, under its own.
      - series: 'prl_http_request_duration_seconds_bucket{le="0.005"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.01"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.025"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.05"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.1"}'
        values: '0+400x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.25"}'
        values: '0+960x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.5"}'
        values: '0+975x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="1"}'
        values: '0+985x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="2.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="10"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+1000x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HttpLatencyP99High", alertstate="firing"}'
        eval_time: 9m
        exp_samples: []
      - expr: 'ALERTS{alertname="HttpLatencyP99High", alertstate="firing"}'
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="HttpLatencyP99High", alertstate="firing", severity="page"}'
            value: 1
      # p95 is 247 ms, so the ticket stays silent while the page fires: an inhibition between the
      # two would suppress a true reading.
      - expr: 'ALERTS{alertname="HttpLatencyP95Degraded"}'
        eval_time: 45m
        exp_samples: []

  - interval: 15s
    name: five requests in a thousand over a second is under the bar and does not page
    input_series:
      # 995 under 1 s: p99 interpolates to 875 ms inside (0.5, 1]. A threshold drifted below the
      # boundary would fire here, as would a rule comparing a raw bucket count.
      - series: 'prl_http_request_duration_seconds_bucket{le="0.005"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.01"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.025"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.05"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.1"}'
        values: '0+400x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.25"}'
        values: '0+960x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.5"}'
        values: '0+975x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="1"}'
        values: '0+995x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="2.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="10"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+1000x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HttpLatencyP99High"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="HttpLatencyP99High"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: a healthy API answering in a hundred milliseconds raises neither latency rule
    input_series:
      # The everyday shape: 99% under 100 ms, nothing above 250 ms.
      - series: 'prl_http_request_duration_seconds_bucket{le="0.005"}'
        values: '0+600x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.01"}'
        values: '0+900x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.025"}'
        values: '0+980x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.05"}'
        values: '0+995x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.1"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.25"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="1"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="2.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="10"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+1000x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"HttpLatency.*"}'
        eval_time: 45m
        exp_samples: []
      - expr: 'ALERTS{alertname=~"HttpLatency.*"}'
        eval_time: 90m
        exp_samples: []

  # HttpLatencyP95Degraded (ticket): `[10m]` window, 250 ms, `for: 30m`, the longest `for:` in the
  # file (sluggish without being broken is a working-hours question). The silent cases are
  # evaluated well past it.
  - interval: 15s
    name: p95 at 375 ms for half an hour raises a ticket and not a page
    input_series:
      # A tenth over 250 ms and none over a second, a query that lost an index: p95 interpolates to
      # 375 ms inside (0.25, 0.5].
      - series: 'prl_http_request_duration_seconds_bucket{le="0.005"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.01"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.025"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.05"}'
        values: '0+100x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.1"}'
        values: '0+500x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.25"}'
        values: '0+900x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="1"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="2.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="10"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+1000x400'
    promql_expr_test:
      # Twenty-nine minutes in, still not a ticket: without this, shortening the `for:` to `5m`
      # passes every other assertion.
      - expr: 'ALERTS{alertname="HttpLatencyP95Degraded", alertstate="firing"}'
        eval_time: 29m
        exp_samples: []
      - expr: 'ALERTS{alertname="HttpLatencyP95Degraded", alertstate="pending"}'
        eval_time: 29m
        exp_samples:
          - labels: 'ALERTS{alertname="HttpLatencyP95Degraded", alertstate="pending", severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="HttpLatencyP95Degraded", alertstate="firing"}'
        eval_time: 35m
        exp_samples:
          - labels: 'ALERTS{alertname="HttpLatencyP95Degraded", alertstate="firing", severity="ticket"}'
            value: 1
      # Nothing over a second, so the page must not ring.
      - expr: 'ALERTS{alertname="HttpLatencyP99High"}'
        eval_time: 35m
        exp_samples: []

  - interval: 15s
    name: p95 just under 250 ms for an hour and a half raises nothing
    input_series:
      # 96% under 250 ms, so p95 is inside (0.1, 0.25]: the nearest miss the rule can have.
      - series: 'prl_http_request_duration_seconds_bucket{le="0.005"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.01"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.025"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.05"}'
        values: '0+100x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.1"}'
        values: '0+500x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.25"}'
        values: '0+960x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="1"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="2.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="10"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+1000x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HttpLatencyP95Degraded"}'
        eval_time: 45m
        exp_samples: []
      - expr: 'ALERTS{alertname="HttpLatencyP95Degraded"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: a deployment slow at both quantiles raises the page and the ticket, uninhibited
    input_series:
      # Everything past 500 ms and a fifth past a second, a saturated box: both rules fire and no
      # inhibition pairs them, so one cause is two notifications. Recorded, not accepted silently;
      # `group_by: ['alertname']` and the shared runbook (`elevated-error-rate.md`) keep it cheap.
      - series: 'prl_http_request_duration_seconds_bucket{le="0.005"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.01"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.025"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.05"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.1"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.25"}'
        values: '0+0x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="0.5"}'
        values: '0+200x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="1"}'
        values: '0+800x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="2.5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="5"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="10"}'
        values: '0+1000x400'
      - series: 'prl_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+1000x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="HttpLatencyP99High", alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="HttpLatencyP99High", alertstate="firing", severity="page"}'
            value: 1
      - expr: 'ALERTS{alertname="HttpLatencyP95Degraded", alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="HttpLatencyP95Degraded", alertstate="firing", severity="ticket"}'
            value: 1
