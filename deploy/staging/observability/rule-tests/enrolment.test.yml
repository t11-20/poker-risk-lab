# The two rules on `prl_seat_entitlement_refusals_total`. The reasons are separate rules because
# they are separate incidents: summed, the quiet one (a chair a restart did not give back) would
# hide inside the loud one (a cohort list that missed people). The last case holds that line.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    name: a cohort arriving to a list that missed them raises a ticket
    input_series:
      # Six refusals over about a minute. The counter is primed, so this is a rise from zero, which
      # `increase()` can see, rather than a series appearing at six.
      - series: 'prl_seat_entitlement_refusals_total{reason="not_entitled"}'
        values: '0+0x20 1+1x5 6+0x400'
      - series: 'prl_seat_entitlement_refusals_total{reason="seat_not_restored"}'
        values: '0+0x426'
    promql_expr_test:
      - expr: 'ALERTS{alertname="SeatEntitlementRefused"}'
        eval_time: 4m
        exp_samples: []
      - expr: 'ALERTS{alertname="SeatEntitlementRefused"}'
        eval_time: 7m
        exp_samples:
          - labels: 'ALERTS{alertname="SeatEntitlementRefused", alertstate="firing", severity="ticket"}'
            value: 1
      # The other rule must stay silent: nothing was lost at a restart.
      - expr: 'ALERTS{alertname="SeatNotRestored"}'
        eval_time: 7m
        exp_samples: []

  - interval: 15s
    name: a passer-by tapping a seat on an enforced instance raises nothing
    input_series:
      # Three refusals, once: the guard doing its job on an enforced deployment.
      - series: 'prl_seat_entitlement_refusals_total{reason="not_entitled"}'
        values: '0+0x40 3+0x400'
      - series: 'prl_seat_entitlement_refusals_total{reason="seat_not_restored"}'
        values: '0+0x441'
    promql_expr_test:
      - expr: 'ALERTS{alertname="SeatEntitlementRefused"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="SeatEntitlementRefused"}'
        eval_time: 40m
        exp_samples: []

  - interval: 15s
    name: an open instance where nobody is ever refused raises nothing
    input_series:
      # `PRL_ENROLMENT_REQUIRED=off`, the default: both series at zero for ever.
      - series: 'prl_seat_entitlement_refusals_total{reason="not_entitled"}'
        values: '0+0x400'
      - series: 'prl_seat_entitlement_refusals_total{reason="seat_not_restored"}'
        values: '0+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="SeatEntitlementRefused"}'
        eval_time: 60m
        exp_samples: []
      - expr: 'ALERTS{alertname="SeatNotRestored"}'
        eval_time: 60m
        exp_samples: []

  - interval: 15s
    name: one chair not given back after a restart raises a ticket
    input_series:
      # Zero tolerance and no `for:`. Nobody is at a keyboard for this one, so if this rule does
      # not report it, nothing does.
      - series: 'prl_seat_entitlement_refusals_total{reason="seat_not_restored"}'
        values: '0+0x40 1+0x400'
      - series: 'prl_seat_entitlement_refusals_total{reason="not_entitled"}'
        values: '0+0x441'
    promql_expr_test:
      - expr: 'ALERTS{alertname="SeatNotRestored"}'
        eval_time: 5m
        exp_samples: []
      - expr: 'ALERTS{alertname="SeatNotRestored"}'
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="SeatNotRestored", alertstate="firing", severity="ticket"}'
            value: 1

  - interval: 15s
    name: a busy morning of refusals does not hide a chair that was not restored
    input_series:
      # Both at once, the case a single summed rule would get wrong.
      - series: 'prl_seat_entitlement_refusals_total{reason="not_entitled"}'
        values: '0+0x20 1+1x9 10+0x400'
      - series: 'prl_seat_entitlement_refusals_total{reason="seat_not_restored"}'
        values: '0+0x20 1+0x420'
    promql_expr_test:
      - expr: 'ALERTS{alertname="SeatEntitlementRefused"}'
        eval_time: 9m
        exp_samples:
          - labels: 'ALERTS{alertname="SeatEntitlementRefused", alertstate="firing", severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="SeatNotRestored"}'
        eval_time: 9m
        exp_samples:
          - labels: 'ALERTS{alertname="SeatNotRestored", alertstate="firing", severity="ticket"}'
            value: 1
