# The security rules. Each old rate threshold was measured silent for an hour of the attack it
# names (one refused read a second, two failed sign-ins a second, a hundred bad-Origin refusals in
# ten minutes), and the rate limiter bans anyone faster. Thresholds are now near zero with the
# persistence in a `for:` longer than the window, so a burst that stops cannot fire them. Each old
# expression is evaluated here against the traffic it is named for.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  # AuthzFailureSpike (page)
  - interval: 15s
    name: somebody walking room ids at one request a second pages after ten minutes
    input_series:
      # 15 refusals per 15 s scrape: one a second, a hand-run loop under the ban threshold.
      - series: 'prl_authz_failures_total{reason="not_room_member"}'
        values: '0+15x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AuthzFailureSpike", alertstate="pending"}'
        eval_time: 9m
        exp_samples:
          - labels: 'ALERTS{alertname="AuthzFailureSpike", alertstate="pending", severity="page"}'
            value: 1
      - expr: 'ALERTS{alertname="AuthzFailureSpike", alertstate="firing"}'
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="AuthzFailureSpike", alertstate="firing", severity="page"}'
            value: 1
      # The old threshold against the same hour of enumeration: silent.
      - expr: 'sum(rate(prl_authz_failures_total[5m])) > 2'
        eval_time: 60m
        exp_samples: []

  - interval: 15s
    name: a few refusals from a learner following a dead link do not page
    input_series:
      # Three refusals, once: a link to a room they were removed from, clicked and retried.
      - series: 'prl_authz_failures_total{reason="room_not_found_or_not_permitted"}'
        values: '0+0x40 3+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AuthzFailureSpike"}'
        eval_time: 15m
        exp_samples: []
      - expr: 'ALERTS{alertname="AuthzFailureSpike"}'
        eval_time: 40m
        exp_samples: []

  - interval: 15s
    name: a burst of twenty refusals that stops does not page
    input_series:
      # Above the threshold for 4m45s against a ten-minute `for:`: what the shorter window buys.
      - series: 'prl_authz_failures_total{reason="forbidden"}'
        values: '0+0x40 20+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AuthzFailureSpike", alertstate="firing"}'
        eval_time: 15m
        exp_samples: []
      - expr: 'ALERTS{alertname="AuthzFailureSpike", alertstate="firing"}'
        eval_time: 40m
        exp_samples: []

  # AuthFailureSpike (ticket)
  - interval: 15s
    name: credential stuffing at two attempts a second raises a ticket
    input_series:
      - series: 'prl_auth_failures_total{reason="not_authenticated"}'
        values: '0+30x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AuthFailureSpike", alertstate="firing"}'
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="AuthFailureSpike", alertstate="firing", severity="ticket"}'
            value: 1
      # 7,200 failed sign-ins an hour, under the old threshold.
      - expr: 'sum(rate(prl_auth_failures_total[5m])) > 5'
        eval_time: 60m
        exp_samples: []

  - interval: 15s
    name: the background of expired sessions and stale tabs raises nothing
    input_series:
      # One failure a minute across a cohort of thirty with tabs left open overnight: the real
      # background rate the threshold has to sit above.
      - series: 'prl_auth_failures_total{reason="session_expired"}'
        values: '0+0.25x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AuthFailureSpike"}'
        eval_time: 40m
        exp_samples: []
      - expr: 'ALERTS{alertname="AuthFailureSpike"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: a hundred failures at one deploy boundary and then nothing raises no ticket
    input_series:
      - series: 'prl_auth_failures_total{reason="csrf_failed"}'
        values: '0+0x40 100+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="AuthFailureSpike", alertstate="firing"}'
        eval_time: 15m
        exp_samples: []
      - expr: 'ALERTS{alertname="AuthFailureSpike", alertstate="firing"}'
        eval_time: 40m
        exp_samples: []

  # WebSocketRefusalSpike (ticket)
  - interval: 15s
    name: a hundred bad-Origin refusals over ten minutes raises a ticket
    input_series:
      # 2.5 per 15 s is 100 per ten minutes, the measured-silent case.
      - series: 'prl_websocket_refused_total{reason="bad_origin"}'
        values: '0+2.5x400'
      # Other refusal reasons must not contribute: only the Origin check defends a handshake.
      - series: 'prl_websocket_refused_total{reason="unauthenticated"}'
        values: '0+40x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketRefusalSpike", alertstate="firing"}'
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="WebSocketRefusalSpike", alertstate="firing", severity="ticket"}'
            value: 1
      - expr: 'sum(rate(prl_websocket_refused_total{reason="bad_origin"}[10m])) > 0.5'
        eval_time: 60m
        exp_samples: []

  - interval: 15s
    name: one stray bad-Origin refusal raises nothing
    input_series:
      - series: 'prl_websocket_refused_total{reason="bad_origin"}'
        values: '0+0x40 1+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketRefusalSpike", alertstate="firing"}'
        eval_time: 15m
        exp_samples: []
      - expr: 'ALERTS{alertname="WebSocketRefusalSpike", alertstate="firing"}'
        eval_time: 40m
        exp_samples: []

  - interval: 15s
    name: an origin missing from PUBLIC_WEB_ORIGIN after a deploy raises a ticket
    input_series:
      # Every learner's socket refused, continuously, at a modest rate: persistence, not size.
      - series: 'prl_websocket_refused_total{reason="bad_origin"}'
        values: '0+0x20 0+1x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="WebSocketRefusalSpike", alertstate="firing"}'
        eval_time: 8m
        exp_samples: []
      - expr: 'ALERTS{alertname="WebSocketRefusalSpike", alertstate="firing"}'
        eval_time: 18m
        exp_samples:
          - labels: 'ALERTS{alertname="WebSocketRefusalSpike", alertstate="firing", severity="ticket"}'
            value: 1

  # RateLimitBans (ticket): `sum(increase(prl_rate_limit_events_total{kind="banned"}[15m])) > 0`,
  # no `for:`.
  #
  # The rule depends on `primeLabels` on that counter: a series is created by its FIRST increment
  # and `increase()` does not assume a mid-range series began at zero, so an unprimed counter hides
  # exactly the occurrence a zero-tolerance rule exists for. The last case evaluates that, so
  # nobody deletes `primeLabels` as tidying.
  - interval: 15s
    name: the first ban raises a ticket, because the counter was primed at zero
    input_series:
      # Primed from boot on both values of a closed two-member set, so the first
      # ban is a 0 -> 1 step and `increase()` can see the rise.
      - series: 'prl_rate_limit_events_total{kind="banned"}'
        values: '0+0x40 1+0x300'
      # 429s are the limiter doing its job for a busy client and must never
      # raise anything on their own.
      - series: 'prl_rate_limit_events_total{kind="limited"}'
        values: '0+3x341'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RateLimitBans"}'
        eval_time: 5m
        exp_samples: []
      # No `for:`, so the evaluation after the step is the alert.
      - expr: 'ALERTS{alertname="RateLimitBans", alertstate="firing"}'
        eval_time: 11m
        exp_samples:
          - labels: 'ALERTS{alertname="RateLimitBans", alertstate="firing", severity="ticket"}'
            value: 1
      # Fifteen minutes after the ban the window drains and the ticket resolves, asserted so "still
      # firing an hour later" cannot be mistaken for the healthy silence in the next case.
      - expr: 'ALERTS{alertname="RateLimitBans"}'
        eval_time: 40m
        exp_samples: []

  - interval: 15s
    name: a busy client collecting 429s all afternoon is never banned and raises nothing
    input_series:
      # Three 429s per scrape, for ever, honouring `Retry-After`. A rule that lost its
      # `kind="banned"` matcher would fire here immediately.
      - series: 'prl_rate_limit_events_total{kind="limited"}'
        values: '0+3x400'
      - series: 'prl_rate_limit_events_total{kind="banned"}'
        values: '0+0x400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RateLimitBans"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="RateLimitBans"}'
        eval_time: 90m
        exp_samples: []

  - interval: 15s
    name: the same first ban on an unprimed counter is invisible, which is why priming exists
    input_series:
      # The banned series appears at t=10m15s reading 1, as an unprimed counter would: every sample
      # in the window is 1, so the increase is zero.
      - series: 'prl_rate_limit_events_total{kind="banned"}'
        values: '_x40 1+0x300'
      - series: 'prl_rate_limit_events_total{kind="limited"}'
        values: '0+3x341'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RateLimitBans"}'
        eval_time: 11m
        exp_samples: []
      - expr: 'ALERTS{alertname="RateLimitBans"}'
        eval_time: 20m
        exp_samples: []
      - expr: 'ALERTS{alertname="RateLimitBans"}'
        eval_time: 60m
        exp_samples: []
      # The series holds a ban; only the zero in front of it is missing.
      - expr: 'sum(prl_rate_limit_events_total{kind="banned"})'
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'sum(increase(prl_rate_limit_events_total{kind="banned"}[15m]))'
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 0
