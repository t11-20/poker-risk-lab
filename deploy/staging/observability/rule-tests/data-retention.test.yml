# `RetentionSweepStalled`: `max(prl_retention_sweep_age_seconds) > 27000`, `for: 15m`. Nothing else
# degrades when the sweep stops, so this rule is the whole detection surface for the `/privacy`
# retention promise. The first two cases are the two flat row counters (a healthy sweep removing
# nothing, a dead timer) that only the age gauge tells apart.
#
# The gauge counts from process start when no sweep has completed, so it RESETS on every restart.
# With the first sweep at T+60s (`FIRST_SWEEP_DELAY_MS`), a process that dies before sweeping is a
# crash loop `ProcessRestartLoop` pages on; the last two cases check that from this side as well as
# from `test/retention-sweep.test.ts`.
rule_files:
  - ../alert-rules.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    name: a sweep that has not completed for seven and a half hours raises a ticket
    input_series:
      # The timer died just after a successful sweep, so the age climbs one second per second
      # from zero and never resets.
      - series: 'prl_retention_sweep_age_seconds'
        values: '0+15x2400'
    promql_expr_test:
      # 27,000 s is 7h30m. Silent at seven hours, which a rule that fires on everything would fail.
      - expr: 'ALERTS{alertname="RetentionSweepStalled"}'
        eval_time: 7h
        exp_samples: []
      - expr: 'ALERTS{alertname="RetentionSweepStalled", alertstate="pending"}'
        eval_time: 7h35m
        exp_samples:
          - labels: 'ALERTS{alertname="RetentionSweepStalled", alertstate="pending", severity="ticket"}'
            value: 1
      # Under eight hours after the last sweep, the latency `alerts.md` states for this rule.
      - expr: 'ALERTS{alertname="RetentionSweepStalled", alertstate="firing"}'
        eval_time: 7h50m
        exp_samples:
          - labels: 'ALERTS{alertname="RetentionSweepStalled", alertstate="firing", severity="ticket"}'
            value: 1

  - interval: 15s
    name: a sweep running on time every six hours raises nothing, even removing nothing
    input_series:
      # The healthy sawtooth, peaking at 21,600 as each six-hourly sweep completes, possibly having
      # deleted zero rows. 21,600 against 27,000 is the margin for a slow sweep or a late scrape.
      - series: 'prl_retention_sweep_age_seconds'
        values: '0+15x1439 0+15x1439 0+15x1439'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RetentionSweepStalled"}'
        eval_time: 5h
        exp_samples: []
      # The peak of the first tooth, the closest a healthy deployment comes: not even pending.
      - expr: 'ALERTS{alertname="RetentionSweepStalled"}'
        eval_time: 5h59m
        exp_samples: []
      - expr: 'ALERTS{alertname="RetentionSweepStalled"}'
        eval_time: 11h59m
        exp_samples: []
      - expr: 'ALERTS{alertname="RetentionSweepStalled"}'
        eval_time: 17h
        exp_samples: []

  - interval: 15s
    name: one missed tick is caught rather than a day of them
    input_series:
      # A sweep at six hours, then none: 27,000 is short enough that a SINGLE missed tick is caught
      # (`alerts.md`).
      - series: 'prl_retention_sweep_age_seconds'
        values: '0+15x1439 0+15x2400'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RetentionSweepStalled"}'
        eval_time: 11h59m
        exp_samples: []
      - expr: 'ALERTS{alertname="RetentionSweepStalled", alertstate="firing"}'
        eval_time: 13h50m
        exp_samples:
          - labels: 'ALERTS{alertname="RetentionSweepStalled", alertstate="firing", severity="ticket"}'
            value: 1

  - interval: 15s
    name: a process restarting every hour resets the age, and ProcessRestartLoop is the rule that sees it
    input_series:
      # Restarting more often than the sweep interval resets the gauge, so this rule is blind to a
      # deployment that never sweeps; asserted so the blindness is documented.
      - series: 'prl_retention_sweep_age_seconds'
        values: '0+15x239 0+15x239 0+15x239 0+15x239 0+15x239 0+15x239 0+15x239 0+15x239'
      # The sweep's T+60s schedule closes the hole: an hourly restart still sweeps hourly, and a
      # process dying before T+60s restarts three times in fifteen minutes, which pages.
      - series: 'prl_process_start_time_seconds'
        values: '1787678914+0x239 1787682514+0x239 1787686114+0x239 1787689714+0x239 1787693314+0x239 1787696914+0x239 1787700514+0x239 1787704114+0x239'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RetentionSweepStalled"}'
        eval_time: 7h50m
        exp_samples: []
      # An hourly restart is not a crash loop, and the sweep is running, so neither rule speaks.
      - expr: 'ALERTS{alertname="ProcessRestartLoop"}'
        eval_time: 7h50m
        exp_samples: []

  - interval: 15s
    name: a process crashing before its first sweep is a page, which is what covers the blind spot
    input_series:
      # The only restart pattern that can hide a dead sweep is one too fast to reach T+60s, and
      # that pages. The sweep age never nears its threshold, and does not have to.
      - series: 'prl_retention_sweep_age_seconds'
        values: '0+15x11 0+15x11 0+15x11 0+15x11 0+15x11 0+15x11 0+15x300'
      - series: 'prl_process_start_time_seconds'
        values: '1787678914+0x11 1787679094+0x11 1787679274+0x11 1787679454+0x11 1787679634+0x11 1787679814+0x11 1787679994+0x300'
    promql_expr_test:
      - expr: 'ALERTS{alertname="RetentionSweepStalled"}'
        eval_time: 40m
        exp_samples: []
      - expr: 'ALERTS{alertname="ProcessRestartLoop", alertstate="firing"}'
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="ProcessRestartLoop", alertstate="firing", severity="page"}'
            value: 1
