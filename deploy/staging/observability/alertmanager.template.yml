# Alertmanager for the staging stack, as a TEMPLATE. `scripts/alert-delivery.mjs` renders it into
# the gitignored `alertmanager.yml` next to it (`--render-config` renders and stops), because
# Alertmanager does not expand environment variables in its own configuration and a destination that
# can only be changed by editing a tracked file gets changed on a laptop, invisible to review.
#
# `${NAME}` is replaced by the value of `NAME`; an empty value is an error, because `url: ` starts
# happily and notifies nobody. `# @if NAME` … `# @endif` keeps the enclosed lines only when `NAME`
# is non-empty, which makes each destination optional; a receiver left with no destination is
# refused. The directives are YAML comments so the file still reads as the configuration it becomes.
#
# | Variable | Default (staging rehearsal) | What it is |
# | --- | --- | --- |
# | `PRL_ALERT_PAGE_WEBHOOK_URL` | the local sink's `/page` | PagerDuty Events API v2, Opsgenie, or a Slack relay |
# | `PRL_ALERT_TICKET_WEBHOOK_URL` | the local sink's `/ticket` | the ticket queue's intake webhook |
# | `PRL_ALERT_HEARTBEAT_WEBHOOK_URL` | the local sink's `/heartbeat` | the ping URL of a dead man's switch OUTSIDE this deployment |
# | `PRL_ALERT_HEARTBEAT_INTERVAL` | `20s` | how often the heartbeat is re-sent; must be well inside the snitch's grace period |
# | `PRL_ALERT_PAGE_EMAIL_TO` | `oncall@…invalid` | email-to-SMS, an email-to-PagerDuty address, or a shared inbox |
# | `PRL_ALERT_TICKET_EMAIL_TO` | `tickets@…invalid` | the ticket queue's intake address |
# | `PRL_ALERT_SMTP_SMARTHOST` | the local SMTP sink | `host:port` of the relay that accepts the mail |
# | `PRL_ALERT_EMAIL_FROM` | `alertmanager@…invalid` | envelope sender; providers reject mail from a domain they do not know |
# | `PRL_ALERT_SMTP_HELLO` | `localhost` | the name given in `EHLO` |
# | `PRL_ALERT_SMTP_REQUIRE_TLS` | `false` | **must be `true` anywhere the relay is not on the same host** |
# | `PRL_ALERT_SMTP_USERNAME` | unset | enables SMTP AUTH; the password comes from a file, never from here |
#
# Any of the four HUMAN destinations may be empty, as long as each of the two human tiers keeps at
# least one. The heartbeat URL may not be empty (`destinationProblems` refuses): every other
# destination announces its absence the first time something fires, and an unset heartbeat is
# indistinguishable from a healthy month.
#
# The SMTP password is `smtp_auth_password_file`, written from `PRL_ALERT_SMTP_PASSWORD` at 0600,
# because the rendered config (0644) is what gets pasted into a bug report.
#
# `continue: false` on each branch: a `page` alert must not also raise a ticket. The default
# receiver catches a severity that is none of the three values, which `alert-delivery.mjs` treats
# as a configuration error; every rule in `alert-rules.yml` is checked to carry one.
#
# `severity: heartbeat` is not a third tier. `Watchdog` fires permanently and its route ends at a
# receiver that is not a human; the information is in the notification's ABSENCE, watched from
# outside. On a human receiver it would notify every `repeat_interval` for ever. `alert-delivery.mjs`
# check 7 asserts no `Watchdog` notification reaches either human tier, and `alert-preflight.mjs`
# refuses a heartbeat URL equal to a human destination. The `page` and `ticket` branches are
# verified in both directions (a page raises no ticket, a ticket does not page); a change to them
# has to re-earn that.
#
# The heartbeat branch sets its own intervals: the root `repeat_interval` of an hour would need a
# grace period longer than the outage. Its `group_interval` is 5 s, NOT equal to
# `repeat_interval`: dedup re-sends at the first flush strictly LATER than one `repeat_interval`
# after the last send, so equal values skip every other flush. Measured at 20 s / 5 s: gaps of
# 25.0 s and 25.0 s, against 40 s with equal values. The interval must sit comfortably inside the
# watcher's grace period, so one missed ping is not enough to page.
#
# `group_wait: 5s` is tuned for the test (a verification run in a minute, not five); production
# wants the default 30 s so a burst of related alerts arrives as one notification.

global:
  resolve_timeout: 1m
# @if PRL_ALERT_SMTP_SMARTHOST
  # SMTP defaults for every `email_configs`, so a deployment changes its relay in one place.
  smtp_smarthost: '${PRL_ALERT_SMTP_SMARTHOST}'
  smtp_from: '${PRL_ALERT_EMAIL_FROM}'
  smtp_hello: '${PRL_ALERT_SMTP_HELLO}'
  # Alertmanager defaults this to true, which is wrong for a same-host sink with no certificate. A
  # variable, so turning it off is a deployment's recorded decision.
  smtp_require_tls: ${PRL_ALERT_SMTP_REQUIRE_TLS}
# @endif
# @if PRL_ALERT_SMTP_USERNAME
  smtp_auth_username: '${PRL_ALERT_SMTP_USERNAME}'
  smtp_auth_password_file: /etc/alertmanager/smtp-password
# @endif

route:
  receiver: tickets
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - matchers:
        - severity = "page"
      receiver: paging
      continue: false
      group_wait: 5s
    - matchers:
        - severity = "ticket"
      receiver: tickets
      continue: false
# @if PRL_ALERT_HEARTBEAT_WEBHOOK_URL
    - matchers:
        - severity = "heartbeat"
      receiver: heartbeat
      continue: false
      # No siblings can exist on this branch, so any wait only delays the first ping after a
      # restart, when a watcher is most likely to be counting.
      group_wait: 0s
      group_interval: 5s
      repeat_interval: ${PRL_ALERT_HEARTBEAT_INTERVAL}
# @endif

# One incident must not be four notifications. Measured: one blocked event loop also raises
# `DbPoolSaturated`, `HttpLatencyP99High` and `HttpLatencyP95Degraded`, three pages and a ticket
# for one cause, one of which opens the Postgres runbook. Inhibition, not grouping, says which
# alerts are consequences of another that is already firing.
#
# `group_by` stays `['alertname']`: Alertmanager's default subject renders the GROUP labels, so
# grouping by severity turns `[FIRING:1] EventLoopBlocked` into `[FIRING:2] page`, and
# `alerts:verify` asserts the alert name is in the subject.
#
# No `equal:`: a label present on one alert and absent on the other counts as unequal, and nearly
# every rule is a `sum()` with no `instance`, so `equal: ['instance']` would silently match nothing.
# Deployment-wide is correct because `replicas: 1` (ADR 0001) means one instance.
#
# Never inhibited: `Watchdog` (a silence must have no cause but a dead deployment),
# `RateLimitBans` (evidence about a caller, true regardless), and `ApiDown` and
# `RoomOwnershipFenced`, the tops of their causal chains.
inhibit_rules:
  # A stalled single-threaded process produces every downstream reading at once.
  - source_matchers:
      - alertname = "EventLoopBlocked"
    target_matchers:
      - alertname =~ "DbPoolSaturated|HttpLatencyP99High|HttpLatencyP95Degraded"

  # A process that is not answering scrapes cannot be measured by anything that scrapes it.
  - source_matchers:
      - alertname = "ApiDown"
    target_matchers:
      - alertname =~ "ApiNotReady|ProcessRestartLoop|HttpErrorRateHigh|HttpLatencyP99High|HttpLatencyP95Degraded|EventLoopBlocked|DbPoolSaturated"

  # A fencing (two processes authoritative for one room) is the worse half of a refusal, and both
  # open the same runbook.
  - source_matchers:
      - alertname = "RoomOwnershipFenced"
    target_matchers:
      - alertname = "RoomOwnershipRefused"

  # Two thresholds on one number: under three days both are true. The page carries the deadline.
  - source_matchers:
      - alertname = "TlsCertificateExpiryImminent"
    target_matchers:
      - alertname = "TlsCertificateExpiringSoon"

  # A probe that is not running produces no `probe_*` series; `PublicOriginProbeDown` says so and
  # is deliberately absent from every target list.
  #
  # This cannot stop the pages arriving (neither can be delivered while Alertmanager is down); it
  # stops the pair being read as two faults in the Prometheus UI.
  - source_matchers:
      - alertname = "AlertmanagerDown"
    target_matchers:
      - alertname = "AlertmanagerNotificationsFailing"

receivers:
  - name: paging
# @if PRL_ALERT_PAGE_WEBHOOK_URL
    webhook_configs:
      # host.docker.internal in the rehearsal (the overlay's `host-gateway` entry makes it work on
      # Linux); in a deployment, anything that accepts a JSON POST.
      - url: '${PRL_ALERT_PAGE_WEBHOOK_URL}'
        send_resolved: true
# @endif
# @if PRL_ALERT_PAGE_EMAIL_TO
    email_configs:
      # Email is a real paging transport (email-to-SMS, a provider's inbound address) and the only
      # one this repository can rehearse end to end without an account, since SMTP needs no API key.
      - to: '${PRL_ALERT_PAGE_EMAIL_TO}'
        send_resolved: true
# @endif
  - name: tickets
# @if PRL_ALERT_TICKET_WEBHOOK_URL
    webhook_configs:
      - url: '${PRL_ALERT_TICKET_WEBHOOK_URL}'
        send_resolved: true
# @endif
# @if PRL_ALERT_TICKET_EMAIL_TO
    email_configs:
      - to: '${PRL_ALERT_TICKET_EMAIL_TO}'
        send_resolved: true
# @endif
# @if PRL_ALERT_HEARTBEAT_WEBHOOK_URL
  - name: heartbeat
    webhook_configs:
      # The dead man's switch: in a deployment, the ping URL of a service that is NOT this
      # deployment (Dead Man's Snitch, healthchecks.io, a PagerDuty or OnCall heartbeat).
      #
      # No `email_configs` on purpose: a message every twenty seconds is an inbox somebody mutes.
      - url: '${PRL_ALERT_HEARTBEAT_WEBHOOK_URL}'
        # `false`, uniquely: this alert never resolves, and a resolution would look like a clean
        # shutdown to the watcher rather than the failure it is.
        send_resolved: false
# @endif
