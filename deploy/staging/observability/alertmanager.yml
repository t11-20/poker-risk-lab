# ---------------------------------------------------------------------------
# Alertmanager, for the staging stack only.
#
# `docs/production/alerts.md` opens with a two-tier rule: `page` wakes somebody up,
# `ticket` is looked at during working hours, and the difference is not how bad it
# is but whether a human has to be woken. That rule lived only in prose. This file
# is where it becomes routing, and `scripts/alert-delivery.mjs` proves it by
# firing a `page` alert and asserting it arrived at the paging receiver and not
# the other one.
#
# ## Both receivers are the same webhook here, on different paths
#
# Staging has no PagerDuty account and no ticket queue, and inventing credentials
# for either would make this file a rehearsal of somebody else's configuration.
# What it CAN rehearse is the part that goes wrong: which alert reaches which
# destination. So both receivers post to a sink that `alert-delivery.mjs` runs on
# the host, at `/page` and `/ticket`, and the path the notification arrives on is
# the assertion.
#
# A production deployment replaces the two `webhook_configs` URLs and changes
# nothing else. That is the whole diff, and it is why the route tree below is
# written as production would want it rather than as a test would need it.
#
# ## `continue: false` on the paging route is the important line
#
# Route matching in Alertmanager is first-match-wins per branch, and a `page`
# alert must not also raise a ticket: two notifications for one incident is how a
# ticket queue becomes something nobody reads. The default receiver is the
# catch-all for an alert whose severity label is neither value, which
# `alert-delivery.mjs` treats as a configuration error rather than a routing
# outcome — every rule in `alert-rules.yml` is checked to carry one of the two.
#
# ## group_wait is short here and would not be in production
#
# 5 s, so a verification run finishes in a minute rather than in five. Production
# wants the default 30 s so that a burst of related alerts arrives as one
# notification. The value is called out here because it is the one setting in this
# file that is tuned for the test rather than for the deployment.
# ---------------------------------------------------------------------------

global:
  resolve_timeout: 1m

route:
  receiver: tickets
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - matchers:
        - severity = "page"
      receiver: paging
      continue: false
      group_wait: 5s
    - matchers:
        - severity = "ticket"
      receiver: tickets
      continue: false

receivers:
  - name: paging
    webhook_configs:
      # host.docker.internal is Docker Desktop; the compose overlay adds a
      # host-gateway entry so the same name works on Linux.
      - url: http://host.docker.internal:9099/page
        send_resolved: true
  - name: tickets
    webhook_configs:
      - url: http://host.docker.internal:9099/ticket
        send_resolved: true
