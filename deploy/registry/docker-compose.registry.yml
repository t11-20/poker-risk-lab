# The promotion registry: a loopback OCI registry, opt-in, for the one property a local BuildKit
# digest cannot give you: that a DIFFERENT machine can fetch these exact bytes.
#
# NOT part of `pnpm run staging up`; with nothing running here the default release path works
# unchanged. Opt in:
#
#     docker compose -f deploy/registry/docker-compose.registry.yml up -d
#     pnpm run release:artifacts -- --push
#     pnpm run staging up          # deploys the registry reference, pull_policy always
#
# and out:
#
#     docker compose -f deploy/registry/docker-compose.registry.yml down
#     (add --volumes to destroy the pushed artefacts as well)
#
# See deploy/registry/README.md for what a push proves and what it does not.
#
# ## Loopback only, and 5001 rather than 5000
#
# This registry has no authentication, TLS or authorization: anything that reaches it can push under
# any name. Docker treats `127.0.0.1` and `localhost` as insecure-by-default registries, which is what
# makes plain HTTP work without editing daemon.json, and why this must never leave loopback.
#
# Not 5000, measured:
#
#     $ lsof -nP -iTCP:5000 -sTCP:LISTEN
#     ControlCe  1514 terence   11u  IPv4  TCP *:5000 (LISTEN)
#
# macOS's AirPlay Receiver (ControlCenter) holds 5000, and a registry there answers with somebody
# else's 403, an unintelligible push failure. `scripts/release-artifacts.mjs` defaults `--registry`
# to 127.0.0.1:5001; change one and you must change the other.

# Its own compose project, so a `docker compose down` against staging can never sweep it up.
name: prl-registry

services:
  registry:
    # registry:2 (distribution 2.8.3), pinned to the multi-architecture INDEX digest so it resolves
    # on arm64 and amd64 alike; `scripts/supply-chain/ci-pinning.mjs` fails a bare `registry:2`.
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    restart: unless-stopped
    init: true
    ports:
      # host:5001 -> container:5000, loopback explicitly: `- '5001:5000'` publishes on every interface.
      - '127.0.0.1:5001:5000'
    environment:
      # Makes DELETE work; without it a mistaken push can only be removed by destroying the volume.
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      # Info logs a line per blob; the push output is already the evidence.
      REGISTRY_LOG_LEVEL: warn
    volumes:
      # Survives a restart; `down --volumes` is the intended way to forget everything pushed here.
      - registry-data:/var/lib/registry
    healthcheck:
      # A 200 from /v2/ means it can serve. wget is in the (Alpine) image; curl is not.
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:5000/v2/']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NOT `user: 65532:65532`, the one knowing exception to the non-root rule. Measured:
    #
    #     $ docker run -u 65532:65532 -v prl-regtest:/var/lib/registry registry:2
    #     $ docker push 127.0.0.1:5099/probe:t1
    #     8bbaad1488a8: Unavailable
    #     error from registry: unknown error
    #
    # A fresh named volume is initialised from the image's root-owned /var/lib/registry, so a non-root
    # registry answers /v2/ and cannot write a blob. The fix would be a root chown helper container;
    # instead: root inside, `cap_drop: ALL`, `no-new-privileges`, a read-only root and loopback only.
    # This is an operator's build tool, not the rehearsed deployment, whose services stay non-root.

volumes:
  registry-data:
