# The staging stack: production, on one machine, from the artefacts production will get.
#
# This file has **no `build:` anywhere**: a stack that builds its own images says nothing about the
# image production will run. Both application services name an image by **content digest** from the
# release manifest `pnpm run release:artifacts` wrote. `pnpm run staging up` writes those digests into
# deploy/staging/.env.staging and then verifies the started containers run exactly them, and
# `pnpm run staging promote` refuses a digest staging did not test.
#
# ## How to run it
#
#     pnpm run staging init      # generate the local CA, the leaf and the secrets
#     pnpm run release:artifacts # build both images ONCE and record their digests
#     pnpm run staging up        # bring the stack up on those digests and smoke it
#     pnpm run staging status
#     pnpm run staging down      # add --volumes to destroy the database too
#
# Optionally, to make the artefacts fetchable from another machine:
#
#     docker compose -f deploy/registry/docker-compose.registry.yml up -d
#     pnpm run release:artifacts -- --push
#     pnpm run staging up        # now deploys the REGISTRY digests, pull_policy always
#
# See deploy/staging/README.md for the whole procedure, including what promotion checks and what it
# deliberately does not.
#
# Raw compose commands work too, but ONLY with the environment file, because every
# variable below is required and has no default:
#
#     docker compose --env-file deploy/staging/.env.staging \
#       -f docker-compose.staging.yml ps
#
# ## Why every variable is `${...:?}` and none has a default
#
# Compose interpolation is **file-wide**, so every command against this file needs the secrets, even
# `ps`. That is accepted: no subset of a deployment manifest is meaningful without them, and
# `scripts/staging.mjs` passes the same `--env-file` to every invocation, `down` and `logs` included.
# A defaulted secret is a secret in a public repository that works. The one exception,
# `PRL_PULL_POLICY`, is argued on the api service's `pull_policy` line.
#
# ## RATE_LIMIT_RESET_TOKEN is absent, and that is deliberate
#
# `apps/api/src/config.ts` **refuses to boot** with `RATE_LIMIT_RESET_TOKEN` set in production (the
# token empties the rate limiter), which catches a `.env` copied from staging to production. So the
# smoke test waits out the limiter window here instead of resetting it.
#
# ## `deploy.replicas: 1` is a correctness constraint, and it is ENFORCED
#
# `apps/api/src/rooms/registry.ts` keeps authoritative hand state in process memory (ADR 0001,
# RUNBOOK §11.1): two API processes serving one room deal two different hands, and whichever
# settlement lands second destroys the chips the other paid out. Each process takes a lease on every
# room it opens (`prl.room_ownership`, migration 0005, `apps/api/src/rooms/ownership.ts`); a second
# is refused with `room_owned_elsewhere` and pages `RoomOwnershipRefused`, and a process that loses
# a lease stops serving that room. The lease makes a second replica safe, not useful, so it stays 1.

name: poker-risk-lab-staging

services:
  # postgres: the only durable state in the stack.
  postgres:
    # postgres:16-bookworm, the same digest docker-compose.yml and ci.yml use: the same bytes, so no
    # planner or collation difference production would not have.
    image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
    restart: unless-stopped
    init: true
    # uid/gid 999 is `postgres` in the official image. Without it the entrypoint starts as root and
    # drops to gosu, leaving a root-owned PID 1. A fresh named volume inherits the image's
    # postgres:postgres data directory; a volume created by a root-run stack is owned by root and this
    # container will not start against it (`down --volumes`; staging data is disposable).
    user: '999:999'
    environment:
      POSTGRES_USER: ${PRL_STAGING_DB_SUPERUSER:?set it in deploy/staging/.env.staging (pnpm run staging init writes one)}
      POSTGRES_PASSWORD: ${PRL_STAGING_DB_SUPERUSER_PASSWORD:?set it in deploy/staging/.env.staging (pnpm run staging init generates one)}
      POSTGRES_DB: ${PRL_STAGING_DB_NAME:?set it in deploy/staging/.env.staging}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      # Loopback, and NOT 5432, so it runs beside the developer stack. Published because migrations
      # run from OUTSIDE the serving container (RUNBOOK §11.3; Dockerfile.api omits apps/api/scripts).
      - '127.0.0.1:${PRL_STAGING_DB_PORT:?set it in deploy/staging/.env.staging}:5432'
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /var/run/postgresql:mode=1777
      - /tmp:mode=1777
    # 10 MiB × 3 = 30 MiB. Every cap in this file is reasoned in docker-compose.yml's header ("Why
    # every service has a `logging:` block") and must match it: `scripts/supply-chain/log-policy.mjs`
    # fails if a service present in both files carries different caps.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready --quiet --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # api: the Fastify server, by digest.
  api:
    # From deploy/staging/release-manifest.json via .env.staging. `scripts/staging.mjs` refuses
    # anything but `name@sha256:<64 hex>` and, after `up`, fails if the running image differs.
    image: ${PRL_API_IMAGE:?the API image DIGEST. Run `pnpm run release:artifacts`, then `pnpm run staging up`}
    # Decided per run by `scripts/staging.mjs` (`deploymentPlan`). With a local image a pull would go
    # to Docker Hub, where `prl-api` belongs to somebody else, so `never`. `always` only after
    # `staging up` has re-fetched and re-hashed the registry's manifest: a digest pull yields exactly
    # those bytes or fails.
    #
    # The one defaulted interpolation in this file: not a secret, `never` is the safe value, and
    # requiring it would break `staging status` for an .env.staging written before it existed.
    pull_policy: ${PRL_PULL_POLICY:-never}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    # A correctness constraint: see the header, ADR 0001 and RUNBOOK §11.1.
    deploy:
      replicas: 1
    environment:
      # Production, genuinely: https origins, Secure cookies, no rate-limit reset
      # token, and every refusal in config.ts armed.
      NODE_ENV: production
      PORT: '3001'
      LOG_LEVEL: ${PRL_STAGING_LOG_LEVEL:?set it in deploy/staging/.env.staging}
      # HOST is 0.0.0.0 from the image's own ENV (Dockerfile.api); config.ts defaults it to 127.0.0.1,
      # "healthy and unreachable" in a container.
      #
      # `prl_api` is a login MEMBER of `prl_app` with no privilege of its own. `scripts/staging.mjs`
      # creates it in SQL with a generated password (RUNBOOK §5), because the dev seed refuses
      # NODE_ENV=production.
      DATABASE_URL: postgres://${PRL_STAGING_API_DB_USER:?set it in deploy/staging/.env.staging}:${PRL_STAGING_API_DB_PASSWORD:?set it in deploy/staging/.env.staging (pnpm run staging init generates one)}@postgres:5432/${PRL_STAGING_DB_NAME:?set it in deploy/staging/.env.staging}
      # ENFORCED here, so the default-off seat guard is exercised continuously: `scripts/staging.mjs`
      # passes `--expect-enrolment enforced` to the smoke test, which proves an enrolled learner seated
      # and an unenrolled one refused, over REST and a real `sit` frame, and FAILS if it finds `off`.
      # A literal, not in .env.staging: not a secret, and requiring it would break `staging status` for
      # an older .env.staging (as at `pull_policy` above).
      #
      # prl_app holds only SELECT on prl.enrolments (migration 0006), so the smoke run grants and
      # revokes through `apps/api/scripts/enrolments.mjs` with DATABASE_MIGRATION_URL. Nothing
      # reachable over HTTP writes an enrolment.
      PRL_ENROLMENT_REQUIRED: enforced
      # The origin the BROWSER uses: the proxy's published https origin. Matched EXACTLY on CSRF checks
      # and every WebSocket upgrade, so a wrong value shows as "every socket closes 4406".
      PUBLIC_WEB_ORIGIN: ${PRL_STAGING_PUBLIC_ORIGIN:?set it in deploy/staging/.env.staging}
      SESSION_COOKIE_SECRET: ${PRL_STAGING_SESSION_COOKIE_SECRET:?set it in deploy/staging/.env.staging (pnpm run staging init generates one)}
      # True here, false in the dev stack. False behind a proxy, `request.ip` is the proxy for every
      # caller, so the whole deployment shares ten guest sign-ups a minute and one script exhausts it.
      # Safe only because the API publishes no port AND deploy/staging/nginx.conf SETS X-Forwarded-For
      # from $$remote_addr rather than appending; `pnpm run staging up` sends a forged header to prove it.
      TRUST_PROXY: 'true'
      # COOKIE_SECURE is not set: it defaults to true in production and config.ts refuses `false` there.
      #
      # The shutdown pair, as in docker-compose.yml: the process's own drain deadline (`4503`
      # serverShuttingDown frames) must stay comfortably below `stop_grace_period`, or its diagnosable
      # exit races a SIGKILL 137. Change one and you must change the other.
      SHUTDOWN_GRACE_MS: '10000'
      # Metrics are on in staging so it can rehearse an incident. /metrics is not under /api/, so the
      # public origin sends it to the page server, which 404s. Scrape it from inside the network:
      #   docker compose ... exec api node -e "fetch('http://127.0.0.1:3001/metrics',{headers:{authorization:'Bearer '+process.env.METRICS_TOKEN}}).then(r=>r.text()).then(console.log)"
      METRICS_TOKEN: ${PRL_STAGING_METRICS_TOKEN:?set it in deploy/staging/.env.staging (pnpm run staging init generates one)}
    stop_grace_period: 30s
    # No `ports`: reachable only through the proxy, which is what makes TRUST_PROXY=true defensible.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=64m
    # 20 MiB × 5 = 100 MiB, as in docker-compose.yml.
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Both probes: /api/v1/health is liveness, /api/v1/ready returns 503 while the database is
      # unreachable, so the proxy's `service_healthy` means "the API can actually serve".
      #
      # `node -e` because node is the one binary a Node image is guaranteed to have, so a base change
      # cannot break the probe. It targets the container's own address, not 127.0.0.1, so a server
      # bound to loopback fails it. No template literal: compose interpolates `${...}` in a value, and
      # it would reach the container as `http://:/api/v1/health`.
      test:
        - CMD
        - node
        - -e
        - >-
          const b='http://'+require('node:os').hostname()+':'+(process.env.PORT||3001);
          Promise.all([fetch(b+'/api/v1/health'),fetch(b+'/api/v1/ready')])
          .then((r)=>process.exit(r.every((x)=>x.ok)?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  # web: the Next page server, by digest.
  web:
    image: ${PRL_WEB_IMAGE:?the web image DIGEST. Run `pnpm run release:artifacts`, then `pnpm run staging up`}
    # The same variable as api (see there): one pull policy cannot describe a mixed stack.
    pull_policy: ${PRL_PULL_POLICY:-never}
    restart: unless-stopped
    init: true
    depends_on:
      api:
        # Healthy, not started: otherwise a smoke run in the start-up window reports a render error.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      # Server-side only, read at runtime. Never `NEXT_PUBLIC_`, which `next build` inlines into the
      # bundle; the browser sends relative /api/* to its own origin.
      #
      # `PRL_API_REWRITE_ORIGIN` is absent: next.config.ts refuses it in production, where it would be
      # a silent no-op.
      PRL_API_ORIGIN: http://api:3001
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=64m
      # `next start` writes ISR output and optimised images to .next/cache, which the image does not
      # ship; it is cache, so losing it on restart is correct. uid/gid 1000 is `node`.
      - /app/apps/web/.next/cache:mode=0700,uid=1000,gid=1000,size=256m
    # 10 MiB × 3 = 30 MiB, as in docker-compose.yml.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # proxy: TLS termination and the single published origin. Routing, TLS, WebSocket handling and
  # why nginx rather than Caddy are in deploy/staging/nginx.conf.
  proxy:
    # nginxinc/nginx-unprivileged 1.29.8-alpine, the dev stack's digest. Uid 101, a high port and no
    # file capabilities, so it starts under `cap_drop: ALL`; the official nginx and caddy binaries
    # carry cap_net_bind_service, and Linux refuses to exec a file whose permitted capabilities are
    # outside the bounding set.
    image: nginxinc/nginx-unprivileged:1.29.8-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      # Read-only deployment inputs, never a source tree: a bind-mounted src/ would make the images
      # decorative.
      - ./deploy/staging/nginx.conf:/etc/nginx/nginx.conf:ro
      # The local CA's leaf, chain and key from `pnpm run staging init`, gitignored and dockerignored:
      # never committed, never in an image.
      - ./deploy/staging/tls:/etc/nginx/tls:ro
    # The image's entrypoint templates into /etc/nginx, which a read-only root refuses. Exec form, so
    # nginx receives SIGTERM directly rather than through a shell that ignores it.
    entrypoint: ['nginx', '-c', '/etc/nginx/nginx.conf', '-g', 'daemon off;']
    ports:
      # THE published origin, and the only one. Loopback: a rehearsal, not a service on a network.
      - '127.0.0.1:${PRL_STAGING_HTTPS_PORT:?set it in deploy/staging/.env.staging}:8443'
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    # 10 MiB × 5 = 50 MiB, as in docker-compose.yml.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Through itself, over TLS, to the API's liveness route ("a browser would reach the API").
      # `--no-check-certificate` because busybox wget cannot be handed the local CA; the smoke test
      # verifies the certificate with NODE_EXTRA_CA_CERTS.
      test:
        - CMD-SHELL
        - >-
          wget --quiet --tries=1 --timeout=4 --no-check-certificate -O /dev/null
          "https://$$(hostname):8443/api/v1/health" || exit 1
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  # Named, so `down` keeps the data and `down --volumes` is the explicit act that destroys it.
  staging-postgres-data:
