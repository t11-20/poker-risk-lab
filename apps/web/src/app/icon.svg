  <ellipse cx="11.6" cy="16" rx="3.6" ry="6.2" fill="none" stroke="#f5f2ec" stroke-width="2.2"/>
  <ellipse cx="20.4" cy="16" rx="3.6" ry="6.2" fill="none" stroke="#f5f2ec" stroke-width="2.2"/>
</svg>
