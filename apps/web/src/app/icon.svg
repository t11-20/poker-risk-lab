<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The zeros are drawn, not set in a font, so a fallback face cannot change the mark.
    Colours are presentation attributes: the nonce CSP refuses an inline style block.
  -->
