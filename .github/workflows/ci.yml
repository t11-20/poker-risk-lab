# ---------------------------------------------------------------------------
# Continuous integration for Poker Risk Lab.
#
# ## Why this file looks paranoid
#
# The repo's whole dependency policy is "mutable references are how supply-chain
# attacks land" (see pnpm-workspace.yaml and docs/security/). A workflow that
# writes `uses: actions/checkout@v7` throws that away: the tag is a moving
# pointer that the action's owner — or anyone who compromises them — can
# repoint at new code, which then runs inside this repo's CI with whatever
# permissions the job has. So every `uses:` here is a full 40-character commit
# SHA, with a comment naming the version it resolves to. Refreshing one is a
# reviewed diff, not a silent upgrade.
#
# How the SHAs below were obtained (repeat this to refresh them):
#
#     git ls-remote --tags https://github.com/actions/checkout | grep 'refs/tags/v7'
#     # cross-check the tag is the current stable release and the SHA is a commit:
#     curl -s https://api.github.com/repos/actions/checkout/releases?per_page=5
#     curl -s https://api.github.com/repos/actions/checkout/commits/<sha> | head
#
# For an annotated tag, `git ls-remote` prints two lines — take the one ending
# `^{}`, which is the commit the tag dereferences to. That is what `uses:`
# needs; the other line is the tag object and will not resolve.
#
# ## Secrets
#
# No job in this workflow needs a secret, and none is referenced. There is
# nothing to publish, no registry to push to, no deployment, and no bot
# account. `permissions: contents: read` at the top level is therefore the
# complete set of privileges CI requires; nothing below widens it. If a future
# job genuinely needs a token, give it to that job alone and say why.
#
# ## Why `supply-chain` gates everything
#
# Running lint, tests and builds against a dependency graph that has not been
# audited means executing unaudited third-party code before deciding whether it
# is safe. The audit runs first and every other job `needs:` it, so a
# compromised or newly-vulnerable dependency stops the run at step one.
#
# ## Why every install passes `--ignore-scripts`
#
# pnpm-workspace.yaml already sets `ignoreScripts: true`, so the flag changes
# nothing about what these jobs do today. It changes what they DEPEND ON. Both
# Dockerfiles pass the flag explicitly and say why in a comment — "the build does
# not depend on that file continuing to say so" — and every install in this
# workflow depended on exactly that. One edit to pnpm-workspace.yaml, in a diff
# about something else entirely, would have re-enabled arbitrary install-time code
# execution in every installing job in this workflow while the release images
# stayed safe. Install-time lifecycle hooks are the campaign's Pattern A delivery
# mechanism (docs/security/shai-hulud-snapshot-2026-08-17.md), and the gate that
# watches for them (`dep-shapes.mjs`) runs AFTER the install that would already
# have executed them. Recorded as residual SUP-020; the flag is the fix.
#
# ## Why there is no dependency cache
#
# Deliberate. A restored `actions/cache` entry is a mutable artifact that is
# trusted by path, and cache scoping across refs is a well-known route into a
# build. This project's dependency tree installs in roughly fifteen seconds, so
# the cache would buy very little and cost one more action and one more trust
# boundary. If install time ever becomes the bottleneck, pin the cache action by
# SHA and say here what changed.
#
# The paragraphs above used to be the *only* thing holding the pinning rule.
# `scripts/supply-chain/ci-pinning.mjs` now reads this file and fails the release
# audit on an unpinned `uses:`, a floating `runs-on: *-latest`, an undigested
# service container, an unpinned Dockerfile `FROM`, or a workflow file that is
# not declared in `EXPECTED_WORKFLOWS`. A comment is guidance; a gate is a rule.
#
# ## Which identity the database jobs connect as
#
# `db/migrations/0001_initial.sql` defines a two-role model: `prl_migrator` owns
# the schema, `prl_app` is the runtime role and holds the narrowest per-table
# verb set the API actually needs (no CREATE, no DROP, no TRUNCATE, no DELETE on
# the append-only tables). Both are `NOLOGIN` privilege containers; a real login
# identity is granted membership out of band.
#
# Every CI job used to connect as the `postgres` superuser, so the model was
# enforced by nothing that runs automatically and a missing GRANT in a future
# migration would have surfaced first in production. The `end-to-end` and `a11y`
# jobs — the two whose database access is purely the application's own runtime
# path — now create a login role `prl_ci_app`, grant it `prl_app`, and run the
# server as that. Migration and seeding keep the privileged identity, because
# creating roles and owning a schema is exactly what the runtime role must not be
# able to do.
#
# The `test` job now runs as `prl_ci_app` too. It could not before: the fixture
# helper cleaned up with `delete from prl.rooms`, on which `prl_app` holds only
# SELECT/INSERT/UPDATE. That was the privilege model working as designed, so the
# fix went into the helper — it issues that one delete as the schema-owning
# identity via `DATABASE_URL_ADMIN` — rather than into the grants. Two coverage
# files legitimately need more as well (they create throwaway databases and run
# ALTER/GRANT/REVOKE to prove the schema gate can fail), and they ask for the
# admin DSN explicitly. Everything else in the suite runs with the verb set the
# API actually has.
# ---------------------------------------------------------------------------

name: CI

# Both events, unfiltered, exactly as the contract says. A push to a branch with
# an open pull request therefore produces two runs; the concurrency group below
# means only the newest of each survives, and the duplication is cheap next to
# the risk of a filter that silently skips a branch.
on:
  push:
  pull_request:

# Least privilege. Read-only on the repository contents and nothing else — no
# packages, no id-token, no issues, no pull-requests write.
permissions:
  contents: read

# One in-flight run per workflow per ref. Pushing again cancels the run it
# superseded instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack must never stop to ask a human whether to download the pnpm version
  # named in `packageManager`. It still verifies that version's integrity hash.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # Keeps "update available" banners out of the logs; has no effect on resolution.
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  # -------------------------------------------------------------------------
  # 1. The gate. Everything else needs this.
  # -------------------------------------------------------------------------
  supply-chain:
    name: Supply-chain audit (gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default is to leave a credential in .git/config for later steps.
          # Nothing here pushes, so leaving one behind is pure downside.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .node-version is the single source of truth shared with local dev and
          # the Dockerfiles. `engineStrict: true` makes a mismatch a hard failure,
          # which is what we want — silently testing on a different Node than we
          # ship is worse than a red build.
          node-version-file: .node-version

      - name: Enable corepack (pins pnpm via the packageManager integrity hash)
        run: corepack enable

      - name: Report the resolved toolchain
        run: |
          node --version
          pnpm --version

      - name: Install
        # --frozen-lockfile, never --no-frozen-lockfile: CI must fail when the
        # lockfile and the manifests disagree, not quietly resolve a new graph.
        # --ignore-scripts: see the header. Every install in this file carries it,
        # and it must stay on all of them — one job without it is one job that runs
        # a compromised dependency's postinstall.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit
        run: pnpm run security:audit

      - name: Repo hygiene
        # `security:audit` already runs this gate as one of its eight, so this step is normally a
        # second pass over the same files — about a second. It is named separately anyway because
        # the gate now carries the repo-wide `Math.random` ban (previously enforced over 2 of 8
        # source trees), and a rule that release-blocks deserves to be visible by name in the run
        # rather than buried inside an aggregate.
        run: pnpm run security:hygiene

      - name: Upload SBOM and supply-chain reports
        # `always()` so a failing audit still publishes the evidence of what
        # failed. `if-no-files-found: warn` rather than `error` because a gate
        # that crashes before writing its report should surface as the audit
        # failure it is, not as a confusing artifact-upload failure on top.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-reports
          path: |
            docs/sbom/poker-risk-lab.cdx.json
            docs/sbom/osv-report.json
            docs/sbom/provenance-report.json
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  # 2. Lint. No build needed: Biome reads source, not types.
  #
  # `design:contrast` used to run here, under a comment claiming it "needs no
  # build and no browser". That stopped being true at b9687b1, which gave the
  # gate a THIRD pass — every element carrying text, composited in real Chrome,
  # on every route in both themes — and did not update this job. So the step
  # could not pass: `next start` in a job that never built the web app prints
  # "Could not find a production build in the '.next' directory", and the gate
  # correctly refuses rather than skipping. Reproduced exactly, by moving
  # `apps/web/.next` aside and running the gate with a runner-shaped
  # environment: "FAIL painted layer (real Chrome, every ancestor composited)
  # 2 finding(s) — the painted layer could not be measured: web exited (1)
  # before it was ready", exit 1.
  #
  # It now runs in `browser-gates` below, which builds the app and resolves a
  # browser, alongside the other two gates that need exactly those two things.
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

  # -------------------------------------------------------------------------
  # 3. Typecheck.
  # -------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        # Not optional. Each `packages/*` publishes its public surface as
        # `dist/*.d.ts` through its `exports.types`, so `apps/*` cannot be
        # typechecked until those declaration files exist. Without this step the
        # job fails with "cannot find module @prl/poker-engine" and looks like a
        # broken import rather than a missing build.
        run: pnpm run build:packages

      - name: Typecheck
        run: pnpm run typecheck

  # -------------------------------------------------------------------------
  # 4. Unit + integration tests. The integration suite needs a real database.
  # -------------------------------------------------------------------------
  test:
    name: Tests
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        # Pinned by digest for the same reason the actions are. Refresh with the
        # command in the Dockerfile header.
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          # Throwaway credentials for an ephemeral container on a private network
          # that is destroyed with the job. Not a secret, and deliberately not
          # stored as one: a fake secret teaches people to look for secrets that
          # are not there.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The job default is the LEAST-PRIVILEGED identity, so a missing GRANT fails
      # this build rather than a deployment. The steps that legitimately need more
      # — waiting, migrating, creating the role, and the two coverage files that
      # verify the schema gate and the migration runner — override it at step level
      # with DATABASE_URL_ADMIN.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_test
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_test

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build:packages

      - name: Wait for PostgreSQL
        # The service container's own healthcheck already gates the job, but this
        # also proves a connection string actually works, which is a far more
        # useful failure than a timeout inside a test. Run as the admin identity,
        # because the job's own role does not exist yet.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate
        # Owning a schema is exactly what the runtime role must not be able to do.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:migrate

      - name: Grant a login identity membership of prl_app
        # `prl_app` is NOLOGIN by design: a privilege container whose real login
        # identity is granted membership out of band. This is that step, done the
        # way a deployment would do it. The password is a throwaway for an
        # ephemeral container destroyed with the job.
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_test \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_test TO prl_ci_app;
          SQL
          # Prove the identity is bounded rather than assuming it: a role that could
          # still create tables would make this whole job theatre.
          PGPASSWORD=prl-ci-not-a-secret psql --host 127.0.0.1 --username prl_ci_app \
            --dbname poker_risk_lab_test --tuples-only --no-align \
            --command "select rolsuper or rolcreatedb or rolcreaterole from pg_roles where rolname = current_user" \
            | grep -qx f || { echo "prl_ci_app is not bounded"; exit 1; }

      - name: Verify the live schema's security properties
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        # `db:verify` checks things no unit test can see: that `prl_app` has no privileges it should
        # not, that the deck and salt columns do not exist, that every documented constraint is
        # actually on the table. It passed and was run by no job.
        run: pnpm run db:verify

      - name: Test
        # `DATABASE_URL` is set for this job, so the 57 database-backed tests RUN. They can no
        # longer skip in silence either way: with no reachable database,
        # `apps/api/test/database-availability.test.ts` fails the run, and the waiver that lets a
        # developer past that is refused whenever `CI` is set.
        run: pnpm run test

  # -------------------------------------------------------------------------
  # 5. The 133,784,560-hand enumeration.
  # -------------------------------------------------------------------------
  exhaustive:
    name: Exhaustive enumeration
    needs: supply-chain
    runs-on: ubuntu-24.04
    # The suite sets its own `--test-timeout=1800000` (30 minutes per test). The
    # job bound has to sit comfortably above that plus checkout and install, or
    # the job kill would race the test's own timeout and report the wrong thing.
    # It normally finishes in well under a minute on a warm runner.
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Enumerate every seven-card hand
        # No build step: the exhaustive suite imports `../../src/*.ts` directly
        # and Node 24 strips the types, so it tests the source rather than an
        # artefact of it.
        run: pnpm run test:exhaustive

  # -------------------------------------------------------------------------
  # 5b. End-to-end against a running server: smoke test and load harness.
  #
  # Both of these existed and neither was run by anything. `test:smoke` asserts the
  # no-currency-framing and no-endorsement guardrails on live payloads, plus the
  # hidden-information property over a real WebSocket; `test:load` is the only
  # place a real socket is driven under concurrency outside the test suite, and it
  # had never completed a single hand because three of its route constants named
  # endpoints that do not exist.
  #
  # They run in one job because they need the same thing: a migrated database and a
  # started API. `--strict` on the smoke test promotes its warnings to failures —
  # two of them are security properties (rate limiting present, an unknown hand
  # answering 404 rather than 500) and neither could fail a run before.
  #
  # ## Why the WEB app is started here and not only the API
  #
  # It was not, and sections 10 and 11 of the smoke test — the CSP and security
  # headers on a rendered page, and the PROD-048 guest bootstrap — both begin by
  # fetching `PRL_WEB_ORIGIN` and, when nothing answers, `warn` and return. Under
  # `--strict` that warning is a failure, so this job could never go green;
  # without `--strict` it would be sixteen checks that silently did not run.
  # Reproduced locally on the same shape (API up, nothing serving the web origin):
  # `node scripts/smoke-test.mjs --origin … --strict` printed "web origin … is not
  # reachable (fetch failed)  (a warning, promoted to a failure by --strict)"
  # TWICE and exited 1 with 49 checks passed. With the web app started, the same
  # command exits 0 with 65 — the difference is exactly those two sections.
  #
  # `pnpm run build` rather than `build:packages`, because `next start` serves a
  # production build and there is otherwise nothing to serve.
  # -------------------------------------------------------------------------
  end-to-end:
    name: Smoke + load (running server)
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The job default is the LEAST-PRIVILEGED identity: a login role that is a
      # member of `prl_app` and nothing else. The API is started with this, so a
      # missing GRANT fails this build instead of a deployment. The steps that
      # legitimately need more (waiting, migrating, seeding, creating the role
      # itself) override it with DATABASE_URL_ADMIN at step level.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_e2e
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_e2e
      NODE_ENV: development
      PORT: '3001'
      HOST: 127.0.0.1
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      # Where the smoke test looks for the rendered page. It is also the smoke
      # test's own default, and it is written here anyway: the value has to agree
      # with PUBLIC_WEB_ORIGIN above (the API's CORS and WebSocket Origin
      # allowlist) and with the port the web app is started on below, and three
      # things that must agree should be visible in one place.
      PRL_WEB_ORIGIN: http://localhost:3000
      SESSION_COOKIE_SECRET: ci-only-not-a-secret-32-chars-xx
      # A multi-table load run opens one guest session per seat, so the shipped limits
      # refuse it — correctly. Raised here for the harness rather than lowered in the
      # server, and the harness now prints the figure it needs when it sees a 429.
      RATE_LIMIT_MAX: '5000'
      LOG_LEVEL: warn

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        # The whole workspace, not just `build:packages`: the web app is started
        # below and `next start` serves a production build.
        #
        # NODE_ENV is overridden for this step because the job-level value is the
        # API's `development` — `next build` under a non-standard NODE_ENV is not
        # the artefact `next start` expects to serve, and the smoke test's CSP
        # section reads the headers of exactly that artefact.
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate and seed
        # Schema ownership and role creation are precisely what the runtime role
        # must not be able to do, so these run as the privileged identity.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: |
          pnpm run db:migrate
          pnpm run db:seed

      - name: Grant a login identity membership of prl_app
        # `prl_app` is NOLOGIN by design (db/migrations/0001_initial.sql): it is a
        # privilege container, and the real login identity is granted membership
        # out of band. This is that out-of-band step, done the way a deployment
        # would do it. The password is a throwaway for an ephemeral container on a
        # private network destroyed with the job — deliberately not a repository
        # secret, for the same reason the postgres password above is not.
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_e2e \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_e2e TO prl_ci_app;
          SQL
          # Prove the identity is bounded rather than assuming it: a role that can
          # still create tables would make this whole job theatre.
          PGPASSWORD=prl-ci-not-a-secret psql --host 127.0.0.1 --username prl_ci_app \
            --dbname poker_risk_lab_e2e --tuples-only --no-align \
            --command "select rolsuper or rolcreatedb or rolcreaterole from pg_roles where rolname = current_user" \
            | grep -qx f
          if PGPASSWORD=prl-ci-not-a-secret psql --host 127.0.0.1 --username prl_ci_app \
               --dbname poker_risk_lab_e2e --set ON_ERROR_STOP=1 --quiet \
               --command "create table prl.ci_should_not_be_allowed (x int)" 2>/dev/null; then
            echo "prl_ci_app can create tables in the prl schema — the least-privilege model is not in effect"
            exit 1
          fi
          echo "prl_ci_app is a member of prl_app and cannot create objects"

      - name: Start the API
        # Backgrounded, then polled: a fixed sleep either wastes time or races the boot.
        # The log is kept so a failure below can be attributed.
        run: |
          node apps/api/src/server.ts > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health > /dev/null; then
              echo "api is up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "the API never became healthy"
          cat /tmp/api.log
          exit 1

      - name: Start the web app
        # The subject of smoke-test sections 10 and 11. Same shape as the API
        # above: backgrounded, then polled, with the log kept so a failure below
        # can be attributed.
        #
        # PORT and NODE_ENV are overridden for this step alone. The job-level
        # values are the API's (3001, development, because `loadConfig` refuses a
        # production process without a real SESSION_COOKIE_SECRET), and inheriting
        # them here would put Next on the API's port in a mode `next start` does
        # not serve. PRL_API_ORIGIN is a literal address: the API binds
        # 127.0.0.1, and `localhost` on a runner may resolve to ::1 first.
        env:
          PORT: '3000'
          NODE_ENV: production
          PRL_API_ORIGIN: http://127.0.0.1:3001
        run: |
          pnpm --filter @prl/web start > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3000/learn > /dev/null; then
              echo "web is up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "the web app never became healthy"
          cat /tmp/web.log
          exit 1

      - name: Smoke test (strict)
        run: pnpm run test:smoke -- --strict

      - name: Load harness
        # A deliberately tiny shape. The point is that it runs at all and completes real
        # hands over real sockets, not the numbers — see the header of scripts/load-test.mjs,
        # which is explicit that this is a loopback regression check and NOT a capacity
        # measurement.
        run: pnpm run test:load -- --tables 1 --seats 3 --hands 3

      - name: API log
        if: always()
        run: cat /tmp/api.log || true

      - name: Web log
        if: always()
        run: cat /tmp/web.log || true

      - name: Stop the API
        if: always()
        run: kill "$(cat /tmp/api.pid)" || true

      - name: Stop the web app
        if: always()
        # `pnpm --filter … start` is a wrapper, so killing the recorded pid can
        # leave Next holding the port (see ManagedServer in scripts/a11y-audit.mjs).
        # The runner is destroyed either way; both are named so the intent is not
        # left to that.
        run: |
          kill "$(cat /tmp/web.pid)" || true
          pkill -f 'next start' || true

  # -------------------------------------------------------------------------
  # 5c. The statistical evidence that the opponent profiles actually differ.
  #
  # 8,000 hands per profile, two-proportion z-tests at alpha = 0.001, Spearman rho
  # of declared against observed VPIP, cross-seed agreement, and byte-identical
  # reproduction under a fixed seed. It is the only thing in the repository that
  # substantiates "the profiles differ measurably", it takes about two minutes, and
  # before this job the only way to run it was to construct the pnpm --filter
  # invocation by hand. Its own job rather than a step in `test`, so a two-minute
  # statistical suite never becomes the reason nobody runs the fast tests.
  # -------------------------------------------------------------------------
  simulation:
    name: Opponent-profile simulation
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Simulate
        run: pnpm run test:simulation

  # -------------------------------------------------------------------------
  # 6. Build everything the way a release would.
  # -------------------------------------------------------------------------
  build:
    name: Build
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

  # -------------------------------------------------------------------------
  # 6b. Build the release artefacts.
  #
  # The two Docker images are what actually ships, and until now nothing in CI
  # built either of them: `grep "docker build" .github/workflows/*.yml` matched
  # only comments. Both Dockerfiles carry multi-stage logic whose past failures
  # their own headers document, and both run `pnpm install --frozen-lockfile`
  # against the *Linux* dependency set — the 58 platform-specific optionals that
  # a macOS developer never installs and that `dep-shapes.mjs` therefore cannot
  # read from disk. A build here is the only automated check that the release
  # artefact assembles at all.
  #
  # `docker build` directly rather than docker/build-push-action: nothing is
  # pushed, the runner already has BuildKit, and a third-party action here would
  # be one more trust boundary in the job that produces the thing we ship.
  # -------------------------------------------------------------------------
  containers:
    name: Container images
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the API image
        run: docker build --file Dockerfile.api --tag prl-api:ci .

      - name: Build the web image
        run: docker build --file Dockerfile.web --tag prl-web:ci .

      - name: Check both images run as a non-root user
        # A container that ships as root undoes the least-privilege story the
        # rest of this pipeline tells. Both Dockerfiles set `USER node`; this
        # asserts the built image agrees with the file.
        run: |
          for image in prl-api:ci prl-web:ci; do
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            if [ "$user" != "node" ]; then
              echo "$image runs as '${user:-root}', expected 'node'"
              exit 1
            fi
            echo "$image runs as $user"
          done

  # -------------------------------------------------------------------------
  # 7. Accessibility audit of the built web app.
  #
  # The audit is static (it parses server-rendered HTML — see the file header of
  # scripts/a11y-audit.mjs for exactly what that does and does not cover), but it
  # still wants pages that rendered with a working API behind them: a route that
  # fell back to an error state is not the markup we ship, and auditing it
  # produces both false alarms and false confidence. So this job brings up
  # PostgreSQL, migrates, seeds the content, and asks the audit to start the API
  # alongside the web server.
  # -------------------------------------------------------------------------
  a11y:
    name: Accessibility (static)
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_a11y
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_a11y"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # As in `end-to-end`: the audit starts the API with `--with-api`, so the
      # pages it audits are rendered by a server running as a `prl_app` member.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_a11y
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_a11y

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate and seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: |
          pnpm run db:migrate
          pnpm run db:seed

      - name: Grant a login identity membership of prl_app
        # See the identical step in `end-to-end`, and the header section that
        # explains why the runtime role is NOLOGIN.
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_a11y \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_a11y TO prl_ci_app;
          SQL

      - name: Accessibility audit
        # `--out` is opt-in so a local run does not leave an untracked report file
        # behind; CI wants the file so the next step can publish it.
        run: pnpm run test:a11y -- --with-api --out a11y-report.json

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-report
          path: a11y-report.json
          if-no-files-found: warn
          retention-days: 14

  # -------------------------------------------------------------------------
  # 8. The COMPUTED accessibility tree, walked in real Chrome.
  #
  # `test:ax` is one of the fourteen gates `pnpm run verify` blocks a release on,
  # and it ran in no workflow at all: before this job,
  # `grep -n 'test:ax' .github/workflows/*.yml` matched nothing. A change that
  # broke the tree therefore passed CI — including the one failure mode this
  # audit exists for that is not an accessibility defect at all: a face-down
  # card whose rank or suit reaches a computed accessible name has leaked
  # hidden information to anybody running a screen reader while looking
  # perfectly correct on screen.
  #
  # Its own job rather than a step in `a11y`, because the two measure different
  # layers and only one of them is fast. `a11y-audit.mjs` parses server-rendered
  # HTML; this drives Chrome through six journeys and sits down at a live table,
  # playing a hand over a real socket and replaying it at `/review/<handId>`.
  #
  # ## What the job has to supply, and how that was established
  #
  # `test:ax` runs `--start --with-api`, so the script starts BOTH servers and
  # the job supplies only the environment they boot from. That is exactly the
  # shape that made the `a11y` job exit 78 on every run, so it was measured
  # rather than assumed: the step below was run with EXACTLY the two variables
  # this job sets and nothing else, and with `.env` MOVED ASIDE, which is the
  # state of a fresh checkout —
  #
  #     env -i PATH=… HOME=… CI=true COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
  #       NPM_CONFIG_UPDATE_NOTIFIER=false \
  #       DATABASE_URL=postgres://prl_ci_app:…@127.0.0.1:5432/… \
  #       DATABASE_URL_ADMIN=… \
  #       pnpm run test:ax -- --json ax-tree-report.json
  #
  # against a migrated and seeded scratch database, connecting as a `prl_app`
  # member. It printed ".env not found. Continuing without it.", started both
  # servers, and finished "checks passed 111, checks failed 0" — exit 0, in
  # Chrome 151.0.7922.174 headless.
  #
  # `DATABASE_URL` is the only variable the API itself requires, and it requires
  # it outside production too: with it removed, `node apps/api/dist/server.js`
  # prints "Refusing to start: 1 configuration problem. - DATABASE_URL is
  # required but missing or empty" and exits 78. `SESSION_COOKIE_SECRET` and
  # `PUBLIC_WEB_ORIGIN` are NOT needed, and that is not luck: the audit starts
  # the API without forcing `NODE_ENV=production` (its own comment at that spawn
  # says why) and hands it `PUBLIC_WEB_ORIGIN` itself, set to the audit's own
  # origin so that CORS and the WebSocket `Origin` check admit the browser this
  # job drives.
  #
  # Ports are the script's, not this job's: the web app on 3456
  # (`PRL_WEB_ORIGIN`, set by the `test:ax` script), the API on 3001, and a
  # second web app on 3459 with a dead API behind it for certification assertion
  # 8.2. Nothing else in this job binds any of them.
  #
  # ## The one thing that cannot be measured from here
  #
  # The runner image. This job needs a Chrome the audit's candidate list can
  # find — `CHROME_PATH`, then `/usr/bin/google-chrome`, `/usr/bin/chromium`,
  # `/usr/bin/chromium-browser`. "Resolve the browser" below walks that same
  # list and pins the answer into `CHROME_PATH`, so an image without one fails
  # at a step that says exactly that instead of two minutes into an audit.
  # -------------------------------------------------------------------------
  ax-tree:
    name: Accessibility tree (real Chrome)
    needs: supply-chain
    runs-on: ubuntu-24.04
    # The audit plays a hand at a live table and waits on bots, on top of a full
    # workspace build. It takes about three minutes on a warm laptop.
    timeout-minutes: 45

    services:
      postgres:
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_ax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_ax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # As in `a11y` and `end-to-end`: the job default is the least-privileged
      # identity, because the API the audit starts inherits it and a missing
      # GRANT should fail this build rather than a deployment. The steps that
      # legitimately need more override it with DATABASE_URL_ADMIN.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_ax
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_ax

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        # The whole workspace, not `build:packages`: the audit runs
        # `next start`, which serves a production build, and `node
        # dist/server.js`, which is the compiled API.
        run: pnpm run build

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate and seed
        # The live-table and replay assertions need content in the database, and
        # owning a schema is what the runtime role must not be able to do.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: |
          pnpm run db:migrate
          pnpm run db:seed

      - name: Grant a login identity membership of prl_app
        # See the identical step in `end-to-end`, and the header section that
        # explains why the runtime role is NOLOGIN.
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_ax \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_ax TO prl_ci_app;
          SQL

      - name: Resolve the browser
        # The audit finds Chrome itself, from this same list. Resolving it here
        # first turns "no browser on this image" into a named failure, and
        # pinning the answer into CHROME_PATH means the audit drives the binary
        # whose version this step printed rather than a second candidate.
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              "$candidate" --version
              echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome on this runner image, so the accessibility TREE cannot be walked."
          echo "The audit needs one of: /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser"
          exit 1

      - name: Accessibility-tree audit
        # `--json` is opt-in so a local run leaves no untracked file behind; CI
        # wants it so the next step can publish the findings.
        run: pnpm run test:ax -- --json ax-tree-report.json

      - name: Upload the accessibility-tree report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ax-tree-report
          path: ax-tree-report.json
          if-no-files-found: warn
          retention-days: 14

  # -------------------------------------------------------------------------
  # 9. The gates that need a production build and a real browser, and nothing
  #    else.
  #
  # Three gates, one shape: `next build && next start`, driven by Chrome, with
  # no API and no database anywhere near them. They are in one job for the same
  # reason `end-to-end` puts the smoke test and the load harness together — they
  # need the same thing, and building the workspace three times to run them
  # apart would be the whole cost of the job, three times.
  #
  #   * `design:contrast` — see section 2. It was a step in `lint`, in a job
  #     with no build, so its third pass could not run at all.
  #   * `test:csp` — the browser-level negative control. Everything else in this
  #     repository that touches the Content-Security-Policy asserts the policy's
  #     VALUE or that the header ARRIVED; `fetch` does not enforce a policy. This
  #     is the only thing that proves a browser refuses the injection, and it ran
  #     in no workflow.
  #   * `test:age-gate` — the age gate is a LEGAL control that is OFF by default,
  #     which is exactly why it needs a gate of its own: a gate that silently
  #     fails looks identical to the shipped configuration. It ran in no workflow
  #     either.
  #   * `test:layout` — the painted text. It measures `Range.getClientRects()`
  #     over every text node on every route, in both themes, at 360/768/1024/
  #     1440/1920, and it exists because a collapsed grid track in the Coach rail
  #     shipped with every gate above it green: the boxes did not overlap, the
  #     text did. It also runs six injected negative controls before the sweep,
  #     so a broken detector fails the job rather than going quiet.
  #
  # ## What the job has to supply, and how that was established
  #
  # Nothing but the build and the browser, and that was measured rather than
  # assumed. Each of the three steps below was run verbatim, with EXACTLY the
  # environment this job gives it and no more — `env -i PATH=… HOME=… CI=true
  # COREPACK_ENABLE_DOWNLOAD_PROMPT=0 NPM_CONFIG_UPDATE_NOTIFIER=false`, no
  # `.env`, no `DATABASE_URL` of any kind, against a `pnpm run build`:
  #
  #   * `pnpm run design:contrast` — all three passes PASS over 38 pages and
  #     10,884 composited text elements, 145 probes against real screenshot
  #     pixels, exit 0.
  #   * `pnpm run test:csp -- --out csp-negative-control.json` — 11 checks
  #     passed, 0 failed, 7 injections refused, 4 positive controls, exit 0.
  #   * `pnpm run test:age-gate -- --out age-gate-report.json` — 36 checks
  #     passed, 0 failed, 17 refusals proved, 19 open routes proved, 8 of them
  #     in a browser, exit 0.
  #
  # Neither wants an API: `test:csp` does not pass `--with-api`, and every
  # server the age-gate audit starts is a web app it configures itself
  # (`PRL_AGE_GATE=on`, and the two scopes on two ports, because a gate that is
  # off cannot be measured).
  #
  # Ports are the scripts' own and do not collide: 3457 for the CSP control,
  # 3458 and 3459 for the age gate's two scopes, 3462 for the contrast sweep,
  # 3463 for the painted-text sweep.
  #
  # ## Teardown
  #
  # There is none, deliberately. Each script owns the servers it starts and
  # stops them in a `finally`, including on a failing check — unlike
  # `end-to-end`, where the job itself backgrounds them. The only case that
  # leaks a `next start` is the job timeout killing the script outright, and
  # that case destroys the runner a moment later.
  # -------------------------------------------------------------------------
  browser-gates:
    name: Contrast, painted text, CSP and age gate (real Chrome)
    needs: supply-chain
    runs-on: ubuntu-24.04
    # Four browser sweeps on top of a full build. The contrast pass alone walks
    # every route in both themes and screenshots each one, and the painted-text
    # pass walks them again at five widths.
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        # All three gates measure a PRODUCTION build and say so: the development
        # Content-Security-Policy adds `'unsafe-eval'` and an HMR websocket on
        # purpose, so a pass against `next dev` would be worth nothing.
        run: pnpm run build

      - name: Resolve the browser
        id: browser
        # Same list, same reason, as the `ax-tree` job above.
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              "$candidate" --version
              echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome on this runner image, so none of the three gates below can run."
          echo "They need one of: /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser"
          exit 1

      - name: Contrast budget
        # Three passes: the token set, the pairings a component may use, and the
        # composited background of every element carrying text, walked in real
        # Chrome on every route in both themes.
        run: pnpm run design:contrast

      - name: CSP negative control
        # These three gates are independent measurements that happen to want the
        # same two things, so a failure in one must not hide the verdicts of the
        # others — `pnpm run verify` runs every gate after a failure for exactly
        # that reason. The condition is on the BROWSER step rather than
        # `always()`: if the build or the browser is missing, there is nothing to
        # measure and a second confusing failure helps nobody.
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:csp -- --out csp-negative-control.json

      - name: Age gate
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:age-gate -- --out age-gate-report.json

      - name: Painted text
        # Six negative controls first — a defect of each shape put back into a
        # real page — then 15 routes x 2 themes x 5 widths. The controls are the
        # half that matters in CI: a sweep reporting nothing and a detector that
        # examined nothing print the same thing, and only one of them is good
        # news.
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:layout -- --out text-layout-report.json

      - name: Upload the browser-gate reports
        # `always()`, because the report of a FAILING run is the one worth
        # reading: both files record every check, its verdict and its evidence.
        if: always()
