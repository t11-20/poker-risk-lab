# Continuous integration for Poker Risk Lab.
#
# ## Pinning
#
# A tag such as `uses: actions/checkout@v7` is a moving pointer its owner, or anyone who compromises
# them, can repoint at new code that then runs here with the job's permissions. So every `uses:` is a
# full 40-character commit SHA with a comment naming the version it resolves to, and refreshing one is
# a reviewed diff. `scripts/supply-chain/ci-pinning.mjs` enforces this in the release audit: it fails
# on an unpinned `uses:`, a floating `runs-on: *-latest`, an undigested service container, an unpinned
# Dockerfile `FROM`, or a workflow file not declared in `EXPECTED_WORKFLOWS`.
#
# How the SHAs below were obtained (repeat this to refresh them):
#
#     git ls-remote --tags https://github.com/actions/checkout | grep 'refs/tags/v7'
#     # cross-check the tag is the current stable release and the SHA is a commit:
#     curl -s https://api.github.com/repos/actions/checkout/releases?per_page=5
#     curl -s https://api.github.com/repos/actions/checkout/commits/<sha> | head
#
# For an annotated tag, `git ls-remote` prints two lines — take the one ending
# `^{}`, which is the commit the tag dereferences to. That is what `uses:`
# needs; the other line is the tag object and will not resolve.
#
# ## Secrets
#
# No job needs a secret and none is referenced, so `permissions: contents: read` at the top level is
# the complete set of privileges and nothing below widens it. A job that one day needs a token gets it
# alone, with the reason beside it.
#
# ## Why `supply-chain` gates everything
#
# Linting, testing or building an unaudited dependency graph executes unaudited third-party code
# before deciding whether it is safe, so every other job `needs:` the audit.
#
# ## Why every install passes `--ignore-scripts`
#
# pnpm-workspace.yaml already sets `ignoreScripts: true`; the flag makes these jobs stop depending on
# that file continuing to say so, as both Dockerfiles already do. Install-time lifecycle hooks are the
# campaign's Pattern A delivery mechanism (docs/security/shai-hulud-snapshot-2026-08-17.md), and the
# gate that watches for them (`dep-shapes.mjs`) runs after the install that would have executed them.
# Residual SUP-020; the flag is the fix.
#
# ## Why there is no dependency cache
#
# A restored `actions/cache` entry is a mutable artifact trusted by path, and cache scoping across refs
# is a known route into a build. The tree installs in roughly fifteen seconds, so a cache would buy
# little for one more action and one more trust boundary. If that changes, pin the cache action by SHA.
#
# ## Which identity the database jobs connect as
#
# `db/migrations/0001_initial.sql` defines two `NOLOGIN` privilege containers: `prl_migrator` owns the
# schema, and `prl_app` holds the narrowest per-table verb set the API needs (no CREATE, no DROP, no
# TRUNCATE, no DELETE on the append-only tables). A real login identity is granted membership out of
# band.
#
# `test`, `end-to-end`, `a11y` and `ax-tree` run as a login role `prl_ci_app` that is a member of
# `prl_app` and nothing else, so a missing GRANT fails CI rather than production. Migrating, seeding
# and creating that role keep the privileged identity, because owning a schema and creating roles are
# exactly what the runtime role must not be able to do. The tests that legitimately need more (the
# fixture helper's `delete from prl.rooms`, and two coverage files that create throwaway databases and
# run ALTER/GRANT/REVOKE to prove the schema gate can fail) ask for `DATABASE_URL_ADMIN` explicitly.

name: CI

# Every change reaches main through a PR, so the PR run is the one that gates it; running on branch
# pushes as well would start a duplicate under a different ref that the concurrency group cannot
# cancel. A branch with no PR gets no CI until one is opened.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Read-only on the repository contents and nothing else — no
# packages, no id-token, no issues, no pull-requests write.
permissions:
  contents: read

# One in-flight run per workflow per ref. Pushing again cancels the run it
# superseded instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack must never stop to ask a human whether to download the pnpm version
  # named in `packageManager`. It still verifies that version's integrity hash.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # Keeps "update available" banners out of the logs; has no effect on resolution.
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  # A change of Markdown files alone runs only the jobs that read docs (supply-chain, lint, test):
  # `.dockerignore` keeps every `*.md` out of the images, and no browser, build or end-to-end script
  # reads one. A skipped job satisfies a required check. Anything this step cannot classify counts as
  # code, so the failure mode is a full run.
  changes:
    name: Classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          # A PR runs on its merge commit, whose first parent is the base it merges into.
          if [ "$EVENT" = pull_request ]; then base=HEAD^1; else base="$BEFORE"; fi
          code=true
          if git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            # --no-renames, or `a.ts` renamed to `a.ts.md` lists only the new name and reads as docs.
            files=$(git diff --no-renames --name-only "$base" HEAD) || files=''
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then code=false; fi
            printf 'changed:\n%s\n' "$files"
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  supply-chain:
    name: Supply-chain audit (gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default is to leave a credential in .git/config for later steps.
          # Nothing here pushes, so leaving one behind is pure downside.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .node-version is shared with local dev and the Dockerfiles, and `engineStrict: true` makes a
          # mismatch a hard failure rather than a test run on a different Node than ships.
          node-version-file: .node-version

      - name: Enable corepack (pins pnpm via the packageManager integrity hash)
        run: corepack enable

      - name: Report the resolved toolchain
        run: |
          node --version
          pnpm --version

      - name: Install
        # --frozen-lockfile: CI must fail when the lockfile and the manifests disagree, not quietly
        # resolve a new graph. --ignore-scripts: see the header; every install in this file carries it,
        # because one job without it is one job that runs a compromised dependency's postinstall.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit
        run: pnpm run security:audit

      - name: Repo hygiene
        # `security:audit` already runs this gate. It is repeated by name because it carries the
        # repo-wide `Math.random` ban, and a release-blocking rule should be visible in the run.
        run: pnpm run security:hygiene

      - name: Upload SBOM and supply-chain reports
        # `always()` so a failing audit still publishes the evidence of what
        # failed. `if-no-files-found: warn` rather than `error` because a gate
        # that crashes before writing its report should surface as the audit
        # failure it is, not as a confusing artifact-upload failure on top.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-reports
          path: |
            docs/sbom/poker-risk-lab.cdx.json
            docs/sbom/osv-report.json
            docs/sbom/provenance-report.json
          if-no-files-found: warn
          retention-days: 30

  # No build needed: Biome reads source, not types. `design:contrast` is in `browser-gates`, because
  # its third pass composites in real Chrome against a production build.
  lint:
    name: Lint
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

  typecheck:
    name: Typecheck
    needs: [supply-chain, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        # Not optional. Each `packages/*` publishes its public surface as
        # `dist/*.d.ts` through its `exports.types`, so `apps/*` cannot be
        # typechecked until those declaration files exist. Without this step the
        # job fails with "cannot find module @prl/poker-engine" and looks like a
        # broken import rather than a missing build.
        run: pnpm run build:packages

      - name: Typecheck
        run: pnpm run typecheck

  # Unit and integration tests. The integration suite needs a real database.
  test:
    name: Tests
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        # Pinned by digest for the same reason the actions are. Refresh with the
        # command in the Dockerfile header.
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          # Throwaway credentials for an ephemeral container destroyed with the job. Deliberately not
          # stored as a secret: a fake secret teaches people to look for secrets that are not there.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The least-privileged identity by default (see the header). The steps that need more (waiting,
      # migrating, creating the role, and the two coverage files that verify the schema gate and the
      # migration runner) override it with DATABASE_URL_ADMIN.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_test
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_test

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build:packages

      - name: Wait for PostgreSQL
        # The service healthcheck already gates the job; this also proves the connection string works,
        # a more useful failure than a timeout inside a test. Admin, because the job's role does not
        # exist yet.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate
        # Owning a schema is exactly what the runtime role must not be able to do.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:migrate

      - name: Grant a login identity membership of prl_app
        # `prl_app` is NOLOGIN by design (see the header): this grants a login identity membership the
        # way a deployment would. The password is a throwaway for an ephemeral container destroyed with
        # the job, deliberately not a repository secret, for the same reason the postgres one is not.
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_test \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_test TO prl_ci_app;
          SQL
          # Prove the identity is bounded rather than assuming it: a role that could
          # still create tables would make this whole job theatre.
          PGPASSWORD=prl-ci-not-a-secret psql --host 127.0.0.1 --username prl_ci_app \
            --dbname poker_risk_lab_test --tuples-only --no-align \
            --command "select rolsuper or rolcreatedb or rolcreaterole from pg_roles where rolname = current_user" \
            | grep -qx f || { echo "prl_ci_app is not bounded"; exit 1; }

      - name: Verify the live schema's security properties
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        # `db:verify` checks what no unit test can see: that `prl_app` has no privileges it should not,
        # that the deck and salt columns do not exist, that every documented constraint is on the table.
        run: pnpm run db:verify

      - name: Test
        # With `DATABASE_URL` set the database-backed tests run, and they cannot skip in silence: with no
        # reachable database `apps/api/test/database-availability.test.ts` fails the run, and its
        # developer waiver is refused whenever `CI` is set.
        run: pnpm run test

  # The 133,784,560-hand enumeration.
  exhaustive:
    name: Exhaustive enumeration
    needs: [supply-chain, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # The suite sets its own `--test-timeout=1800000` (30 minutes per test). The
    # job bound has to sit comfortably above that plus checkout and install, or
    # the job kill would race the test's own timeout and report the wrong thing.
    # It normally finishes in well under a minute on a warm runner.
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Enumerate every seven-card hand
        # No build step: the exhaustive suite imports `../../src/*.ts` directly
        # and Node 24 strips the types, so it tests the source rather than an
        # artefact of it.
        run: pnpm run test:exhaustive

  # Smoke test and load harness against a running server, in one job because both need a migrated
  # database and a started API. `--strict` promotes the smoke test's warnings to failures; two of them
  # are security properties (rate limiting present, an unknown hand answering 404 rather than 500).
  #
  # The web app is started as well as the API: smoke sections 10 and 11 (CSP and security headers on a
  # rendered page, and the PROD-048 guest bootstrap) fetch `PRL_WEB_ORIGIN` and warn when nothing
  # answers, which `--strict` makes a failure.
  end-to-end:
    name: Smoke + load (running server)
    needs: [supply-chain, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The least-privileged identity, as in `test`: the API is started with it, so a missing GRANT
      # fails this build. Waiting, migrating, seeding and creating the role use DATABASE_URL_ADMIN.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_e2e
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_e2e
      NODE_ENV: development
      PORT: '3001'
      HOST: 127.0.0.1
      PUBLIC_WEB_ORIGIN: http://localhost:3000
      # Also the smoke test's default, written anyway because it must agree with PUBLIC_WEB_ORIGIN (the
      # API's CORS and WebSocket Origin allowlist) and with the port the web app is started on below.
      PRL_WEB_ORIGIN: http://localhost:3000
      # The API test suite's shared secret (published on purpose; see secret-scan.mjs). It must not
      # contain "secret", or config.ts's placeholder warning fires on every boot.
      SESSION_COOKIE_SECRET: Zk7pQ2vR9tX4bN6mL1sD8gH3jF5wC0yA
      # A multi-table load run opens one guest session per seat, which the shipped limits correctly
      # refuse. Raised here for the harness rather than lowered in the server; the harness prints the
      # figure it needs when it sees a 429.
      RATE_LIMIT_MAX: '5000'
      # Turns on the test-only reset control (`loadConfig` refuses it in production) that both harnesses
      # read. Smoke's section 12 drains the guest bucket on purpose, so without it the load harness that
      # follows gets 0 of 3 guests. Not a credential: the API lives and dies with the job.
      RATE_LIMIT_RESET_TOKEN: ci-rate-limit-reset-9fK2mQ7vT4wZ8bN1 # prl-allow-secret: test-only reset token for a throwaway CI API
      LOG_LEVEL: warn

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        # The whole workspace: `next start` below serves a production build. NODE_ENV is overridden
        # because the job-level `development` is the API's, `next build` under it is not the artefact
        # `next start` expects to serve, and the smoke test's CSP section reads that artefact's headers.
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate and seed
        # Schema ownership and role creation are precisely what the runtime role
        # must not be able to do, so these run as the privileged identity.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: |
          pnpm run db:migrate
          pnpm run db:seed

      - name: Grant a login identity membership of prl_app
        # As in `test`; see the header for why `prl_app` is NOLOGIN.
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_e2e \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_e2e TO prl_ci_app;
          SQL
          # Prove the identity is bounded rather than assuming it, as in `test`.
          PGPASSWORD=prl-ci-not-a-secret psql --host 127.0.0.1 --username prl_ci_app \
            --dbname poker_risk_lab_e2e --tuples-only --no-align \
            --command "select rolsuper or rolcreatedb or rolcreaterole from pg_roles where rolname = current_user" \
            | grep -qx f
          if PGPASSWORD=prl-ci-not-a-secret psql --host 127.0.0.1 --username prl_ci_app \
               --dbname poker_risk_lab_e2e --set ON_ERROR_STOP=1 --quiet \
               --command "create table prl.ci_should_not_be_allowed (x int)" 2>/dev/null; then
            echo "prl_ci_app can create tables in the prl schema — the least-privilege model is not in effect"
            exit 1
          fi
          echo "prl_ci_app is a member of prl_app and cannot create objects"

      - name: Start the API
        # Backgrounded, then polled: a fixed sleep either wastes time or races the boot.
        # The log is kept so a failure below can be attributed.
        run: |
          node apps/api/src/server.ts > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health > /dev/null; then
              echo "api is up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "the API never became healthy"
          cat /tmp/api.log
          exit 1

      - name: Start the web app
        # The subject of smoke-test sections 10 and 11, backgrounded and polled like the API. PORT and
        # NODE_ENV are overridden because the job values are the API's (3001, and `development` because
        # `loadConfig` refuses a production process without a real SESSION_COOKIE_SECRET).
        # PRL_API_ORIGIN is a literal address: the API binds 127.0.0.1, and `localhost` on a runner may
        # resolve to ::1 first.
        env:
          PORT: '3000'
          NODE_ENV: production
          PRL_API_ORIGIN: http://127.0.0.1:3001
        run: |
          pnpm --filter @prl/web start > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:3000/learn > /dev/null; then
              echo "web is up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "the web app never became healthy"
          cat /tmp/web.log
          exit 1

      - name: Smoke test (strict)
        run: pnpm run test:smoke -- --strict

      - name: Load harness
        # A deliberately tiny shape: the point is that real hands complete over real sockets.
        # scripts/load-test.mjs is a loopback regression check, NOT a capacity measurement.
        run: pnpm run test:load -- --tables 1 --seats 3 --hands 3

      - name: API log
        if: always()
        run: cat /tmp/api.log || true

      - name: Web log
        if: always()
        run: cat /tmp/web.log || true

      - name: Stop the API
        if: always()
        run: kill "$(cat /tmp/api.pid)" || true

      - name: Stop the web app
        if: always()
        # `pnpm --filter … start` is a wrapper, so killing the recorded pid can leave Next holding the
        # port (see ManagedServer in scripts/gate-servers.mjs).
        run: |
          kill "$(cat /tmp/web.pid)" || true
          pkill -f 'next start' || true

  # The statistical evidence that the opponent profiles differ: 8,000 hands per profile,
  # two-proportion z-tests at alpha = 0.001, Spearman rho of declared against observed VPIP, cross-seed
  # agreement, and byte-identical reproduction under a fixed seed. About two minutes, so it is its own
  # job rather than a reason nobody runs the fast tests.
  simulation:
    name: Opponent-profile simulation
    needs: [supply-chain, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Simulate
        run: pnpm run test:simulation

  build:
    name: Build
    needs: [supply-chain, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

  # The two images are what ships. Both run `pnpm install --frozen-lockfile` against the Linux
  # dependency set, whose platform-specific optionals a macOS developer never installs and
  # `dep-shapes.mjs` therefore cannot read from disk, so this build is the only automated check that the
  # release artefact assembles. `docker build` rather than docker/build-push-action: nothing is pushed,
  # the runner has BuildKit, and a third-party action would be one more trust boundary in the job that
  # produces what ships.
  containers:
    name: Container images
    needs: [supply-chain, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the API image
        run: docker build --file Dockerfile.api --tag prl-api:ci .

      - name: Build the web image
        run: docker build --file Dockerfile.web --tag prl-web:ci .

      - name: Check both images run as a non-root user
        # An image that runs as root undoes the least-privilege model. Both Dockerfiles set `USER node`;
        # this asserts the built images agree with the files.
        run: |
          for image in prl-api:ci prl-web:ci; do
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            if [ "$user" != "node" ]; then
              echo "$image runs as '${user:-root}', expected 'node'"
              exit 1
            fi
            echo "$image runs as $user"
          done

  # Static accessibility audit (scripts/a11y-audit.mjs says what it does and does not cover). It parses
  # server-rendered HTML, but a route that fell back to an error state is not the markup we ship, so
  # this job migrates and seeds PostgreSQL and the audit starts the API alongside the web server.
  a11y:
    name: Accessibility (static)
    needs: [supply-chain, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_a11y
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_a11y"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # As in `end-to-end`: the audit starts the API with `--with-api`, so the
      # pages it audits are rendered by a server running as a `prl_app` member.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_a11y
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_a11y

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate and seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: |
          pnpm run db:migrate
          pnpm run db:seed

      - name: Grant a login identity membership of prl_app
        # As in `test`; see the header for why `prl_app` is NOLOGIN.
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_a11y \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_a11y TO prl_ci_app;
          SQL

      - name: Accessibility audit
        # `--out` is opt-in so a local run does not leave an untracked report file
        # behind; CI wants the file so the next step can publish it.
        run: pnpm run test:a11y -- --with-api --out a11y-report.json

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-report
          path: a11y-report.json
          if-no-files-found: warn
          retention-days: 14

  # The COMPUTED accessibility tree and the keyboard, both in real Chrome. A face-down card whose rank
  # or suit reaches a computed accessible name leaks hidden information to a screen-reader user while
  # looking correct on screen. Its own job rather than a step in `a11y`, which only parses HTML and is
  # fast. `test:keyboard` is here rather than in `browser-gates`, which deliberately has no API and no
  # database, because it folds a real hand at a socket-backed table.
  #
  # Both scripts run `--start --with-api` and start their own servers; the job supplies only the
  # environment, and a fresh checkout has no `.env`. `DATABASE_URL` is the only variable the API
  # requires, outside production too (without it the API exits 78). `SESSION_COOKIE_SECRET` and
  # `PUBLIC_WEB_ORIGIN` are not needed: the audit starts the API without forcing `NODE_ENV=production`
  # and passes its own origin as `PUBLIC_WEB_ORIGIN`, so CORS and the WebSocket `Origin` check admit the
  # browser this job drives.
  #
  # `test:ax` ports: the web app on 3456, the API on 3001, a second web app on 3459 with a dead API
  # behind it (assertion 8.2), and a third on 3465 behind an in-process corrupting proxy on 3467
  # (assertion 6.7).
  #
  # The runner image needs a Chrome from the audit's candidate list (`CHROME_PATH`, then
  # `/usr/bin/google-chrome`, `/usr/bin/chromium`, `/usr/bin/chromium-browser`). "Resolve the browser"
  # walks the same list and pins `CHROME_PATH`, so an image without one fails at a step that says so.
  ax-tree:
    name: Accessibility tree and keyboard journeys (real Chrome)
    needs: [supply-chain, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Two audits that each play a hand at a live table and wait on bots, on top of a full build:
    # `test:ax` takes about three minutes on a warm laptop and `test:keyboard` about one.
    timeout-minutes: 45

    services:
      postgres:
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_ax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_ax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The least-privileged identity, as in `test`: the API the audit starts inherits it.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_ax
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_ax

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        # The whole workspace, not `build:packages`: the audit runs
        # `next start`, which serves a production build, and `node
        # dist/server.js`, which is the compiled API.
        run: pnpm run build

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate and seed
        # The live-table and replay assertions need content in the database, and
        # owning a schema is what the runtime role must not be able to do.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: |
          pnpm run db:migrate
          pnpm run db:seed

      - name: Grant a login identity membership of prl_app
        # As in `test`; see the header for why `prl_app` is NOLOGIN.
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_ax \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_ax TO prl_ci_app;
          SQL

      - name: Resolve the browser
        # The audit finds Chrome itself, from this same list. Resolving it here
        # first turns "no browser on this image" into a named failure, and
        # pinning the answer into CHROME_PATH means the audit drives the binary
        # whose version this step printed rather than a second candidate.
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              "$candidate" --version
              echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome on this runner image, so the accessibility TREE cannot be walked."
          echo "The audit needs one of: /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser"
          exit 1

      - name: Accessibility-tree audit
        # `--json` is opt-in so a local run leaves no untracked file behind; CI
        # wants it so the next step can publish the findings.
        run: pnpm run test:ax -- --json ax-tree-report.json

      - name: Keyboard journeys
        # Not conditioned on the step above: a broken accessibility tree must not hide a broken tab
        # order. `!cancelled()` rather than `always()`: a cancelled run has nothing to say.
        if: ${{ !cancelled() }}
        run: pnpm run test:keyboard -- --json keyboard-report.json

      - name: Upload the accessibility-tree and keyboard reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ax-tree-report
          path: |
            ax-tree-report.json
            keyboard-report.json
          if-no-files-found: warn
          retention-days: 14

  # The gates that need a production build and a real browser and nothing else: `next build && next
  # start` driven by Chrome, with no API and no database. One job, so the workspace is built once.
  #
  #   * `design:contrast` composites the background of every element carrying text in real Chrome.
  #   * `test:csp` is the browser-level negative control. Everything else that touches the
  #     Content-Security-Policy asserts the policy's VALUE or that the header ARRIVED, and `fetch` does
  #     not enforce a policy; only this proves a browser refuses the injection.
  #   * `test:age-gate`: the age gate is a LEGAL control that is OFF by default, so a gate that silently
  #     failed would look identical to the shipped configuration.
  #   * `test:layout` measures `Range.getClientRects()` over every text node on every route, in both
  #     themes, at 360/768/1024/1440/1920, because boxes can sit apart while their text overlaps. Its six
  #     injected negative controls run first, so a broken detector fails the job rather than going quiet.
  #
  # None needs `.env` or a `DATABASE_URL`: `test:csp` does not pass `--with-api`, and every server the
  # age-gate audit starts is a web app it configures itself (`PRL_AGE_GATE=on`, two scopes on two ports,
  # because a gate that is off cannot be measured). Ports are the scripts' own and do not collide: 3457
  # for the CSP control, 3458 and 3459 for the age gate, 3462 for contrast, 3463 for painted text.
  #
  # No teardown step: each script stops the servers it starts in a `finally`, including on a failing
  # check. Only a job timeout leaks a `next start`, and that destroys the runner a moment later.
  browser-gates:
    name: Contrast, painted text, CSP and age gate (real Chrome)
    needs: [supply-chain, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Four browser sweeps on top of a full build. The contrast pass alone walks
    # every route in both themes and screenshots each one, and the painted-text
    # pass walks them again at five widths.
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        # Every gate here measures a PRODUCTION build: the development Content-Security-Policy adds
        # `'unsafe-eval'` and an HMR websocket on purpose, so a pass against `next dev` is worth nothing.
        run: pnpm run build

      - name: Resolve the browser
        id: browser
        # Same list, same reason, as the `ax-tree` job above.
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              "$candidate" --version
              echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome on this runner image, so none of the three gates below can run."
          echo "They need one of: /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser"
          exit 1

      - name: Contrast budget
        # Three passes: the token set, the pairings a component may use, and the
        # composited background of every element carrying text, walked in real
        # Chrome on every route in both themes.
        run: pnpm run design:contrast

      - name: CSP negative control
        # Independent measurements, so a failure in one must not hide the others' verdicts (as in
        # `pnpm run verify`). Conditioned on the BROWSER step rather than `always()`: with no build or
        # no browser there is nothing to measure.
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:csp -- --out csp-negative-control.json

      - name: Age gate
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:age-gate -- --out age-gate-report.json

      - name: Painted text
        # Six negative controls first, a defect of each shape put back into a real page, then every
        # route x 2 themes x 5 widths. The controls matter most: a sweep reporting nothing and a
        # detector that examined nothing print the same thing.
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:layout -- --out text-layout-report.json

      - name: Upload the browser-gate reports
        # `always()`, because the report of a FAILING run is the one worth reading: each file records
        # every check, its verdict and its evidence.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-gate-reports
          path: |
            csp-negative-control.json
            age-gate-report.json
            text-layout-report.json
          if-no-files-found: warn
          retention-days: 14
