# Keyless release signing: the images built by `Release` are signed by an identity, not a key.
#
# The key-based `release:sign` proves possession of a key, not the identity of a builder. Here the
# job's short-lived GitHub OIDC token is exchanged with Fulcio for a ten-minute certificate whose SAN
# is this workflow's URI, recorded in Rekor's public log: no long-lived secret exists, and the claim
# becomes "this workflow file, in this repository, on this ref".
#
# The identity is DERIVED from `deploy/signing/keyless-policy.json`, never written here, and
# `scripts/supply-chain/keyless-provenance.mjs` holds this file to it: a rename, a second job with
# `id-token: write`, or a trigger that can run on another ref fails that gate instead of widening
# what a verifier accepts.
#
# `id-token: write` is on the `sign` job, never at the top: a workflow-level grant is inherited by
# every job, and any job holding it can mint a token Fulcio binds to THIS workflow's identity.
# `ci.yml` and `release.yml` grant no `id-token` at all.
#
# `workflow_run`, not a tag push, for two reasons. Build once: this job signs `release.yml`'s
# artefacts, never bytes of its own build that no staging run tested. One reachable ref: GitHub runs
# a `workflow_run` workflow from the DEFAULT BRANCH, so the identity always ends
# `@refs/heads/main` and the policy can demand an exact string; a regexp in the ref position accepts
# a signature from any branch a contributor can push. The tagged commit is checked by a step below.
#
# Pinning: every `uses:` is a full 40-character commit SHA with the version in a trailing comment,
# enforced by `scripts/supply-chain/ci-pinning.mjs`, which also refuses any workflow not in
# `EXPECTED_WORKFLOWS`. cosign and trivy are downloaded at pinned versions and checksum-verified.
#
# Status: IMPLEMENTED AND UNEXERCISED. The first run needs a real GitHub repository, network access
# to Fulcio and Rekor, and a `Release` run to follow; until then the provenance posture is the
# key-based one.

name: Release signing (keyless)

on:
  # Follows a completed `Release` run. Never `push`, `pull_request` or
  # `pull_request_target`: a workflow that can mint a signing identity must never
  # run on a ref a contributor controls.
  workflow_run:
    workflows: ['Release']
    types: [completed]

# Least privilege at the top; the signing job widens its OWN block below.
permissions:
  contents: read

# A release must never be signed twice concurrently: two runs would push two
# signatures for the same digest. Not cancel-in-progress — a half-finished
# signing run should finish.
#
# Keyed on the COMMIT, not `workflow_run.id`: a run id is unique per run, so that group serialises
# nothing. Two `Release` runs of one commit (a re-pushed tag) push two different digests, because
# `docker build` is not reproducible, under one `<shortSha>` tag; grouping by head_sha makes them queue.
concurrency:
  group: release-sign-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  # 3.1.3 is the version the key-based path is exercised with locally, so both postures speak the
  # same cosign.
  COSIGN_VERSION: '3.1.3'

jobs:
  sign:
    name: Sign the release images keylessly
    # `workflow_run` fires whatever the conclusion, so require success. A REHEARSAL
    # (`workflow_dispatch`, `dry_run: true` by default) also concludes success with branch images,
    # so require `push` too: `release.yml`'s only push trigger is `tags: v*`.
    # `release-promotable.json` below is the independent half, recording what the run decided.
    # One line, and it stays one line: in a folded scalar a MORE-indented
    # continuation keeps its newline instead of folding to a space, which would
    # hand GitHub's expression parser a literal line break.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      # Read the checked-out source. Nothing here writes to the repository.
      contents: read
      # Download the manifest and the image tarballs from the run that triggered
      # this one. `workflow_run` artefacts belong to the OTHER run, so the
      # download needs the Actions API rather than the same-run artefact store.
      actions: read
      # Push the images to GHCR: a signature lives beside the image in a
      # registry, so one made against a registry that dies with the runner can never be fetched.
      packages: write
      # THE grant, and the reason this file exists as its own workflow. It lets
      # this job — and, because permissions are per-job, only this job — request
      # the OIDC token that Fulcio exchanges for a ten-minute certificate bound
      # to this workflow's identity. It is never granted at the workflow level:
      # every job would inherit the ability to mint a certificate carrying this
      # repository's name.
      id-token: write

    steps:
      - name: Check out
        # The default ref, which for `workflow_run` is the default branch — the
        # reviewed code, and the code the certificate identity will name. NOT the
        # triggering run's head_sha: that would run a tagged tree's scripts under
        # main's identity.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Deliberately no `pnpm install`: `release-sign.mjs` and `image-provenance.mjs` import only
      # node: builtins and their siblings, so the job producing the provenance executes no
      # dependency graph.

      - name: Install cosign
        # Checksum verified before the binary runs: a signer from a moving reference would put a
        # mutable dependency at the root of the provenance chain.
        run: |
          set -euo pipefail
          base="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          curl --fail --silent --show-error --location -o cosign "${base}/cosign-linux-amd64"
          curl --fail --silent --show-error --location -o cosign_checksums.txt \
            "${base}/cosign_checksums.txt"
          grep ' cosign-linux-amd64$' cosign_checksums.txt | sed 's|cosign-linux-amd64|cosign|' > expected.txt
          sha256sum --check expected.txt
          sudo install -m 0755 cosign /usr/local/bin/cosign
          cosign version

      - name: Install trivy
        # trivy makes the SBOM attestation, as the key-based signer does locally, so both postures
        # attest the same predicate from the same tool. Pinned and checksum-verified as in release.yml.
        env:
          TRIVY_VERSION: '0.72.0'
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --silent --show-error --location -o trivy.tar.gz \
            "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location -o trivy_checksums.txt \
            "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy_checksums.txt > trivy_expected.txt
          sha256sum --check trivy_expected.txt
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Download the release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: deploy/staging
          # The artefacts belong to the run that triggered this one.
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images
          path: release-images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download the promotion attestation
        # Written only by `release.yml`'s `promote` job, so an absent one FAILS the download: there
        # was nothing promoted to sign.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-promotable
          path: deploy/staging
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: The release must have been promoted, not rehearsed
        # Belt and braces with the `if:` above: a loosened condition SKIPS silently, while this
        # fails in the log of the run that tried.
        run: |
          set -euo pipefail
          node -e "
            const attestation = require('./deploy/staging/release-promotable.json');
            const triggered = process.env.TRIGGERING_SHA;
            const problems = [];
            if (attestation.promotable !== true) problems.push('the attestation does not say promotable');
            if (attestation.sha !== triggered) {
              problems.push(\`the promotion was for \${attestation.sha}, this run is for \${triggered}\`);
            }
            if (problems.length > 0) {
              console.error('refusing to sign:');
              for (const problem of problems) console.error('  - ' + problem);
              process.exit(1);
            }
            console.log(\`promoted: \${attestation.sha} via \${attestation.event} \${attestation.ref}\`);
          "
        env:
          TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: The manifest must describe the commit the triggering run built
        # The certificate identity says which workflow ran; this says which source tree it signed.
        run: |
          set -euo pipefail
          built="$(node -e "process.stdout.write(require('./deploy/staging/release-manifest.json').commit.sha)")"
          triggered='${{ github.event.workflow_run.head_sha }}'
          if [ "$built" != "$triggered" ]; then
            echo "the release manifest was built from ${built}, and the run that triggered this"
            echo "signing job was for ${triggered}. Refusing to sign: the artefact and the run"
            echo "describe different source trees."
            exit 1
          fi
          echo "manifest and triggering run agree on ${built}"

      - name: Load the images
        run: |
          docker load -i release-images/api.tar
          docker load -i release-images/web.tar

      - name: Log in to GHCR
        # The only credential here: the run's ephemeral GITHUB_TOKEN, not a stored secret.
        run: |
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Push and sign, keylessly
        # `--keyless` refuses if ACTIONS_ID_TOKEN_REQUEST_URL is absent (`id-token: write` edited
        # away) rather than falling back to an interactive browser flow that would hang the release.
        # Both signature and SBOM attestation go to Rekor, the public record that makes a later
        # compromise detectable.
        run: |
          node scripts/release-sign.mjs \
            --keyless \
            --registry ghcr.io \
            --repository-prefix '${{ github.repository_owner }}' \
            --out deploy/staging/release-signatures.json \
            --json

      - name: Verify the signature this job just made, against the COMMITTED policy
        # Must never be removed: it asserts `deploy/signing/keyless-policy.json`'s identity and
        # issuer, not merely the maths. Fulcio issues a certificate to anybody's Actions job, so a
        # signature under an identity the policy does not name must fail HERE, in the run that made it.
        # The policy's "repository" is null until there is a committed owner; GITHUB_REPOSITORY
        # resolves it, bounded to a repository named poker-risk-lab, and the gate says so.
        run: |
          node scripts/supply-chain/image-provenance.mjs --require-attestation

      - name: Upload the signature record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signatures-keyless
          path: deploy/staging/release-signatures.json
          # `error`: this record IS the output of the job.
          if-no-files-found: error
          retention-days: 90

      - name: What an outsider can now check
        if: always()
        run: |
          {
            echo '### Keyless signature'
            echo ''
            echo 'Identity asserted, from `deploy/signing/keyless-policy.json`:'
            echo ''
            echo '```'
            echo "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-sign.yml@refs/heads/main"
            echo "issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo ''
            echo 'Anyone can re-run the verification with no key and no access to this repository:'
            echo ''
            echo '```'
            echo "cosign verify \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-sign.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ghcr.io/${GITHUB_REPOSITORY_OWNER}/prl-api@<digest>"
            echo '```'
            echo ''
            echo 'The Rekor entry is public: <https://search.sigstore.dev>.'
          } >> "$GITHUB_STEP_SUMMARY"
