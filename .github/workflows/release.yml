# The release pipeline: gates → tests → ONE build → scan → staging → promotion → production.
#
# There is no container registry and no production environment yet. Every step that cannot execute
# is marked `NOT WIRED`, guarded by an `if:` on a repository variable that does not exist, and FAILS
# when that variable is set: a deploy step that is a green tick over an `echo` teaches everyone the
# deploy works.
#
# Build once: `build` runs `release:artifacts`, which builds each Dockerfile once and writes
# `deploy/staging/release-manifest.json` for every later job. No later job may gain a `docker
# build`, or "staging tested this" stops being a statement about bytes. Without a registry the
# images cross runners by `docker save`/`load`, and `scripts/staging.mjs` re-verifies the loaded
# digests against the manifest, so a corrupt tarball fails the identity check instead of deploying.
#
# Rollback (printed with real digests by `rollback-plan`): the application rolls back by redeploying
# the previous digest. The schema never rolls back: `migrate.mjs down` refuses (docs/RUNBOOK.md
# §11.3), so migrations are additive-first and the previous release must run on the NEWER schema.
#
# Permissions: `contents: read` and nothing more; nothing here publishes. A future push job alone
# gets `packages: write`, or better `id-token: write` for OIDC, which stores no long-lived secret.
#
# Pinning: every `uses:` is a full 40-character commit SHA with the version in a trailing comment,
# and every `runs-on` names an explicit runner version. `scripts/supply-chain/ci-pinning.mjs`
# enforces it and refuses any workflow not in `EXPECTED_WORKFLOWS`. See the ci.yml header for how
# the SHAs were obtained.

name: Release

on:
  # Tag-driven, so a release is a deliberate act with a name, never a side-effect of a branch push.
  push:
    tags:
      - 'v*'
  # A rehearsal against a branch. `dry_run` defaults to true so that clicking Run without reading
  # gets a full build, scan and staging verification, and no promotion.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify only; do not promote or deploy'
        type: boolean
        default: true
        required: false

permissions:
  contents: read

# A release must never race another release of the same ref, and — unlike CI —
# an in-flight one must NOT be cancelled: a half-finished deploy is worse than a
# queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  # Nothing is built until the dependency graph is audited and the suite is green, because building
  # means executing the graph.
  gates:
    name: Supply-chain, lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack (pins pnpm via the packageManager integrity hash)
        run: corepack enable

      - name: Install
        # --ignore-scripts: this job installs a dependency graph in order to decide
        # whether it is safe, so it must not run that graph's install-time hooks
        # first. See the ci.yml header.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Supply-chain audit
        # The container-image gate reports "not applicable" here because the images are built in the
        # next job; `container-scan` runs it against the real artefacts as a mandatory step.
        run: pnpm run security:audit

      - name: Base-image digest freshness
        # A REPORT, not a gate (exits 0): it makes a base image rebuilt upstream, usually for a
        # security patch, visible in the release log so refreshing the pinned digest is a decision.
        run: node scripts/supply-chain/ci-pinning.mjs --freshness

      - name: Repository hygiene
        run: pnpm run security:hygiene

      - name: Lint
        run: pnpm run lint

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Typecheck
        run: pnpm run typecheck

  # Against a real database, as the least-privileged identity.
  tests:
    name: Tests
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The job default is the runtime identity, so a missing GRANT fails the
      # release rather than the deployment.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_release
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_release

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build:packages

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:migrate

      - name: Grant a login identity membership of prl_app
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_release \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_release TO prl_ci_app;
          SQL

      - name: Verify the live schema's security properties
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:verify

      - name: Test
        run: pnpm run test

      - name: Enumerate every seven-card hand
        # `!cancelled()`: independent measurements, so a failure in one must not hide the other's
        # verdict, as `pnpm run verify` runs every gate after a failure.
        if: ${{ !cancelled() }}
        run: pnpm run test:exhaustive

      - name: Simulate the opponent profiles
        if: ${{ !cancelled() }}
        run: pnpm run test:simulation

  # The browser gates run here, BEFORE anything is built, so a commit failing one never becomes an
  # artefact offered to `release-sign.yml`. `scripts/release-gate-coverage.mjs`, run inside
  # `pnpm run test`, fails this pipeline when a `verify` gate is not wired in before `build`.
  browser-gates:
    name: Contrast, a11y, ax tree, keyboard, painted text, CSP and age gate (real Chrome)
    needs: gates
    runs-on: ubuntu-24.04
    # Every browser sweep on top of a full build. `test:ax` and `test:keyboard` each play a hand at a
    # live table and wait on bots; the keyboard pass takes about a minute on its own.
    timeout-minutes: 60

    services:
      postgres:
        # postgres:16-bookworm
        image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_risk_lab_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname poker_risk_lab_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # As in `tests`: the servers these gates drive run as a `prl_app` member.
      DATABASE_URL: postgres://prl_ci_app:prl-ci-not-a-secret@127.0.0.1:5432/poker_risk_lab_browser
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/poker_risk_lab_browser

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        # The gates below measure a PRODUCTION build: the development CSP adds `'unsafe-eval'` and an
        # HMR websocket on purpose, so a pass against `next dev` would be worth nothing.
        run: pnpm run build

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: pnpm run db:wait

      - name: Migrate and seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_ADMIN }}
        run: |
          pnpm run db:migrate
          pnpm run db:seed

      - name: Grant a login identity membership of prl_app
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname poker_risk_lab_browser \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'prl_ci_app') THEN
              CREATE ROLE prl_ci_app LOGIN PASSWORD 'prl-ci-not-a-secret';
            END IF;
          END
          $$;
          GRANT prl_app TO prl_ci_app;
          GRANT CONNECT ON DATABASE poker_risk_lab_browser TO prl_ci_app;
          SQL

      - name: Resolve the browser
        id: browser
        # Same list as the browser jobs in ci.yml. A missing Chrome FAILS: the gates below cannot run
        # without one, and skipping them quietly would be a pass.
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              "$candidate" --version
              echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome on this runner image, so the gates below cannot run."
          echo "They need one of: /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser"
          exit 1

      - name: Contrast budget
        run: pnpm run design:contrast

      - name: Accessibility audit
        # Every gate below carries `!cancelled() && steps.browser.outcome`: independent measurements,
        # so one failing must not hide the others' verdicts. It keys on the BROWSER step rather than
        # `always()` because with no browser there is nothing to measure.
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:a11y -- --with-api --out a11y-report.json

      - name: Accessibility tree
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:ax -- --json ax-tree-report.json

      - name: Keyboard journeys
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:keyboard -- --json keyboard-report.json

      - name: CSP negative control
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:csp -- --out csp-negative-control.json

      - name: Age gate
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:age-gate -- --out age-gate-report.json

      - name: Painted text
        # Measures glyphs, not element boxes: a collapsed grid track overflows its text while the
        # boxes never overlap, which every other gate here passes.
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: pnpm run test:layout -- --out text-layout-report.json

      - name: Upload the browser-gate reports
        # `always()`, because the report of a FAILING run is the one worth reading.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-browser-gate-reports
          path: |
            a11y-report.json
            ax-tree-report.json
            keyboard-report.json
            csp-negative-control.json
            age-gate-report.json
            text-layout-report.json
          if-no-files-found: warn
          retention-days: 14

  # The only `docker build` in this workflow, inside `release-artifacts.mjs` so the command a
  # developer types locally is the one that produces the release.
  build:
    name: Build immutable artefacts
    # BOTH, and the pairing is the invariant: a gate that runs BESIDE this job
    # turns the workflow red without stopping anything, because the artefact is
    # still built, scanned, pushed through staging and offered for signing.
    needs: [tests, browser-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Build both images once and record their digests
        # No install step: this script imports only node: builtins, so the release build does not
        # depend on a dependency tree on the machine that produces it.
        run: node scripts/release-artifacts.mjs --verbose

      - name: Save the images for the jobs that consume them
        # `docker save` of the DIGEST reference, not the tag, so `staging`'s identity check is the
        # same assertion a registry pull by digest would be.
        run: |
          set -euo pipefail
          mkdir -p release-images
          api="$(node -e "process.stdout.write(require('./deploy/staging/release-manifest.json').images.api.reference)")"
          web="$(node -e "process.stdout.write(require('./deploy/staging/release-manifest.json').images.web.reference)")"
          docker save "$api" -o release-images/api.tar
          docker save "$web" -o release-images/web.tar
          ls -l release-images

      - name: Upload the release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: deploy/staging/release-manifest.json
          # `error`: every job below reads this file, so a missing one must stop the release here.
          if-no-files-found: error
          retention-days: 90

      - name: Upload the images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images
          path: release-images
          if-no-files-found: error
          retention-days: 30

  # Scans the artefacts that were just built, not "an image like them".
  container-scan:
    name: Container image CVEs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Required: the ubuntu-24.04 image has no pnpm on PATH, so without these two steps `Scan`
      # exits 127 before trivy runs.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack (pins pnpm via the packageManager integrity hash)
        run: corepack enable

      # Deliberately no `pnpm install`: `container-scan.mjs` imports only node: builtins and its
      # sibling lib.mjs, and the job deciding whether the artefacts are safe must not first execute
      # the graph it is judging. corepack is here only so `pnpm run` resolves the script name.

      - name: Download the release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: deploy/staging

      - name: Download the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images
          path: release-images

      - name: Load the images
        run: |
          docker load -i release-images/api.tar
          docker load -i release-images/web.tar

      - name: Install trivy
        # Exact version, verified against its published checksum: a scanner from a moving `latest` is
        # a moving dependency in the job that decides whether the release is safe.
        env:
          TRIVY_VERSION: '0.72.0'
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --silent --show-error --location -o trivy.tar.gz \
            "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location -o checksums.txt \
            "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          # The published checksum file names the archive; grep it out and verify.
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" checksums.txt > expected.txt
          sha256sum --check expected.txt
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan
        # No `continue-on-error`. A blocking finding stops the release; the gate's
        # own policy decides what blocks (fixable at or above HIGH), and the
        # unfixable count is in the report below.
        run: pnpm run security:containers -- --out container-scan.json

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-scan-report
          path: container-scan.json
          if-no-files-found: warn
          retention-days: 90

  # The job that decides whether a digest may be promoted.
  staging:
    name: Staging deploy and verification
    needs: container-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: Install
        # The smoke test and migration runner run from the checkout: Dockerfile.api omits
        # apps/api/scripts so the serving container cannot change the schema (docs/RUNBOOK.md §11.3).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: deploy/staging

      - name: Download the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images
          path: release-images

      - name: Load the images
        run: |
          docker load -i release-images/api.tar
          docker load -i release-images/web.tar

      - name: Initialise staging (local CA, leaf certificate, generated secrets)
        # No repository secret: staging is ephemeral, its CA is created for this run, and its session
        # key and database passwords are generated on the runner and destroyed with it.
        run: node scripts/staging.mjs init

      - name: Bring the stack up on the manifest's digests and verify it
        # The release's evidence: it asserts the RUNNING containers carry the manifest's digests and
        # runs the smoke test over https, WebSocket included, with --strict.
        run: node scripts/staging.mjs up

      - name: Staging logs
        if: always()
        run: node scripts/staging.mjs logs --tail 200 || true

      - name: Upload the staging attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-verified
          path: deploy/staging/staging-verified.json
          if-no-files-found: error
          retention-days: 90

      - name: Tear the stack down
        if: always()
        # `--volumes`: staging data is disposable, and saying so beats relying on the runner dying.
        run: node scripts/staging.mjs down --volumes || true

  # The approval gate is GitHub's `production` environment with required reviewers, not a bespoke
  # one nobody can audit. Until it exists the job still runs the digest comparison.
  promote:
    name: Promotion check (digest identity)
    needs: staging
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Uncomment once a `production` environment with required reviewers exists. An `environment:`
    # naming one that does not exist is created implicitly with NO protection rules, which looks
    # like an approval gate here and is not one anywhere else.
    #   environment:
    #     name: production
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: deploy/staging

      - name: Download the staging attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-verified
          path: deploy/staging

      - name: The digest going to production must be the digest staging tested
        # Prints BOTH digests and exits non-zero when they differ. It does not deploy.
        run: node scripts/staging.mjs promote

      - name: Record that this release was PROMOTED, not rehearsed
        # The artefact `release-sign.yml` refuses to sign without. A rehearsal also concludes
        # success, and this job runs only on a tag push or an explicit `dry_run: false`, so its
        # output is the one artefact that means "promoted".
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const manifest = require('./deploy/staging/release-manifest.json');
            fs.writeFileSync(
              'deploy/staging/release-promotable.json',
              \`\${JSON.stringify({
                promotable: true,
                sha: manifest.commit.sha,
                event: process.env.GITHUB_EVENT_NAME,
                ref: process.env.GITHUB_REF,
                runId: process.env.GITHUB_RUN_ID,
              }, null, 2)}\n\`,
            );
          "
          cat deploy/staging/release-promotable.json

      - name: Upload the promotion attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-promotable
          path: deploy/staging/release-promotable.json
          # `error`: an absent attestation must fail here, not invisibly at the signer.
          if-no-files-found: error
          retention-days: 90

      - name: Record the digests being promoted
        run: |
          {
            echo '### Promoted digests'
            echo ''
            echo '```'
            node -e "const m=require('./deploy/staging/release-manifest.json');
              for (const [name, image] of Object.entries(m.images)) console.log(name.padEnd(4), image.reference);
              console.log('commit', m.commit.sha);"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # NOT WIRED. Skipped while `vars.PRODUCTION_DEPLOY_TARGET` is unset; FAILS when it is set. The four
  # things that must exist first, in order:
  #   1. A registry, and a push in `build` that records the REGISTRY digest: cross-machine promotion
  #      needs a digest a registry vouches for, and the local BuildKit digest is signed by nothing.
  #   2. Credentials, ideally OIDC (`id-token: write` on THIS job alone), so no long-lived secret.
  #   3. A migration from OUTSIDE the serving container, at this commit, as `prl_deployer`
  #      (docs/RUNBOOK.md §5, §11.3), BEFORE the application rolls.
  #   4. A rollout that respects `deploy: replicas: 1` (ADR 0001, RUNBOOK §11.1) or implements room
  #      affinity: two API processes serving one room deal two different hands.
  # This pipeline never auto-runs a destructive database change: `migrate.mjs up` refuses one unless
  # the file carries `-- prl:irreversible: <reason>`, and it ships as two releases.
  production:
    name: Production deploy (NOT WIRED)
    needs: promote
    if: ${{ vars.PRODUCTION_DEPLOY_TARGET != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Refuse to improvise a deployment
        # The variable claims a target exists and this file has no implementation to match it.
        run: |
          echo "PRODUCTION_DEPLOY_TARGET is set to '${{ vars.PRODUCTION_DEPLOY_TARGET }}', but this"
          echo "workflow has no deployment implementation. See the header of this job for the four"
          echo "things that must exist first, in order. Failing rather than pretending."
          exit 1

  # NOT WIRED. It will run the SAME smoke test that cleared staging against the production origin,
  # with --strict, and assert the readiness probe, that `/metrics` is NOT public, and that the
  # deployed digest is the promoted one. A failure here is a ROLLBACK TRIGGER, not a retry.
  post-deploy:
    name: Post-deploy verification (NOT WIRED)
    needs: production
    if: ${{ vars.PRODUCTION_ORIGIN != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refuse to claim a verification that did not happen
        run: |
          echo "PRODUCTION_ORIGIN is set to '${{ vars.PRODUCTION_ORIGIN }}', but no deployment"
          echo "happened, so there is nothing to verify. Failing rather than reporting success."
          exit 1

  # Printed with this release's digests on every run, red ones especially, which is when it is needed.
  rollback-plan:
    name: Rollback plan
    needs: [build, staging]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the previous release tag is what the previous digest is
          # identified by, and a shallow clone has no tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Download the release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: deploy/staging
        continue-on-error: true

      - name: Write the plan
        run: |
          set -uo pipefail
          previous_tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || echo '(none)')"
          {
            echo '## Rollback plan for this release'
            echo ''
            echo '### The digests'
            echo ''
            if [ -f deploy/staging/release-manifest.json ]; then
              echo '```'
              node -e "const m=require('./deploy/staging/release-manifest.json');
                for (const [name, image] of Object.entries(m.images)) console.log('new  ' + name.padEnd(4), image.reference);
                console.log('from commit', m.commit.sha);" 2>/dev/null || echo '(manifest unreadable)'
              echo '```'
            else
              echo 'No manifest: the build did not complete, so nothing was deployed and there is'
              echo 'nothing to roll back.'
            fi
            echo ''
            echo "Previous release tag: \`${previous_tag}\`. The digests it deployed are in that"
            echo 'run'"'"'s `release-manifest` artifact — that artifact IS the rollback target, which'
            echo 'is why its retention is 90 days.'
            echo ''
            echo '### Decision criteria — roll back when ANY of these is true'
            echo ''
            echo '* `/api/v1/ready` returns 503 for more than 2 minutes after the roll settles.'
            echo '* The error rate (`prl_api_errors_total`) or 5xx share is materially above the'
            echo '  pre-deploy baseline. Use `/metrics`; that is what it is for.'
            echo '* WebSocket sessions are closing with 1006 rather than 4503. 1006 means a hard'
            echo '  kill, which points at the orchestrator grace period being at or below'
            echo '  `SHUTDOWN_GRACE_MS` (RUNBOOK §10) rather than at the release.'
            echo '* Hand history stops being written. This is the one silent failure that matters:'
            echo '  the product'"'"'s central promise is that a hand is verifiable afterwards.'
            echo '* The smoke test fails against the production origin.'
            echo ''
            echo '### How to roll back'
            echo ''
            echo '1. **Application: redeploy the previous digest.** Exact, because the images are'
            echo '   content-addressed. Take it from the previous release run'"'"'s manifest artifact.'
            echo '2. **Schema: DO NOT.** There is no `down`. `apps/api/scripts/migrate.mjs down`'
            echo '   refuses and explains why (RUNBOOK §11.3): a down script has by construction'
            echo '   never run against the database it is asked to save, and it cannot restore data'
            echo '   a forward migration removed. The previous release runs against the NEWER'
            echo '   schema — migrations are additive-first so that this is true.'
            echo '3. **If the schema itself is wrong**, the fix is the NEXT migration, never an'
            echo '   edit to an applied one. Applied files are checksummed and immutable.'
            echo '4. **If data is gone**, it is a restore from backup (RUNBOOK §11.4), and the'
            echo '   restore procedure is specific: `migrate.mjs roles` first, no `--no-owner`, no'
            echo '   `--no-privileges`, `--exit-on-error`, restoring identity a member of'
            echo '   `prl_migrator`. `pg_restore` exiting 0 is NOT the test; `pnpm run db:verify`'
            echo '   exiting 0 is.'
            echo ''
            echo '### What makes a release un-rollbackable'
            echo ''
            echo 'A migration in this release that is NOT additive — one carrying'
            echo '`-- prl:irreversible: <reason>`. The previous application cannot run against that'
            echo 'schema. If this release contains one, the rollback path is a restore, and that'
            echo 'should have been a deliberate decision before the release rather than a discovery'
            echo 'during the incident.'
          } >> "$GITHUB_STEP_SUMMARY"
