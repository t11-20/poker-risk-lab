# ---------------------------------------------------------------------------
# Dependabot: turns a red scheduled audit into a pull request.
#
# ## Why this exists
#
# .github/workflows/supply-chain.yml re-runs `security:audit` every day against
# the unchanged lockfile, so an advisory published against a version that is
# already pinned turns that run red within 24 hours. That part worked. What did
# not: the red run was the ONLY signal, and a signal is not a fix. It went red
# on 2026-09-03 and stayed red for 38 consecutive days on the same commit,
# accumulating findings as advisories landed — 35 by 2026-10-10, across next
# 16.3.0, fastify 5.11.3, fast-uri 3.1.5/4.1.2, ip-address 10.5.0, sharp 0.35.3
# and source-map-js 1.2.1, three of them CRITICAL RCEs in Next.js — while the
# fixed versions sat on the registry past the 7-day cooldown. Nothing in the
# repo proposed the bump, so nothing happened until a person read the logs.
#
# This does not make the scheduled audit go green on its own and is not meant
# to. The gate stays the authority; this only means that when it goes red, the
# upgrade is usually already waiting as a PR, and that PR runs ci.yml — the
# same fifteen supply-chain gates plus the rest of `verify` — before anyone
# merges it. A Dependabot PR gets no exemption from any of them.
#
# ## Cooldown matches the registry policy
#
# pnpm-workspace.yaml sets `minimumReleaseAge: 10080` (7 days), and
# `integrity-and-release-age` refuses a lockfile that names anything younger.
# A version-update PR for a release published yesterday would therefore be red
# by construction, so `cooldown.default-days: 7` keeps Dependabot from proposing
# one. Security updates are not subject to Dependabot's cooldown; if a fix is
# younger than 7 days the install refuses it and the PR waits, which is the
# policy working, not a reason to shorten either number.
#
# ## Exact pins survive
#
# Every manifest pins exact (`saveExact: true`, enforced by dependency-shapes);
# Dependabot's `increase` strategy rewrites `5.11.3` to `5.12.5`, never to a
# range, so its PRs pass that gate unchanged.
# ---------------------------------------------------------------------------

version: 2

updates:
  - package-ecosystem: npm
    # The pnpm workspace root: one lockfile, nine manifests found through
    # pnpm-workspace.yaml.
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      # One PR per advisory wave rather than one per package: the 2026-10 wave
      # touched six packages, and six PRs each re-running the full gate for
      # what is one decision is noise that gets ignored.
      security:
        applies-to: security-updates
        patterns: ['*']
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']

  - package-ecosystem: github-actions
    # pinned-action-advisories fails the daily audit when an advisory lands on a
    # pinned SHA, exactly as osv-scan does for npm. Dependabot bumps the SHA AND
    # its `# vX.Y.Z` comment together, which is what that gate checks the
    # comment against, and ci-pinning still requires the result to be a full SHA.
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
